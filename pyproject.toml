[project]
name = "procedural-intelligence"
version = "0.1.0"
description = "OR transcript -> procedural state timeline -> handoff / op-note / family drafts"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "srt>=3.5",
    "rich>=13.7",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]   # only needed for PI_STT=local

[project.scripts]
pi = "pi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi"]

[tool.hatch.build.targets.wheel.force-include]
"pi/profiles" = "pi/profiles"
"web/index.html" = "web/index.html"
