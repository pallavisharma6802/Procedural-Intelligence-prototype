<meta charset="utf-8">
<title>Procedural Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --surface-2:#EEF2F0;
  --ink:#132420; --ink-soft:#5A6C67; --ink-faint:#94A39D;
  --line:#DEE4E1; --line-strong:#C7D0CC;
  --accent:#0B6E63; --accent-ink:#08514A; --accent-wash:rgba(11,110,99,.10);
  --ok:#2E7D5B; --watch:#A9761A; --alert:#B23B32;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1211; --surface:#131B19; --surface-2:#0F1615;
  --ink:#E4EBE8; --ink-soft:#8FA09A; --ink-faint:#5E6E68;
  --line:#26312E; --line-strong:#334039;
  --accent:#3FBFAE; --accent-ink:#6FD6C7; --accent-wash:rgba(63,191,174,.12);
  --ok:#4FB489; --watch:#D0A24E; --alert:#E0716A;
}}
:root[data-theme="dark"]{
  --ground:#0C1211; --surface:#131B19; --surface-2:#0F1615;
  --ink:#E4EBE8; --ink-soft:#8FA09A; --ink-faint:#5E6E68;
  --line:#26312E; --line-strong:#334039;
  --accent:#3FBFAE; --accent-ink:#6FD6C7; --accent-wash:rgba(63,191,174,.12);
  --ok:#4FB489; --watch:#D0A24E; --alert:#E0716A;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:var(--accent-wash)}
.tnum{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100vh;opacity:0}
.app.in{opacity:1;transition:opacity .35s ease}

/* header */
.bar{display:flex;align-items:center;gap:12px;padding:0 16px;height:50px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.bar h1{font-family:var(--serif);font-weight:600;font-size:15px;white-space:nowrap}
select{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 28px 6px 10px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 15px) 12px,calc(100% - 10px) 12px;background-size:5px 5px;background-repeat:no-repeat}
.bar .spacer{flex:1}
.themebtn{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--ink-soft)}
.themebtn:hover{background:var(--surface-2);color:var(--ink)}

/* body: two panes */
.panes{flex:1;display:grid;grid-template-columns:40fr 60fr;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.pane.left{border-right:1px solid var(--line)}
.pane-head{flex:none;display:flex;align-items:baseline;gap:8px;padding:12px 16px 8px}
.pane-head h2{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-soft)}
.pane-head .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;border:3px solid var(--surface)}

/* transcript */
.turn{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:5px 16px 5px 14px;border-left:2px solid transparent;transition:background .1s}
.turn:hover{background:var(--surface-2)}
.turn.hot{background:var(--accent-wash);border-left-color:var(--accent)}
.turn.dim{opacity:.34}
.turn .t{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);padding-top:3px}
.turn .who{font-size:11px;font-weight:600;color:var(--accent-ink)}
.turn .tx{color:var(--ink);font-size:13.5px}

/* patient line */
.patient{flex:none;padding:10px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.patient b{color:var(--ink);font-weight:600}
.patient .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:0 4px;margin-left:5px}
.patient .warn{color:var(--alert);font-weight:600}

/* tabs */
.tabs{flex:none;display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line)}
.tab{font-size:12.5px;padding:8px 13px;border-radius:8px 8px 0 0;color:var(--ink-soft);border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--line);background:var(--surface);position:relative;top:1px}
.tab .fmt{font-family:var(--mono);font-size:9px;color:var(--ink-faint)}
.tab .dot{width:6px;height:6px;border-radius:50%}
.tab .dot.ok{background:var(--ok)} .tab .dot.flag{background:var(--alert)}

/* timeline tab */
.tlwrap{padding:14px 18px 40px}
.snap{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:16px;line-height:1.7}
.snap b{color:var(--ink)}
.snap .sev-stable{color:var(--ok)} .snap .sev-watcher{color:var(--watch)} .snap .sev-unstable{color:var(--alert);font-weight:600}
.ev{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:7px 8px;border-radius:7px;cursor:default;transition:background .1s,opacity .15s}
.ev:hover{background:var(--surface-2)}
.ev.hot{background:var(--accent-wash)}
.ev.future{opacity:.3}
.ev .clk{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding-top:2px;text-align:right}
.ev .txt{font-size:13.5px;color:var(--ink)}
.ev .txt .kind{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
.tl-empty{padding:50px 20px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.9}

/* document tab */
.doc{padding:20px 26px 60px;font-family:var(--serif);font-size:15.5px;line-height:1.7;color:var(--ink);max-width:66ch}
.doc p{margin:0 0 11px}
.doc .lead{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);margin-right:6px}
.doc .lk{border-bottom:1px solid var(--accent);cursor:pointer;transition:background .1s}
.doc .lk:hover,.doc .lk.hot{background:var(--accent-wash)}
.doc .flags{font-family:var(--sans);font-size:12.5px;color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,transparent);border:1px solid color-mix(in srgb,var(--alert) 22%,transparent);border-radius:8px;padding:10px 12px;margin-bottom:16px}
.doc .flags ul{margin:4px 0 0 18px}
.doc.empty{font-family:var(--sans);color:var(--ink-faint);font-size:13px}

/* transport */
.transport{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface)}
.play{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink);background:var(--surface-2);font-size:12px}
.play:hover{border-color:var(--accent);color:var(--accent)}
.scrub{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;cursor:pointer}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.scrub .knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.clk{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.clk b{color:var(--ink)}
.audiotag{font-family:var(--mono);font-size:10px;color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tip{font-size:11px;color:var(--ink-faint);white-space:nowrap}
#audio{display:none}

.loading{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.app{opacity:1}}
@media (max-width:960px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .panes{grid-template-columns:1fr}
  .pane.left{border-right:none;border-bottom:1px solid var(--line)}
  .pane .scroll{max-height:60vh}
  .tip{display:none}
}
</style>

</div>

ense adhesions and inability to obtain critical view of safety. Intraoperative hypotension (BP 92/55) and tachycardia (HR 104) resolved with 1L crystalloid. EBL 400 mL. No transfusions. Lines: IV left forearm. Drains: Jackson-Pratt in gallbladder fossa. Implants: none. Counts: correct. Allergies: penicillin (rash), shellfish.\n**A \u2014 Action list**: Admit to floor overnight for pain control and drain monitoring. Monitor Jackson-Pratt output.\n**S \u2014 Situation awareness & contingencies**: If drain output increases or becomes bilious, notify surgery. If hemodynamic instability recurs, assess for bleeding or sepsis.\n**S \u2014 Synthesis by receiver**: \nReceiver read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Preoperative diagnosis: acute calculous cholecystitis\nPostoperative diagnosis: acute calculous cholecystitis\nProcedure: laparoscopic cholecystectomy converted to open cholecystectomy\nSurgeon / anesthesia: not documented\nAnesthesia type: general endotracheal\nFindings: Dense adhesions and inflammation obscuring anatomy; inability to obtain critical view of safety laparoscopically\nImplants: none documented\nEstimated blood loss: 400 mL\nSpecimens: gallbladder\nComplications: Dense adhesions and inflammation obscuring anatomy; inability to obtain critical view of safety; hypotension (BP 92/55) and tachycardia (HR 104)\nCounts: correct\nDisposition: PACU (then floor admission overnight for pain control and drain monitoring)\nBrief narrative: The patient underwent induction with general endotracheal anesthesia and a laparoscopic cholecystectomy was initiated. Dense adhesions and inflammation were encountered, leading to an inability to obtain a critical view of safety laparoscopically. The procedure was converted to an open approach via a right subcostal incision, and the gallbladder was removed. A Jackson-Pratt drain was placed in the gallbladder fossa, and the fascia and skin were closed. The patient experienced transient hypotension and tachycardia, which resolved after a fluid bolus, and was transferred to the PACU for overnight admission.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your father had surgery to remove his gallbladder. The doctors started with a smaller approach but had to switch to a larger open incision because the area was very inflamed and hard to see clearly. There was a difficulty during the procedure that the team managed, and they successfully removed the gallbladder. He is currently in the recovery room and will be moved to a regular hospital bed for the night to rest. The team is taking good care of him and monitoring his pain and the small drain placed in his abdomen. The surgeon will come speak with you directly.","unsupported_claims":[],"revised":false,"accepted":true}},"links":{"handoff":[{"start":107,"end":116,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":167,"end":176,"field":"complications","label":"complication: Dense adhesions and inflammation obscuring anatomy","event_ids":["e009","e011"],"turn_ids":["t0009","t0010","t0011","t0012"]},{"start":306,"end":317,"field":"meds","label":"medication: crystalloid","event_ids":["e019"],"turn_ids":["t0021","t0023"]},{"start":323,"end":329,"field":"ebl_ml","label":"estimated blood loss","event_ids":["e020"],"turn_ids":["t0022"]},{"start":380,"end":393,"field":"drains","label":"drain: Jackson-Pratt gallbladder fossa","event_ids":["e021"],"turn_ids":["t0024"]},{"start":432,"end":437,"field":"counts","label":"counts: correct","event_ids":["e022"],"turn_ids":["t0025"]},{"start":583,"end":596,"field":"drains","label":"drain: Jackson-Pratt gallbladder fossa","event_ids":["e021"],"turn_ids":["t0024"]}],"opnote":[{"start":149,"end":158,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":274,"end":283,"field":"complicati e01_lapchole.srt","has_audio":false,"profile":{"id":"uk_or","label":"UK operating theatre (NHS)","care_setting":"operating_theatre","phases":["arrival","sign_in","team_brief","induction","positioning_prep","time_out","incision","dissection","key_procedure","closure","emergence","sign_out","handover"],"handoff_name":"SBAR"},"context":{"patient_descriptor":"54-year-old man","planned_procedure":"laparoscopic cholecystectomy, possible conversion to open","indication":"acute calculous cholecystitis","anesthesia_type":"general endotracheal","allergies":["penicillin (rash)","shellfish"],"home_medications":["lisinopril 10 mg daily","atorvastatin 40 mg nightly","aspirin 81 mg daily"],"problem_list":["hypertension","hyperlipidaemia","cholelithiasis","type 2 diabetes"],"sources":{"patient_descriptor":"ehr","indication":"ehr","planned_procedure":"ehr","anesthesia_type":"ehr","allergies":"ehr","home_medications":"ehr","problem_list":"ehr"},"evidence_turn_ids":[]},"turns":[{"id":"t0001","start_s":12.0,"end_s":18.0,"speaker":"CIRCULATOR","role":"circulating_nurse","text":"Room's ready. Patient is a 54-year-old for laparoscopic cholecystectomy, acute cholecystitis.","source":"srt"},{"id":"t0002","start_s":65.0,"end_s":74.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Pre-oxygenating now. Plan is general endotracheal, propofol and rocuronium for induction.","source":"srt"},{"id":"t0003","start_s":220.0,"end_s":226.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Induction complete, tube's in, good bilateral breath sounds. Second IV placed in the left forearm.","source":"srt"},{"id":"t0004","start_s":330.0,"end_s":352.0,"speaker":"SURGEON","role":"surgeon","text":"Let's do our time out. Confirming patient, laparoscopic cholecystectomy, possible conversion to open, consent signed, antibiotics given?","source":"srt"},{"id":"t0005","start_s":352.0,"end_s":357.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Cefazolin two grams IV went in about ten minutes ago.","source":"srt"},{"id":"t0006","start_s":370.0,"end_s":374.0,"speaker":"SURGEON","role":"surgeon","text":"Great. Everyone agree? Time out complete.","source":"srt"},{"id":"t0007","start_s":500.0,"end_s":507.0,"speaker":"SURGEON","role":"surgeon","text":"Prepped and draped. Making the infraumbilical incision now for the Veress needle.","source":"srt"},{"id":"t0008","start_s":555.0,"end_s":560.0,"speaker":"SURGEON","role":"surgeon","text":"Insufflating. Pressures look good, fifteen millimeters of mercury. Placing the ports.","source":"srt"},{"id":"t0009","start_s":720.0,"end_s":730.0,"speaker":"SURGEON","role":"surgeon","text":"Camera's in. There's a lot of inflammation around the gallbladder, omentum is stuck to it. Adhesions are dense.","source":"srt"},{"id":"t0010","start_s":930.0,"end_s":938.0,"speaker":"SURGEON","role":"surgeon","text":"Taking down the adhesions. The tissue planes are really hard to see here.","source":"srt"},{"id":"t0011","start_s":1185.0,"end_s":1195.0,"speaker":"SURGEON","role":"surgeon","text":"I'm having trouble getting a critical view of safety. The anatomy at the triangle is completely obscured.","source":"srt"},{"id":"t0012","start_s":1330.0,"end_s":1339.0,"speaker":"SURGEON","role":"surgeon","text":"There's bleeding from the liver bed, more than I'd like. Suction please. Estimate maybe 150 mils so far.","source":"srt"},{"id":"t0013","start_s":1440.0,"end_s":1452.0,"speaker":"SURGEON","role":"surgeon","text":"I'm not comfortable continuing laparoscopically. We're going to convert to open. Let's get the open tray.","source":"srt"},{"id":"t0014","start_s":1470.0,"end_s":1475.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Copy, converting to open. Patient's stable, heart rate 88, pressure 120 over 70.","source":"srt"},{"id":"t0015","start_s":1620.0,"end_s":1628.0,"speaker":"SURGEON","role":"surgeon","text":"Making a right subcostal incision. Extending it now.","source":"srt"},{"id":"t0016","start_s":1935.0,"end_s":1945.0,"speaker":"SURGEON","role":"surgeon","text":"Better exposure now. I can see the cystic duct and artery clearly. Getting my critical view.","source":"srt"},{"id":"t0017","start_s":2200.0,"end_s":2208.0,"speaker":"SURGEON","role":"surgeon","text":"Clipping the cystic artery. And the cystic duct, two clips proximal, one distal. Dividing.","source":"srt"},{"id":"t0018","start_s":2340.0,"end_s":2347.0,"speaker":"SURGEON","role":"surgeon","text":"Taking the gallbladder off the liver bed with the cautery.","source":"srt"},{"id":"t0019","start_s":2480.0,"end_s":2488.0,"speaker":"SURGEON","role":"surgeon","text":"Gallbladder is out. It's going to pathology. Send it as gallbladder, acute cholecystitis.","source":"srt"},{"id":"t0020","start_s":2550.0,"end_s":2560.0,"speaker":"SURGEON","role":"surgeon","text":"More oozing from the liver bed. Let's put some hemostatic agent on it and pack it for a few minutes.","source":"srt"},{"id":"t0021","start_s":2760.0,"end_s":2769.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Blood pressure dipped to 92 over 55. Giving a fluid bolus. Heart rate's up to 104.","source":"srt"},{"id":"t0022","start_s":2910.0,"end_s":2920.0,"speaker":"SURGEON","role":"surgeon","text":"Bleeding's controlled now. Total blood loss I'd estimate around 400 mils.","source":"srt"},{"id":"t0023","start_s":2950.0,"end_s":2958.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Pressure came back up to 118 over 68 after the liter of crystalloid. No transfusion needed.","source":"srt"},{"id":"t0024","start_s":3120.0,"end_s":3128.0,"speaker":"SURGEON","role":"surgeon","text":"Placing a Jackson-Pratt drain in the gallbladder fossa, bringing it out the lateral port site.","source":"srt"},{"id":"t0025","start_s":3345.0,"end_s":3353.0,"speaker":"CIRCULATOR","role":"circulating_nurse","text":"Instrument, sponge, and needle counts are correct times two.","source":"srt"},{"id":"t0026","start_s":3390.0,"end_s":3397.0,"speaker":"SURGEON","role":"surgeon","text":"Closing the fascia with looped PDS. S 005","e007","e008","e010","e015","e023","e024","e025","e026"],"meds":["e002","e003","e006","e019"],"lines":["e004"],"complications":["e009","e012","e017"],"ebl_ml":["e011","e020"],"converted":["e013"],"open_concerns":["e018"],"drains":["e021"],"counts":["e022"],"disposition":["e026"]}}],"drafts":{"handoff":{"kind":"handoff","text":"**S \u2014 Situation**: 54-year-old male, converted laparoscopic to open cholecystectomy, currently in handover phase, extubated and moving all four extremities.\n**B \u2014 Background**: Indication acute calculous cholecystitis. History: hypertension, hyperlipidaemia, cholelithiasis, type 2 diabetes. Allergies: penicillin (rash), shellfish. Anaesthetic: general endotracheal (propofol, rocuronium). Intraoperative course: dense adhesions and inflammation obscured anatomy; converted to open due to inability to obtain critical view of safety and bleeding from liver bed; oozing from liver bed controlled with hemostatic agent and packing. EBL 400 ml. No transfusion. Lines: IV left forearm. Drains: Jackson-Pratt in gallbladder fossa. Implants: none. Swab/instrument count: correct.\n**A \u2014 Assessment**: Stable. Main concerns: difficult anatomy, recent hypotension (92/55) and tachycardia (HR 104) resolved with fluid bolus, drain output monitoring.\n**R \u2014 Recommendation**: Monitor drain output and vital signs. If drain output is excessive or haemodynamics unstable, notify consultant. Admit to floor overnight for pain control and observation.\n\nReceiving nurse read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Date and time: not documented\nOperating surgeon and anaesthetist: not documented\nOperation: Laparoscopic cholecystectomy converted to open cholecystectomy\nIndication: Acute calculous cholecystitis\nAnaesthetic: General endotracheal\nFindings: Dense adhesions and inflammation obscuring anatomy; inability to obtain critical view of safety laparoscopically; oozing from liver bed\nProcedure in brief: Laparoscopic approach initiated; converted to open via right subcostal incision due to difficult anatomy and bleeding; cholecystectomy performed; hemostasis achieved; Jackson-Pratt drain placed in gallbladder fossa; fascia and skin closed\nImplants / prostheses: none documented\nEstimated blood loss: 400 ml\nSpecimens sent: Gallbladder (acute cholecystitis)\nComplications: Dense adhesions and inflammation obscuring anatomy; converted to open due to inability to obtain critical view of safety and bleeding from liver bed; oozing from liver bed (resolved); hypotension (92/55) and tachycardia (HR 104)\nSwab and instrument count: Correct\nPost-operative instructions: Admit to floor overnight for pain control and to monitor drain output\nDisposal: not documented\nBrief narrative: The patient underwent a laparoscopic cholecystectomy for acute calculous cholecystitis, but dense adhesions and inflammation prevented obtaining a critical view of safety. The procedure was converted to an open cholecystectomy via a right subcostal incision due to persistent bleeding from the liver bed. The gallbladder was removed and sent for pathology, and a Jackson-Pratt drain was placed in the gallbladder fossa. Intraoperative hypotension and tachycardia were managed with a 1-liter crystalloid bolus. The patient was extubated in the theatre and transferred to recovery, with a plan for overnight admission to the floor.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your family member had surgery to remove his gallbladder. The operation was more difficult than expected because of inflammation, so the surgeon changed the plan to a larger cut to safely do the job. There was a difficulty during the procedure that the team managed, and his blood pressure dipped briefly but came back up with fluids. He is now in the recovery area and will be admitted to the ward overnight to monitor his progress. The team is taking good care of him and will keep a close eye on him while he rests. The surgeon will come and speak with you as soon as they can.","unsupported_claims":[],"revised":false,"accepted":true}},"links":{"handoff":[{"start":37,"end":46,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":368,"end":376,"field":"meds","label":"medication: propofol","event_ids":["e002"],"turn_ids":["t0002"]},{"start":378,"end":388,"field":"meds","label":"medication: rocuronium","event_ids":["e003"],"turn_ids":["t0002"]},{"start":420,"end":429,"field":"complications","label":"complication: dense adhesions and inflammation obscuring anatomy, inabilit","event_ids":["e009"],"turn_ids":["t0009","t0010","t0011"]},{"start":465,"end":474,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":563,"end":569,"field":"complications","label":"complication: Oozing from liver bed","event_ids":["e017"],"turn_ids":["t0020"]},{"start":635,"end":641,"field":"ebl_ml","label":"estimated blood loss","event_ids":["e020"],"turn_ids":["t0022"]},{"start":691,"end":704,"field":"drains","label":"drain: Jackson-Pratt gallbladder fossa","event_ids":["e021"],"turn_ids":["t0024"]},{"start":759,"end":764,"field":"counts","label":"counts: correct","event_ids":["e022"],"turn_ids":["t0025"]}],"opnote":[{"start":121,"end":130,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":247,"end":256,"field":"complications","label":"complication: dense adhesions and inflammation obscuring anatomy, inabilit","event_ids":["e009"],"turn_ids":["t0009","t0010","t0011"]},{"start":355,"end":361,"field":"complications","label":"complication: Oozing from liver bed","event_ids":["e017"],"turn_ids":["t0020"]},{"start":430,"end":439,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":564,"end":577,"field":"drains","label":"drain :"Rapid sequence induction, etomidate and succinylcholine. Tube confirmed. Two large-bore IVs, starting the rapid transfuser.","source":"srt"},{"id":"t0003","start_s":150.0,"end_s":158.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Pressure is 74 over 40, heart rate 130. Activating massive transfusion protocol. Hanging PRBC and FFP now.","source":"srt"},{"id":"t0004","start_s":180.0,"end_s":185.0,"speaker":"SURGEON","role":"surgeon","text":"No time for a formal time out. Prepping and draping. Betadine, wide.","source":"srt"},{"id":"t0005","start_s":220.0,"end_s":228.0,"speaker":"SURGEON","role":"surgeon","text":"Midline laparotomy from xiphoid to pubis. Lots of blood in the abdomen. Suction, and get me packs.","source":"srt"},{"id":"t0006","start_s":270.0,"end_s":278.0,"speaker":"SURGEON","role":"surgeon","text":"Packing all four quadrants. The bleeding is coming from the left upper quadrant, I think the spleen.","source":"srt"},{"id":"t0007","start_s":360.0,"end_s":369.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Still hypotensive, 68 systolic. Giving another 2 units red cells and 2 FFP. Started norepinephrine.","source":"srt"},{"id":"t0008","start_s":500.0,"end_s":510.0,"speaker":"SURGEON","role":"surgeon","text":"The spleen is shattered. Doing a splenectomy. Clamping the hilum now. Dividing the short gastrics.","source":"srt"},{"id":"t0009","start_s":660.0,"end_s":668.0,"speaker":"SURGEON","role":"surgeon","text":"Spleen is out. That was the main source. Pressure should start coming up.","source":"srt"},{"id":"t0010","start_s":750.0,"end_s":759.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Coming up now, 95 over 55 on a little norepi. We've given 6 units red cells, 4 FFP, 1 platelets so far.","source":"srt"},{"id":"t0011","start_s":900.0,"end_s":910.0,"speaker":"SURGEON","role":"surgeon","text":"Now running the bowel. There's a segment of small bowel with a mesenteric tear and it looks non-viable, about 20 centimeters.","source":"srt"},{"id":"t0012","start_s":1125.0,"end_s":1135.0,"speaker":"SURGEON","role":"surgeon","text":"Resecting that segment. Stapling across proximal and distal. Leaving it in discontinuity for now.","source":"srt"},{"id":"t0013","start_s":1320.0,"end_s":1330.0,"speaker":"SURGEON","role":"surgeon","text":"Rest of the bowel looks okay. Liver is intact. No other major injuries that I can see.","source":"srt"},{"id":"t0014","start_s":1470.0,"end_s":1480.0,"speaker":"SURGEON","role":"surgeon","text":"Patient's still cold and coagulopathic. We're going to do damage control. Temporary abdominal closure with a wound vac.","source":"srt"},{"id":"t0015","start_s":1560.0,"end_s":1568.0,"speaker":"SURGEON","role":"surgeon","text":"Leaving packs in the pelvis and the left upper quadrant. Abdomen stays open.","source":"srt"},{"id":"t0016","start_s":1650.0,"end_s":1658.0,"speaker":"CIRCULATOR","role":"circulating_nurse","text":"Counts are intentionally incorrect. Documenting: 4 laparotomy pads retained on purpose for damage control, plus the packs.","source":"srt"},{"id":"t0017","start_s":1740.0,"end_s":1750.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"EBL is hard to estimate, at least 3 liters. Total given: 8 red cells, 6 FFP, 2 platelets, 1 cryo.","source":"srt"},{"id":"t0018","start_s":1815.0,"end_s":1824.0,"speaker":"SURGEON","role":"surgeon","text":"For handoff: damage control laparotomy, splenectomy, small bowel resection in discontinuity, open abdomen with packs.","source":"srt"},{"id":"t0019","start_s":1840.0,"end_s":1850.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Going to the ICU intubated, on norepinephrine. Plan is to warm, resuscitate, correct coags, and back to the OR in 24 to 48 hours.","source":"srt"},{"id":"t0020","start_s":1880.0,"end_s":1888.0,"speaker":"SURGEON","role":"surgeon","text":"The family is in the surgical waiting room. They know it's serious. I'll go talk to them now.","source":"srt"}],"events":[{"id":"e000","t_start_s":15.0,"t_end_s":null,"type":" eturn to OR in 24-48 hours for second-look.\n**S \u2014 Situation awareness & contingencies**: If hemodynamics deteriorate or bleeding recurs, immediate return to OR. Monitor for coagulopathy and hypothermia.\n**S \u2014 Synthesis by receiver**: \nReceiver read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Preoperative diagnosis:\nHigh-speed MVC, hypotensive\nPostoperative diagnosis:\nShattered spleen, mesenteric tear with non-viable small bowel segment\nProcedure:\nExploratory laparotomy, splenectomy, small bowel resection, temporary abdominal closure\nSurgeon / anesthesia:\nnot documented\nAnesthesia type:\nRapid sequence induction\nFindings:\nMassive hemoperitoneum, shattered spleen, mesenteric tear with 20 cm non-viable small bowel segment\nImplants:\nnone documented\nEstimated blood loss:\n3000 mL\nSpecimens:\nSpleen (shattered), 20 cm segment of small bowel\nComplications:\nMassive hemoperitoneum with ongoing bleeding from shattered spleen, Shattered spleen, Mesenteric tear with non-viable small bowel segment (20 cm)\nCounts:\nincorrect (intentional: 4 laparotomy pads and packs retained for damage control)\nDisposition:\nICU (Intubated, on norepinephrine. Plan: warm, resuscitate, correct coags, return to OR in 24-48 hours.)\nBrief narrative:\nA 27-year-old patient arrived hypotensive following a high-speed MVC and underwent rapid sequence induction with etomidate and succinylcholine. A midline laparotomy revealed massive hemoperitoneum from a shattered spleen, which was removed via splenectomy. A 20 cm segment of non-viable small bowel with a mesenteric tear was resected and left in discontinuity. Due to hypothermia and coagulopathy, the abdomen was closed temporarily with a wound vac, and 4 laparotomy pads and packs were intentionally retained for damage control. The patient was transferred to the ICU intubated on norepinephrine with a plan to return to the OR in 24-48 hours.","unsupported_claims":[],"revise 34","start_s":407.94,"end_s":410.26,"speaker":null,"role":null,"text":"It doesn't matter, but we can take the shorter ones.","source":"srt"},{"id":"t0035","start_s":410.26,"end_s":412.26,"speaker":null,"role":null,"text":"We don't have to put them in that far.","source":"srt"},{"id":"t0036","start_s":413.7,"end_s":415.98,"speaker":null,"role":null,"text":"Just put the longer ones to the side, right?","source":"srt"},{"id":"t0037","start_s":415.98,"end_s":416.98,"speaker":null,"role":null,"text":"Okay.","source":"srt"},{"id":"t0038","start_s":418.82,"end_s":419.9,"speaker":null,"role":null,"text":"But that's nothing.","source":"srt"},{"id":"t0039","start_s":419.9,"end_s":424.38,"speaker":null,"role":null,"text":"Just make sure that we don't mix them up, that we give them back.","source":"srt"},{"id":"t0040","start_s":424.38,"end_s":426.38,"speaker":null,"role":null,"text":"That's the only thing, right?","source":"srt"},{"id":"t0041","start_s":426.38,"end_s":431.38,"speaker":null,"role":null,"text":"This is a Mako module for the hip.","source":"srt"},{"id":"t0042","start_s":431.38,"end_s":434.38,"speaker":null,"role":null,"text":"Mainly for the pan and shaft,","source":"srt"},{"id":"t0043","start_s":434.38,"end_s":437.38,"speaker":null,"role":null,"text":"you operate manually.","source":"srt"},{"id":"t0044","start_s":442.38,"end_s":445.38,"speaker":null,"role":null,"text":"I think the hip is a nice gimmick.","source":"srt"},{"id":"t0045","start_s":445.38,"end_s":448.38,"speaker":null,"role":null,"text":"You can pull it over.","source":"srt"},{"id":"t0046","start_s":448.38,"end_s":452.38,"speaker":null,"role":null,"text":"Especially when you operate in the back position,","source":"srt"},{"id":"t0047","start_s":452.38,"end_s":458.38,"speaker":null,"role":null,"text":"The Nogla for example does backrests and with robots.","source":"srt"},{"id":"t0048","start_s":458.38,"end_s":466.38,"speaker":null,"role":null,"text":"I think you can give yourself a present because I can place the implants almost as well without robots.","source":"srt"},{"id":"t0049","start_s":466.38,"end_s":469.38,"speaker":null,"role":null,"text":"Once in the upper middle, then I have the whole thing in the middle.","source":"srt"},{"id":"t0050","start_s":469.38,"end_s":471.38,"speaker":null,"role":null,"text":"No, it starts in the middle, straight.","source":"srt"},{"id":"t0051","start_s":471.38,"end_s":475.38,"speaker":null,"role":null,"text":"Then I also have a very high...","source":"srt"},{"id":"t0052","start_s":475.38,"end_s":479.38,"speaker":null,"role":null,"text":"Exactly, you have to adjust it so that the incisions are not too wide.","source":"srt"},{"id":"t0053","start_s":479.38,"end_s":483.38,"speaker":null,"role":null,"text":"The knee is also a bit more important than the knee.","source":"srt"},{"id":"t0054","start_s":483.38,"end_s":487.38,"speaker":null,"role":null,"text":"They take it with very thick legs.","source":"srt"},{"id":"t0055","start_s":487.38,"end_s":490.38,"speaker":null,"role":null,"text":"They operate more in the side position.","source":"srt"},{"id":"t0056","start_s":490.38,"end_s":493.38,"speaker":null,"role":null,"text":"And it's a bit more difficult, especially when they are so thick,","source":"srt"},{"id":"t0057","start_s":493.38,"end_s":497.38,"speaker":null,"role":null,"text":"to get the panning position right.","source":"srt"},{"id":"t0058","start_s":497.38,"end_s":501.38,"speaker":null,"role":null,"text":"And that's where it helps most.","source":"srt"},{"id":"t0059","start_s":501.38,"end_s":505.38,"speaker":null,"role":null,"text":"But it doesn't work quite as well as on the knee.","source":"srt"},{"id":"t0060","start_s":505.38,"end_s":508.38,"speaker":null,"role":null,"text":"You have to work on the accuracy.","source":"srt"},{"id":"t0061","start_s":509.38,"end_s":524.38,"speaker":null,"role":null,"text":"The first robot was originally for the hip, the RoboDoc, which then fell into disrepute.","source":"srt"},{"id":"t0062","start_s":524.38,"end_s":532.38,"speaker":null,"role":null,"text":"We made the access, then we pushed the button and then he milled the shaft.","source":"srt"},{"id":"t0063","start_s":532.38,"end_s":538.38,"speaker":null,"role":null,"text":"But of course he didn't take into account whether he was hanging somewhere in the software.","source":"srt"},{"id":"t0064","start_s":538.38,"end_s":542.38,"speaker":null,"role":null,"text":"And then he milled away a lot of softwares, partly.","source":"srt"},{"id":"t0065","start_s":542.38,"end_s":551.38,"speaker":null,"role":null,"text":"And on that basis, a knee variant was developed by the company.","source":"srt"},{"id":"t0066","start_s":551.38,"end_s":553.38,"speaker":null,"role":null,"text":"It was sold 5 times.","source":"srt"},{"id":"t0067","start_s":553.38,"end_s":555.38,"speaker":null,"role":null,"text":"But you can still buy it later.","source":"srt"},{"id":"t0068","start_s":555.38,"end_s":557.38,"speaker":null,"role":null,"text":"The technique is of course a bit more developed.","source":"srt"},{"id":"t0069","start_s":557.38,"end_s":561.38,"speaker":null,"role":null,"text":"But it is mainly used in Asia, in South Korea.","source":"srt"},{"id":"t0070","start_s":561.38,"end_s":567.38,"speaker":null,"role":null,"text":"There are some European brands, but no one is involved anymore.","source":"srt"},{"id":"t0071","start_s":569.38,"end_s":577.38,"speaker":null,"role":null,"text":"Because of course on the European market, the big American companies are trying to place their products.","source":"srt"},{"id":"t0072","start_s":577.38,"end_s":579.38,"speaker":null,"role":null,"text":"...or whatever they are called.","source":"srt"},{"id":"t0073","start_s":579.38,"end_s":581.38,"speaker":null,"role":null,"text":"And now, the drycat room...","source":"srt"},{"id":"t0074","start_s":582.38,"end_s":585.38,"speaker":null,"role":null,"text":"The robot should finally come.","source":"srt"},{"id":"t0075","start_s":590.38,"end_s":591.38,"speaker":null,"role":null,"text":"The Pew.","source":"srt"},{"id":"t0076","start_s":591.38,"end_s":593.38,"speaker":null,"role":null,"text":"That's the Pew.","source":"srt"},{"id":"t0077","start_s":593.38,"end_s":595.38,"speaker":null,"role":null,"text":"Written by the Pui.","source":"srt"},{"id":"t0078","start_s":599.38,"end_s":600.38,"speaker":null,"role":null,"text":"Who?","source":"srt"},{"id":"t0079","start_s":603.38,"end_s":604.38,"speaker":null,"role":null,"text":"No.","source":"srt"},{"id":"t0080","start_s":607.38,"end_s":609.38,"speaker":null,"role":null,"text":"Yes.","source":"srt"},{"id":"t0081","start_s":609.38,"end_s":611.38,"speaker":null,"role":null,"text":"That's fine.","source":"srt"},{"id":"t0082","start_s":622.38,"end_s":627.38,"speaker":null,"role":null,"text":"We have to distinguish a bit between this and a DaVinci.","source":"srt"},{"id":"t0083","start_s":627.38,"end_s":631.38,"speaker":null,"role":null,"text":"On the one hand, this is a bit of remote operating.","source":"srt"},{"id":"t0084","start_s":631.38,"end_s":633.38,"speaker":null,"role":null,"text":"We said size 4, right?","source":"srt"},{"id":"t0085","start_s":633.38,"end_s":638.38,"speaker":null,"role":null,"text":"...that the operator sits in one place and in the other...","source":"srt"},{"id":"t0086","start_s":638.38,"end_s":643.38,"speaker":null,"role":null,"text":"...that you can make the three circles smaller.","source":"srt"},{"id":"t0087","start_s":643.38,"end_s":645.38,"speaker":null,"role":null,"text":"But that works.","source":"srt"},{"id":"t0088","start_s":645.38,"end_s":648.38,"speaker":null,"role":null,"text":"That's a bit of a different principle.","source":"srt"},{"id":"t0089","start_s":648.38,"end_s":649.38,"speaker":null,"role":null,"text":"But it works.","source":"srt"},{"id":"t0090","start_s":649.38,"end_s":652.38,"speaker":null,"role":null,"text":"We cut exactly the same way.","source":"srt"},{"id":"t0091","start_s":652.38,"end_s":654.38,"speaker":null,"role":null,"text":"We have the best solution for the patient.","source":"srt"},{"id":"t0092","start_s":654.38,"end_s":660.38,"speaker":null,"role":null,"text":"And it's less about sitting somewhere on the laptop and operating with it.","source":"srt"},{"id":"t0093","start_s":660.38,"end_s":666.38,"speaker":null,"role":null,"text":"We are talking about precision, angle and implant position.","source":"srt"},{"id":"t0094","start_s":668.38,"end_s":672.38,"speaker":null,"role":null,"text":"No, no, you sit in this tax office and can do this.","source":"srt"},{"id":"t0095","start_s":673.38,"end_s":675.38,"speaker":null,"role":null,"text":"There are only error messages.","source":"srt"},{"id":"t0096","start_s":676.38,"end_s":680.38,"speaker":null,"role":null,"text":"You can do this a little more intensively than you normally can.","source":"srt"},{"id":"t0097","start_s":681.38,"end_s":683.38,"speaker":null,"role":null,"text":"I don't know, I can't judge it exactly.","source":"srt"},{"id":"t0098","start_s":683.38,"end_s":690.38,"speaker":null,"role":null,"text":"It's basically just an extended evening of the operator, if you will.","source":"srt"},{"id":"t0099","start_s":696.38,"end_s":698.38,"speaker":null,"role":null,"text":"That was the last time, right?","source":"srt"},{"id":"t0100","start_s":743.38,"end_s":745.38,"speaker":null,"role":null,"text":"Six implants.","source":"srt"},{"id":"t0101","start_s":746.38,"end_s":748.38,"speaker":null,"role":null,"text":"It's two sizes smaller.","source":"srt"},{"id":"t0102","start_s":750.38,"end_s":752.38,"speaker":null,"role":null,"text":"It's really four, right?","source":"srt"},{"id":"t0103","start_s":753.38,"end_s":755.38,"speaker":null,"role":null,"text":"I've already planned it.","source":"srt"},{"id":"t0104","start_s":755.38,"end_s":757.38,"speaker":null,"role":null,"text":"There will be a really nice stage.","source":"srt"},{"id":"t0105","start_s":759.38,"end_s":761.38,"speaker":null,"role":null,"text":"That's definitely something you shouldn't do.","source":"srt"},{"id":"t0106","start_s":761.38,"end_s":763.38,"speaker":null,"role":null,"text":"Okay, let's move on.","source":"srt"},{"id":"t0107","start_s":773.38,"end_s":779.38,"speaker":null,"role":null,"text":"I don't think there are any more exotic interventions.","source":"srt"},{"id":"t0108","start_s":779.38,"end_s":783.38,"speaker":null,"role":null,"text":"You have to think about what you want to do with your hands.","source":"srt"},{"id":"t0109","start_s":783.38,"end_s":791.38,"speaker":null,"role":null,"text":"It makes a lot of sense to operate with a robotic system.","source":"srt"},{"id":"t0110","start_s":791.38,"end_s":797.38,"speaker":null,"role":null,"text":"If there is an operation, like here on the laptop, that's the question.","source":"srt"},{"id":"t0111","start_s":797.38,"end_s":801.38,"speaker":null,"role":null,"text":"And that's how it is with Da Vinci at the moment.","source":"srt"},{"id":"t0112","start_s":808.38,"end_s":810.38,"speaker":null,"role":null,"text":"I missed something.","source":"srt"},{"id":"t0113","start_s":810.38,"end_s":813.38,"speaker":null,"role":null,"text":"It will have certain advantages.","source":"srt"},{"id":"t0114","start_s":813.38,"end_s":816.38,"speaker":null,"role":null,"text":"I'm waiting for him to stand on the edge again.","source":"srt"},{"id":"t0115","start_s":816.38,"end_s":822.38,"speaker":null,"role":null,"text":"The future is to have an extended arm and to operate telemedicine.","source":"srt"},{"id":"t0116","start_s":822.38,"end_s":826.38,"speaker":null,"role":null,"text":"I dare to doubt that.","source":"srt"},{"id":"t0117","start_s":826.38,"end_s":830.38,"speaker":null,"role":null,"text":"It looks like it's totally messed up.","source":"srt"},{"id":"t0118","start_s":830.38,"end_s":833.38,"speaker":null,"role":null,"text":"But I like it.","source":"srt"},{"id":"t0119","start_s":838.38,"end_s":841.38,"speaker":null,"role":null,"text":"Yeah, some kind of duality.","source":"srt"},{"id":"t0120","start_s":841.38,"end_s":845.38,"speaker":null,"role":null,"text":"But I don't really need it.","source":"srt"},{"id":"t0121","start_s":845.38,"end_s":849.38,"speaker":null,"role":null,"text":"I don't have to, like I said, I don't have to have the hair cut.","source":"srt"},{"id":"t0122","start_s":849.38,"end_s":853.38,"speaker":null,"role":null,"text":"I don't have to look into the vitreous all the time.","source":"srt"},{"id":"t0123","start_s":853.38,"end_s":857.38,"speaker":null,"role":null,"text":"You try to get used to it.","source":"srt"},{"id":"t0124","start_s":857.38,"end_s":863.38,"speaker":null,"role":null,"text":"In the beginning you look at the sitos and only look at the screen from time to time.","source":"srt"},{"id":"t0125","start_s":863.38,"end_s":871.38,"speaker":null,"role":null,"text":"But when you have implemented it in your workflow, you do it the other way around.","source":"srt"},{"id":"t0126","start_s":871.38,"end_s":877.38,"speaker":null,"role":null,"text":"Then you look at the screen and only look at the sitos in between.","source":"srt"},{"id":"t0127","start_s":877.38,"end_s":879.38,"speaker":null,"role":null,"text":"I think that's all in the green area.","source":"srt"},{"id":"t0128","start_s":879.38,"end_s":881.38,"speaker":null,"role":null,"text":"Yes, I think so too.","source":"srt"},{"id":"t0129","start_s":881.38,"end_s":886.38,"speaker":null,"role":null,"text":"But of course, there are some gimmicks with which you can make the whole thing a little cooler and more intuitive.","source":"srt"},{"id":"t0130","start_s":886.38,"end_s":890.38,"speaker":null,"role":null,"text":"And then it's really very, very good.","source":"srt"},{"id":"t0131","start_s":890.38,"end_s":892.38,"speaker":null,"role":null,"text":"I have to agree with you.","source":"srt"},{"id":"t0132","start_s":892.38,"end_s":894.38,"speaker":null,"role":null,"text":"I should probably do that too.","source":"srt"},{"id":"t0133","start_s":894.38,"end_s":911.98,"spea <script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const clock = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), ss=s%60, h=Math.floor(m/60);
  return h ? `${h}:${String(m%60).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; };
const ROLE = { surgeon:'Surgeon', anesthesia:'Anesthesia', circulating_nurse:'Nurse', scrub_nurse:'Scrub nurse', assistant:'Assistant', perfusionist:'Perfusion', other:'' };
const KIND = { phase_transition:'phase', medication_given:'medication', incision:'incision', conversion:'conversion', implant_placed:'implant', line_placed:'line', drain_placed:'drain', device_step:'step', blood_loss:'blood loss', hemodynamic_event:'hemodynamics', transfusion:'transfusion', count_status:'count', specimen:'specimen', complication:'complication', equipment_issue:'equipment', personnel_change:'personnel', disposition:'disposition' };
const TITLE = { case01_lapchole:'Lap chole to open', case01_uk:'Lap chole to open (NHS)', case03_trauma_exlap:'Trauma laparotomy', case04_cath_pci:'Coronary PCI', case02_tka_uneventful:'Routine knee replacement', mmor_007_TKA:'MM-OR knee (transcript)', mmor_007_audio:'MM-OR knee (audio)' };

const PI = { cases:{}, id:null, D:null, dur:1, playT:1e9, tab:'timeline', hotEv:new Set(), hotTurn:new Set(), playing:false, raf:0, audio:null, live:false };

/* ---------- boot ---------- */
async function boot(){
  let bundle={}; try{ bundle=JSON.parse($('#bundle').textContent)||{}; }catch(e){}
  let live=[]; try{ const r=await fetch('/api/cases'); if(r.ok) live=await r.json(); }catch(e){}
  PI.live = live.length>0;
  const sel=$('#caseSel');
  let ids;
  if (PI.live){ live.forEach(c=>{ PI.cases[c.case_id]=null; sel.append(new Option(label(c.case_id,c.source),c.case_id)); }); ids=live.map(c=>c.case_id); }
  else { PI.cases=bundle; ids=Object.keys(bundle); ids.forEach(id=>sel.append(new Option(label(id,bundle[id].source),id))); }
  if (!ids.length){ $('#loading').textContent='no cases'; return; }
  ['default_or','uk_or','cath_lab','mmor_robotic'].forEach(p=>$('#profSel').append(new Option(p.replace(/_/g,' '),p)));
  sel.onchange=()=>load(sel.value);
  $('#profSel').onchange=()=>{ const p=$('#profSel').value; if(p===PI.D.profile.id)return; PI.live?reprofile(p):(($('#profSel').value=PI.D.profile.id), tip('profile switching needs the local server')); };
  wire();
  await load(ids[0]);
  $('#loading').hidden=true; $('#app').hidden=false;
  requestAnimationFrame(()=>$('#app').classList.add('in'));
}
function label(id,src){ const nm=TITLE[id]||id; return nm + (/audio|\.mp3|\.m4a|\.wav/i.test(src||'')?'  —  audio':''); }

async function load(id){
  let D=PI.cases[id];
  if (!D){ try{ const r=await fetch('/api/cases/'+id); D=r.ok?await r.json():null; }catch(e){ D=null; } if(D&&D.events) PI.cases[id]=D; }
  if (!D||!D.events){ tip('could not load '+id); return; }
  PI.id=id; PI.D=D;
  PI.dur=Math.max(1,...D.events.map(e=>e.t_start_s),...D.turns.map(t=>t.end_s))+15;
  PI.playT=1e9; PI.tab='timeline'; PI.hotEv.clear(); PI.hotTurn.clear();
  $('#caseSel').value=id; $('#profSel').value=D.profile.id;
  setupAudio(D);
  renderPatient(); renderTurns(); renderTabs(); renderTab(); syncScrub();
}

/* ---------- patient line ---------- */
function renderPatient(){
  const c=PI.D.context||{}, host=$('#patient');
  const bits=[];
  if (c.patient_descriptor) bits.push('<b>'+esc(c.patient_descriptor)+'</b>');
  if (c.planned_procedure) bits.push(esc(c.planned_procedure));
  if (c.indication) bits.push(esc(c.indication));
  const src=c.sources||{};
  const fromEhr = Object.values(src).includes('ehr');
  let html = bits.join(' &middot; ');
  if (fromEhr) html += ' <span class="tag">from records</span>';
  if ((c.allergies||[]).length) html += '<br><span class="warn">Allergy:</span> ' + esc(c.allergies.join(', '));
  if (!html){ host.hidden=true; return; }
  host.hidden=false; host.innerHTML=html;
}
function esc(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ---------- transcript ---------- */
function renderTurns(){
  const box=$('#turns'); box.innerHTML='';
  $('#turnCount').textContent=PI.D.turns.length+' lines';
  PI.D.turns.forEach(t=>{
    const row=el('div','turn'); row.dataset.id=t.id;
    row.append(el('div','t tnum',clock(t.start_s)));
    const body=el('div');
    const who = ROLE[t.role] || (t.speaker||'').replace(/_/g,' ');
    if (who) body.append(el('span','who',who+' '));
    body.append(el('span','tx',t.text));
    row.append(body);
    row.onmouseenter=()=>traceFromTurn(t.id);
    row.onmouseleave=clearTrace;
    box.append(row);
  });
  paintTrace();
}

/* ---------- tabs ---------- */
const TABS=[['timeline','Timeline'],['handoff','Handoff'],['opnote','Op note'],['family','Family']];
function renderTabs(){
  const box=$('#tabs'); box.innerHTML='';
  TABS.forEach(([k,nm])=>{
    if (k!=='timeline' && !PI.D.drafts[k]) return;
    const t=el('button','tab'); t.setAttribute('role','tab'); t.setAttribute('aria-selected',String(k===PI.tab));
    t.append(el('span',null,nm));
    if (k==='handoff') t.append(el('span','fmt',PI.D.profile.handoff_name));
    const dr=PI.D.drafts[k];
    if (dr && dr.text && !dr.text.startsWith('[')){
      const flags=(dr.unsupported_claims||[]).filter(x=>!/not generated|not fact-checked/.test(x));
      t.append(el('span','dot '+(flags.length?'flag':'ok')));
    }
    t.onclick=()=>{ PI.tab=k; renderTabs(); renderTab(); };
    box.append(t);
  });
}

function renderTab(){
  const host=$('#tabBody');
  if (PI.tab==='timeline') return renderTimeline(host);
  renderDoc(host, PI.tab);
}

/* ---------- timeline ---------- */
function stateAt(t){ let cur=(PI.D.states||[])[0]||{}; for(const s of PI.D.states||[]){ if(s.as_of_s<=t) cur=s; else break; } return cur; }
function renderTimeline(host){
  host.innerHTML='';
  const wrap=el('div','tlwrap');
  if (!PI.D.events.length){
    wrap.append(el('div','tl-empty','No clinical events were extracted from this recording.\nToo short, noisy, or not clinical speech — shown as-is rather than invented.'));
    host.append(wrap); return;
  }
  wrap.append(snapshot());
  const evs=PI.D.events.slice().sort((a,b)=>a.t_start_s-b.t_start_s);
  evs.forEach(e=>{
    const row=el('div','ev'); row.dataset.id=e.id;
    if (e.t_start_s>PI.playT) row.classList.add('future');
    if (PI.hotEv.has(e.id)) row.classList.add('hot');
    row.append(el('div','clk tnum',clock(e.t_start_s)));
    const txt=el('div','txt');
    txt.append(el('span','kind',KIND[e.type]||e.type));
    txt.append(document.createTextNode(evText(e)));
    row.append(txt);
    row.onmouseenter=()=>traceFromEvent(e.id);
    row.onmouseleave=clearTrace;
    wrap.append(row);
  });
  host.append(wrap);
}
function snapshot(){
  const S=stateAt(PI.playT), d=el('div','snap');
  const sev=severity(S);
  const parts=[`phase <b>${(S.phase||'').replace(/_/g,' ')}</b>`, `<span class="sev-${sev}">${sev}</span>`];
  if (S.ebl_ml!=null) parts.push(`EBL <b>${S.ebl_ml} mL</b>`);
  const tx=S.transfusion_totals||{}; if (Object.keys(tx).length) parts.push('transfused ' + Object.entries(tx).map(([k,v])=>`${v} ${k}`).join(', '));
  if ((S.implants||[]).length) parts.push('implant: '+S.implants.join(', '));
  if ((S.drains||[]).length) parts.push('drain: '+S.drains.join(', '));
  if (S.converted) parts.push('converted '+S.converted);
  if (S.counts) parts.push('counts '+S.counts);
  if (S.disposition) parts.push('to <b>'+S.disposition+'</b>');
  d.innerHTML = (PI.playT<PI.dur-.5 ? `state at ${clock(PI.playT)} &mdash; ` : 'final state &mdash; ') + parts.join(' &middot; ');
  return d;
}
function severity(S){
  const c=(S.complications||[]).length, o=(S.open_concerns||[]).length;
  if (S.disposition && /icu/i.test(S.disposition) && (c||o)) return 'unstable';
  if (c||o||S.converted) return 'watcher';
  return 'stable';
}
function evText(e){
  const p=e.payload||{};
  if (e.type==='phase_transition') return (p.phase||'').replace(/_/g,' ');
  if (e.type==='medication_given') return [p.name,p.dose,p.route].filter(Boolean).join(' ');
  if (e.type==='blood_loss') return 'about '+p.ebl_ml+' mL';
  if (e.type==='transfusion') return [p.units,p.product].filter(Boolean).join(' ');
  if (e.type==='conversion') return (p.from||'')+' to '+(p.to||'');
  if (e.type==='count_status') return (p.status||'')+(p.intentional?' (intentional)':'');
  if (e.type==='disposition') return [p.destination,p.detail].filter(Boolean).join(' - ');
  return Object.values(p).filter(v=>typeof v!=='object').join(' - ')||'';
}

/* ---------- document ---------- */
function renderDoc(host, kind){
  host.innerHTML='';
  const dr=PI.D.drafts[kind];
  const d=el('div','doc');
  if (!dr||!dr.text){ d.className='doc empty'; d.textContent='no draft'; host.append(d); return; }
  if (dr.text.startsWith('[')){ d.className='doc empty'; d.textContent=dr.text.replace(/^\[|\]$/g,''); host.append(d); return; }
  const flags=(dr.unsupported_claims||[]).filter(x=>!/not generated|not fact-checked/.test(x));
  if (flags.length){
    const f=el('div','flags'); f.append(el('div',null,'Not verified against the transcript:'));
    const ul=el('ul'); flags.forEach(x=>ul.append(el('li',null,x))); f.append(ul); d.append(f);
  }
  if (PI.playT<PI.dur-.5){
    const n=el('p'); n.style.color='var(--watch)'; n.style.fontFamily='var(--sans)'; n.style.fontSize='12px';
    n.textContent='This document reflects the whole case; the transcript is scrubbed back to '+clock(PI.playT)+'.';
    d.append(n);
  }
  const links=PI.D.links[kind]||[]; const text=dr.text;
  let off=0;
  for (const raw of text.split('\n')){
    const lstart=off; off+=raw.length+1;
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/^\*{0,2}([A-Z][A-Za-z0-9 ,/&()'—–-]{1,44}?)\*{0,2}:\s*(.*)$/);
    if (m && (m[2]==='' || m[1].length<46)){
      const p=el('p');
      p.append(el('span','lead',m[1].replace(/\*/g,'')));
      if (m[2]) inline(p, m[2], lstart+(raw.length-m[2].length), links);
      d.append(p); continue;
    }
    const p=el('p'); inline(p, raw, lstart, links); d.append(p);
  }
  host.append(d);
}
function inline(p, str, gOff, links){
  const clean=str.replace(/\*\*/g,'');
  const shift=i=>i-(str.slice(0,i).match(/\*\*/g)||[]).length*2;
  const local=links.map(lk=>({...lk,s:lk.start-gOff,e:lk.end-gOff})).filter(lk=>lk.s>=0&&lk.e<=str.length&&lk.e>lk.s).sort((a,b)=>a.s-b.s);
  let i=0;
  for (const lk of local){
    const s=shift(lk.s), e=shift(lk.e);
    if (s>i) p.append(document.createTextNode(clean.slice(i,s)));
    const span=el('span','lk',clean.slice(s,e)); span.title=lk.label;
    span.dataset.ev=lk.event_ids.join(','); span.dataset.tn=lk.turn_ids.join(',');
    span.onmouseenter=()=>{ PI.hotEv=new Set(lk.event_ids); PI.hotTurn=new Set(lk.turn_ids); paintTrace(true); };
    span.onmouseleave=clearTrace;
    p.append(span); i=e;
  }
  if (i<clean.length) p.append(document.createTextNode(clean.slice(i)));
}

/* ---------- trace ---------- */
function traceFromTurn(tid){
  PI.hotTurn=new Set([tid]);
  PI.hotEv=new Set(PI.D.events.filter(e=>(e.evidence_turn_ids||[]).includes(tid)).map(e=>e.id));
  paintTrace();
}
function traceFromEvent(eid){
  const e=PI.D.events.find(x=>x.id===eid);
  PI.hotEv=new Set([eid]); PI.hotTurn=new Set(e?e.evidence_turn_ids:[]);
  paintTrace(true);
}
function clearTrace(){ PI.hotEv.clear(); PI.hotTurn.clear(); paintTrace(); }
function paintTrace(scrollTurn){
  document.querySelectorAll('.turn').forEach(r=>{
    r.classList.toggle('hot',PI.hotTurn.has(r.dataset.id));
    r.classList.toggle('dim',PI.hotTurn.size>0 && !PI.hotTurn.has(r.dataset.id));
  });
  document.querySelectorAll('.ev').forEach(r=>r.classList.toggle('hot',PI.hotEv.has(r.dataset.id)));
  document.querySelectorAll('.doc .lk').forEach(s=>{
    const evs=(s.dataset.ev||'').split(',').filter(Boolean);
    s.classList.toggle('hot', evs.some(x=>PI.hotEv.has(x)));
  });
  if (scrollTurn && PI.hotTurn.size){
    const first=[...document.querySelectorAll('.turn.hot')][0];
    if (first) first.scrollIntoView({block:'center',behavior:'smooth'});
  }
}

/* ---------- transport ---------- */
function syncScrub(){
  const scrubbed = PI.playT < PI.dur-.5;
  const pct=Math.min(100,PI.playT/PI.dur*100);
  $('#scrubFill').style.width=pct+'%'; $('#scrubKnob').style.left=pct+'%';
  $('#clk').innerHTML = scrubbed ? `<b>${clock(PI.playT)}</b> / ${clock(PI.dur)}` : clock(PI.dur);
}
function seekTo(v){
  PI.playT = Math.max(0, Math.min(1, v)) * PI.dur;
  if (PI.audio && isFinite(PI.audio.duration)) PI.audio.currentTime = Math.min(PI.playT, PI.audio.duration-0.05);
  followPlay(true);
}
let _last=0;
function followPlay(force){
  syncScrub();
  const now=performance.now();
  if (!force && now-_last<140) return;
  _last=now;
  if (PI.tab==='timeline') renderTab();
  const S=PI.D.turns; let best=null;
  for (const t of S){ if (t.start_s<=PI.playT+1.5) best=t; else break; }
  if (best && !PI.hotTurn.size){
    const row=document.querySelector(`.turn[data-id="${best.id}"]`);
    if (row) row.scrollIntoView({block:'center'});
  }
}
function play(){
  PI.playing=!PI.playing;
  $('#playBtn').innerHTML = PI.playing ? '&#10073;&#10073;' : '&#9654;';
  if (PI.audio){
    if (PI.playing){ if (PI.playT>=PI.dur-.5){ PI.playT=0; PI.audio.currentTime=0; } PI.audio.play(); }
    else PI.audio.pause();
    return;
  }
  if (!PI.playing){ cancelAnimationFrame(PI.raf); return; }
  if (PI.playT>=PI.dur) PI.playT=0;
  let t0=performance.now();
  const step=now=>{
    if (!PI.playing) return;
    PI.playT += (now-t0)/1000*50; t0=now;
    if (PI.playT>=PI.dur){ PI.playT=PI.dur; PI.playing=false; $('#playBtn').innerHTML='&#9654;'; followPlay(true); return; }
    followPlay(); PI.raf=requestAnimationFrame(step);
  };
  PI.raf=requestAnimationFrame(step);
}

function setupAudio(D){
  const a=$('#audio'), tag=$('#audioTag');
  a.pause(); PI.playing=false; $('#playBtn').innerHTML='&#9654;';
  if (PI.live && D.has_audio){
    a.src='/api/cases/'+PI.id+'/audio'; tag.hidden=false;
    a.onended=()=>{ PI.playing=false; $('#playBtn').innerHTML='&#9654;'; };
    a.ontimeupdate=()=>{ if(!a.paused){ PI.playT=a.currentTime; followPlay(); } };
    PI.audio=a;
  } else { a.removeAttribute('src'); a.load(); tag.hidden=true; PI.audio=null; }
}

/* ---------- profile re-run ---------- */
async function reprofile(p){
  const base=PI.id.split('__')[0], newId=base+'__'+p;
  tip('re-running with the '+p.replace(/_/g,' ')+' profile — about 3 min');
  try{
    const fd=new FormData(); fd.append('profile',p);
    const r=await fetch('/api/cases/'+base+'/reprofile',{method:'POST',body:fd});
    if (!r.ok) throw new Error((await r.json()).detail||r.statusText);
    poll(newId,p);
  }catch(e){ tip('could not switch: '+e.message); $('#profSel').value=PI.D.profile.id; }
}
function poll(id,p){
  const t0=Date.now();
  const go=async()=>{
    const s=await (await fetch('/api/cases/'+id+'/status')).json();
    if (s.error){ tip('run failed: '+s.error); return; }
    if (s.done){
      PI.cases[id]=null;
      if (![...$('#caseSel').options].some(o=>o.value===id)) $('#caseSel').append(new Option((TITLE[id.split('__')[0]]||id)+' ('+p.replace(/_/g,' ')+')',id));
      await load(id); tip('same transcript, '+p.replace(/_/g,' ')+' profile');
      return;
    }
    $('#tip').textContent = 'reconstructing … '+((s.logged_agents||[]).length)+'/10 steps';
    if (Date.now()-t0<600000) setTimeout(go,2500);
  };
  go();
}
function tip(m){ const t=$('#tip'); t.textContent=m; setTimeout(()=>t.textContent=t.dataset.def,3500); }

/* ---------- wire ---------- */
function wire(){
  $('#tip').dataset.def=$('#tip').textContent;
  $('#playBtn').onclick=play;
  const sc=$('#scrub'); let drag=false;
  const at=x=>{ const r=sc.getBoundingClientRect(); seekTo((x-r.left)/r.width); };
  sc.onpointerdown=e=>{ drag=true; sc.setPointerCapture(e.pointerId); at(e.clientX); };
  sc.onpointermove=e=>{ if(drag) at(e.clientX); };
  sc.onpointerup=()=>drag=false;
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'));
  };
  addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return; if(e.key===' '){ e.preventDefault(); play(); } });
}
boot();
</script>
