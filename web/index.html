<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#EEF1EF; --surface:#FFFFFF; --surface-2:#F1F4F2; --surface-3:#E7ECE9;
  --ink:#14231F; --ink-soft:#566661; --ink-faint:#8B9A94;
  --line:#DBE2DE; --line-strong:#C6D0CB;
  --accent:#0B6E63; --accent-ink:#0A5850; --accent-wash:rgba(11,110,99,.09);
  --ok:#2E7D5B; --watch:#B0791A; --alert:#B23B32;
  --r-surgeon:#0B6E63; --r-anesthesia:#9A6114; --r-nurse:#3D6A9E; --r-scrub:#7A5AA6; --r-other:#8B9A94;
  --shadow-sm:0 1px 2px rgba(20,35,31,.06);
  --shadow-md:0 4px 16px -4px rgba(20,35,31,.12),0 1px 3px rgba(20,35,31,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0F0E; --surface:#131B19; --surface-2:#0F1615; --surface-3:#1B2523;
  --ink:#E6ECE9; --ink-soft:#93A29C; --ink-faint:#5F6E68;
  --line:#26312E; --line-strong:#38443F;
  --accent:#42C3B2; --accent-ink:#74DACB; --accent-wash:rgba(66,195,178,.12);
  --ok:#4FB489; --watch:#D4A65A; --alert:#E2726B;
  --r-surgeon:#42C3B2; --r-anesthesia:#D4A65A; --r-nurse:#6FA6D8; --r-scrub:#AC8FDC; --r-other:#5F6E68;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px -6px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0A0F0E; --surface:#131B19; --surface-2:#0F1615; --surface-3:#1B2523;
  --ink:#E6ECE9; --ink-soft:#93A29C; --ink-faint:#5F6E68;
  --line:#26312E; --line-strong:#38443F;
  --accent:#42C3B2; --accent-ink:#74DACB; --accent-wash:rgba(66,195,178,.12);
  --ok:#4FB489; --watch:#D4A65A; --alert:#E2726B;
  --r-surgeon:#42C3B2; --r-anesthesia:#D4A65A; --r-nurse:#6FA6D8; --r-scrub:#AC8FDC; --r-other:#5F6E68;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px -6px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-wash)}
.tnum{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100vh;opacity:0}
.app.in{opacity:1;transition:opacity .35s ease}

/* header */
.bar{display:flex;align-items:center;gap:11px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;box-shadow:var(--shadow-sm);z-index:5}
.mark{width:24px;height:24px;flex:none;border-radius:6px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));display:grid;place-items:center}
.mark svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bar h1{font-family:var(--serif);font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:.01em}
.bar h1 .dim{color:var(--ink-faint);font-weight:400}
select{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 28px 6px 11px;appearance:none;cursor:pointer;transition:border-color .12s,background .12s;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat}
select:hover{border-color:var(--line-strong);background-color:var(--surface-3)}
.bar .spacer{flex:1}
.themebtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-soft);transition:background .12s,color .12s}
.themebtn:hover{background:var(--surface-2);color:var(--ink)}

/* body: two panes */
.panes{flex:1;display:grid;grid-template-columns:39fr 61fr;min-height:0;gap:0}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.pane.left{border-right:1px solid var(--line);background:var(--surface-2)}
.pane.right{background:var(--ground)}
.pane-head{flex:none;display:flex;align-items:center;gap:8px;padding:13px 18px 9px}
.pane-head h2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.pane-head .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:11px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);background-clip:padding-box}

/* transcript */
#turns{padding:2px 0 24px}
.turn{position:relative;display:grid;grid-template-columns:40px 1fr;gap:11px;padding:6px 16px 6px 15px;border-left:2px solid transparent;transition:background .12s,opacity .15s}
.turn::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--rc,transparent);opacity:.5;transition:opacity .12s}
.turn:hover{background:var(--surface)}
.turn.hot{background:var(--accent-wash);border-left-color:var(--accent)}
.turn.hot::before{opacity:0}
.turn.dim{opacity:.32}
.turn .t{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding-top:4px;text-align:right}
.turn .who{font-size:10.5px;font-weight:600;color:var(--rc,var(--accent-ink));text-transform:uppercase;letter-spacing:.03em}
.turn .tx{color:var(--ink);font-size:13.5px;line-height:1.5}
.turn .tx.q{color:var(--ink-soft)}

/* patient strip */
.patient{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);box-shadow:var(--shadow-sm);z-index:2}
.patient b{color:var(--ink);font-weight:600}
.patient .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}
.patient .tag{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-wash);border-radius:4px;padding:2px 6px}
.patient .warn{color:var(--alert);font-weight:600;background:color-mix(in srgb,var(--alert) 10%,transparent);border-radius:4px;padding:2px 7px;font-size:11.5px}

/* tabs */
.tabs{flex:none;display:flex;gap:2px;padding:10px 18px 0;background:var(--ground)}
.tab{font-size:12.5px;padding:9px 14px;border-radius:9px 9px 0 0;color:var(--ink-soft);border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px;transition:color .12s,background .12s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--line);background:var(--surface);position:relative;top:1px;box-shadow:0 -3px 10px -6px rgba(20,35,31,.15)}
.tab .fmt{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.tab .dot.ok{background:var(--ok)} .tab .dot.flag{background:var(--alert);box-shadow:0 0 0 3px color-mix(in srgb,var(--alert) 20%,transparent)}
#tabScroll{background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-md)}

/* timeline tab */
.tlwrap{padding:18px 22px 44px}
.snap{position:relative;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--sev,var(--ok));border-radius:9px;padding:11px 14px;margin-bottom:20px;line-height:1.6}
.snap b{color:var(--ink)}
.snap .chip{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.snap .sev-label{font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--sev,var(--ok))}
.rail{position:relative;padding-left:26px}
.rail::before{content:"";position:absolute;left:6px;top:8px;bottom:14px;width:2px;background:linear-gradient(var(--line-strong),var(--line))}
.ev{position:relative;display:grid;grid-template-columns:48px 1fr;gap:12px;padding:8px 10px 8px 0;border-radius:8px;cursor:default;transition:background .12s,opacity .18s}
.ev::before{content:"";position:absolute;left:-23px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--rc,var(--accent));transition:transform .12s,box-shadow .12s}
.ev:hover{background:var(--surface-2)}
.ev:hover::before,.ev.hot::before{transform:scale(1.3);box-shadow:0 0 0 4px var(--accent-wash)}
.ev.hot{background:var(--accent-wash)}
.ev.future{opacity:.28}
.ev.future::before{background:var(--line);border-color:var(--line-strong)}
.ev .clk{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);padding-top:3px;text-align:right}
.ev .txt{font-size:13.5px;color:var(--ink);line-height:1.5}
.ev .txt .kind{display:inline-block;color:var(--rc,var(--ink-soft));font-family:var(--mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-right:7px;vertical-align:1px}
.ev .txt .by{color:var(--ink-faint);font-size:11px;margin-left:6px}
.tl-empty{padding:56px 24px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.95}
.tl-empty svg{width:34px;height:34px;stroke:var(--line-strong);fill:none;stroke-width:1.6;margin-bottom:12px}

/* document tab */
.doc{padding:26px 34px 68px;font-family:var(--serif);font-size:15.5px;line-height:1.72;color:var(--ink);max-width:70ch}
.doc p{margin:0 0 12px}
.doc .lead{display:block;font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin:18px 0 3px}
.doc p:first-child .lead{margin-top:0}
.doc .lk{border-bottom:1.5px solid var(--accent);cursor:pointer;transition:background .12s;border-radius:2px}
.doc .lk:hover,.doc .lk.hot{background:var(--accent-wash)}
.doc .flags{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent);border:1px solid color-mix(in srgb,var(--alert) 22%,transparent);border-radius:9px;padding:11px 13px;margin-bottom:18px}
.doc .flags b{display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.doc .flags ul{margin:0 0 0 16px}
.doc .scrubnote{font-family:var(--sans);font-size:11.5px;color:var(--watch);background:color-mix(in srgb,var(--watch) 9%,transparent);border-radius:7px;padding:7px 11px;margin-bottom:16px}
.doc.empty{font-family:var(--sans);color:var(--ink-faint);font-size:13px;padding-top:40px}

/* transport */
.transport{flex:none;display:flex;align-items:center;gap:15px;padding:11px 20px;border-top:1px solid var(--line);background:var(--surface);box-shadow:0 -2px 12px -6px rgba(20,35,31,.12);z-index:3}
.play{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink);background:var(--surface-2);font-size:12px;transition:border-color .12s,color .12s,background .12s,transform .1s}
.play:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.play:active{transform:scale(.94)}
.scrub{flex:1;height:22px;display:flex;align-items:center;position:relative;cursor:pointer}
.scrub .track{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-ink),var(--accent));border-radius:3px}
.scrub .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);transform:translate(-50%,-50%);box-shadow:var(--shadow-sm);transition:width .1s,height .1s}
.scrub:hover .knob{width:16px;height:16px}
.clk{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.02em}
.clk b{color:var(--ink)}
.audiotag{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent-wash);border-radius:5px;padding:3px 7px;white-space:nowrap}
.tip{font-size:11px;color:var(--ink-faint);white-space:nowrap;max-width:34ch;overflow:hidden;text-overflow:ellipsis}
#audio{display:none}

.loading{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:var(--ink-soft);z-index:50}
.loading .mark{width:34px;height:34px;border-radius:9px;animation:pulse 1.6s ease-in-out infinite}
.loading .mark svg{width:19px;height:19px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.93)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.app{opacity:1}}
@media (max-width:960px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .panes{grid-template-columns:1fr}
  .pane.left{border-right:none;border-bottom:1px solid var(--line)}
  .pane .scroll{max-height:58vh}
  .tip{display:none}
  .doc{padding:22px 20px 60px}
}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header class="bar">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg></span>
    <h1>Procedural&nbsp;Intelligence</h1>
    <select id="caseSel" aria-label="Case"></select>
    <select id="profSel" aria-label="Site profile"></select>
    <div class="spacer"></div>
    <button class="themebtn" id="themeBtn" aria-label="Toggle light/dark">&#9681;</button>
  </header>

  <div class="panes">
    <section class="pane left">
      <div class="pane-head"><h2>What was said</h2><span class="sub" id="turnCount"></span></div>
      <div class="scroll" id="turnScroll"><div id="turns"></div></div>
    </section>

    <section class="pane right">
      <div class="patient" id="patient" hidden></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="scroll" id="tabScroll"><div id="tabBody"></div></div>
    </section>
  </div>

  <audio id="audio" preload="none"></audio>
  <div class="transport">
    <button class="play" id="playBtn" aria-label="Play / pause">&#9654;</button>
    <div class="scrub" id="scrub">
      <div class="track"><div class="fill" id="scrubFill"></div></div>
      <div class="knob" id="scrubKnob"></div>
    </div>
    <span class="clk tnum" id="clk">00:00</span>
    <span class="audiotag" id="audioTag" hidden>&#9834; audio</span>
    <span class="tip" id="tip">hover a line to see where it came from</span>
  </div>
</div>
<div class="loading" id="loading">
  <span class="mark"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg></span>
  <span>reconstructing the case&hellip;</span>
</div>

<script id="bundle" type="application/json">__BUNDLE__</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const clock = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), ss=s%60, h=Math.floor(m/60);
  return h ? `${h}:${String(m%60).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; };
const ROLE = {
  surgeon:{label:'Surgeon',c:'var(--r-surgeon)'}, anesthesia:{label:'Anesthesia',c:'var(--r-anesthesia)'},
  circulating_nurse:{label:'Nurse',c:'var(--r-nurse)'}, scrub_nurse:{label:'Scrub',c:'var(--r-scrub)'},
  assistant:{label:'Assistant',c:'var(--r-surgeon)'}, perfusionist:{label:'Perfusion',c:'var(--r-other)'},
  clinician:{label:'Clinician',c:'var(--r-surgeon)'}, patient:{label:'Patient',c:'var(--r-nurse)'},
  other:{label:'',c:'var(--r-other)'},
};
const roleOf = t => ROLE[t.role] || ROLE.other;
const KIND = { phase_transition:'phase', medication_given:'medication', incision:'incision', conversion:'conversion', implant_placed:'implant', line_placed:'line', drain_placed:'drain', device_step:'step', finding:'finding', blood_loss:'blood loss', hemodynamic_event:'hemodynamics', transfusion:'transfusion', count_status:'count', specimen:'specimen', complication:'complication', equipment_issue:'equipment', personnel_change:'personnel', disposition:'disposition' };
const EVROLE = { phase_transition:'circulating_nurse', medication_given:'anesthesia', hemodynamic_event:'anesthesia', transfusion:'anesthesia', count_status:'circulating_nurse', incision:'surgeon', conversion:'surgeon', implant_placed:'surgeon', drain_placed:'surgeon', specimen:'surgeon', complication:'surgeon', disposition:'surgeon' };
const TITLE = { case01_lapchole:'Lap chole → open', case01_uk:'Lap chole → open (NHS)', case03_trauma_exlap:'Trauma laparotomy', case04_cath_pci:'Coronary PCI', case02_tka_uneventful:'Routine knee replacement', mmor_007_TKA:'MM-OR robotic knee', mmor_007_audio:'MM-OR knee (audio)', primock_d1c01:'GP consult · gastroenteritis', primock_d1c02:'GP consult · eczema flare', primock_d2c01:'GP consult · hearing loss' };

const PI = { cases:{}, id:null, D:null, dur:1, playT:1e9, tab:'timeline', hotEv:new Set(), hotTurn:new Set(), playing:false, raf:0, audio:null, live:false };

/* ---------- boot ---------- */
async function boot(){
  let bundle={}; try{ bundle=JSON.parse($('#bundle').textContent)||{}; }catch(e){}
  let live=[]; try{ const r=await fetch('/api/cases'); if(r.ok) live=await r.json(); }catch(e){}
  PI.live = live.length>0;
  const sel=$('#caseSel');
  let ids;
  if (PI.live){ live.forEach(c=>{ PI.cases[c.case_id]=null; sel.append(new Option(label(c.case_id,c.source),c.case_id)); }); ids=live.map(c=>c.case_id); }
  else { PI.cases=bundle; ids=Object.keys(bundle); ids.forEach(id=>sel.append(new Option(label(id,bundle[id].source),id))); }
  if (!ids.length){ $('#loading').textContent='no cases'; return; }
  ['default_or','uk_or','cath_lab','mmor_robotic','primary_care'].forEach(p=>$('#profSel').append(new Option(p.replace(/_/g,' '),p)));
  sel.onchange=()=>load(sel.value);
  $('#profSel').onchange=()=>{ const p=$('#profSel').value; if(p===PI.D.profile.id)return; PI.live?reprofile(p):(($('#profSel').value=PI.D.profile.id), tip('profile switching needs the local server')); };
  wire();
  await load(ids[0]);
  $('#loading').hidden=true; $('#app').hidden=false;
  requestAnimationFrame(()=>$('#app').classList.add('in'));
}
const isAudio = src => /audio|\.mp3|\.m4a|\.wav/i.test(src||'');
function label(id,src){ const nm=TITLE[id]||id; return isAudio(src) ? nm+'  ·  audio' : nm; }

async function load(id){
  let D=PI.cases[id];
  if (!D){ try{ const r=await fetch('/api/cases/'+id); D=r.ok?await r.json():null; }catch(e){ D=null; } if(D&&D.events) PI.cases[id]=D; }
  if (!D||!D.events){ tip('could not load '+id); return; }
  PI.id=id; PI.D=D;
  PI.dur=Math.max(1,...D.events.map(e=>e.t_start_s),...D.turns.map(t=>t.end_s))+15;
  PI.playT=1e9; PI.tab='timeline'; PI.hotEv.clear(); PI.hotTurn.clear();
  $('#caseSel').value=id; $('#profSel').value=D.profile.id;
  setupAudio(D);
  renderPatient(); renderTurns(); renderTabs(); renderTab(); syncScrub();
}

/* ---------- patient strip ---------- */
function renderPatient(){
  const c=PI.D.context||{}, host=$('#patient');
  host.innerHTML='';
  const add=(html)=>{ if(host.children.length) host.append(el('span','sep')); const s=el('span'); s.innerHTML=html; host.append(s); };
  if (c.patient_descriptor) add('<b>'+esc(c.patient_descriptor)+'</b>');
  if (c.planned_procedure) add(esc(c.planned_procedure));
  if (c.indication) add(esc(c.indication));
  if (!host.children.length){ host.hidden=true; return; }
  if (Object.values(c.sources||{}).includes('ehr')) host.append(el('span','tag','from records'));
  if ((c.allergies||[]).length){ const w=el('span','warn'); w.textContent='allergy: '+c.allergies.join(', '); host.append(w); }
  host.hidden=false;
}
function esc(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ---------- transcript ---------- */
function renderTurns(){
  const box=$('#turns'); box.innerHTML='';
  $('#turnCount').textContent=PI.D.turns.length+' lines';
  PI.D.turns.forEach(t=>{
    const row=el('div','turn'); row.dataset.id=t.id;
    const rl=roleOf(t); row.style.setProperty('--rc', rl.c);
    row.append(el('div','t tnum',clock(t.start_s)));
    const body=el('div');
    if (rl.label) body.append(el('span','who',rl.label+'  '));
    const tx=el('span','tx'+(/\?\s*$/.test(t.text)?' q':''),t.text);
    body.append(tx);
    row.append(body);
    row.onmouseenter=()=>traceFromTurn(t.id);
    row.onmouseleave=clearTrace;
    box.append(row);
  });
  paintTrace();
}

/* ---------- tabs ---------- */
const TABS=[['timeline','Timeline'],['handoff','Handoff'],['opnote','Op note'],['family','Family']];
function renderTabs(){
  const box=$('#tabs'); box.innerHTML='';
  TABS.forEach(([k,nm])=>{
    if (k!=='timeline' && !PI.D.drafts[k]) return;
    const t=el('button','tab'); t.setAttribute('role','tab'); t.setAttribute('aria-selected',String(k===PI.tab));
    t.append(el('span',null,nm));
    if (k==='handoff') t.append(el('span','fmt',PI.D.profile.handoff_name));
    const dr=PI.D.drafts[k];
    if (dr && dr.text && !dr.text.startsWith('[')){
      const flags=(dr.unsupported_claims||[]).filter(x=>!/not generated|not fact-checked/.test(x));
      t.append(el('span','dot '+(flags.length?'flag':'ok')));
    }
    t.onclick=()=>{ PI.tab=k; renderTabs(); renderTab(); };
    box.append(t);
  });
}

function renderTab(){
  const host=$('#tabBody');
  if (PI.tab==='timeline') return renderTimeline(host);
  renderDoc(host, PI.tab);
}

/* ---------- timeline ---------- */
function stateAt(t){ let cur=(PI.D.states||[])[0]||{}; for(const s of PI.D.states||[]){ if(s.as_of_s<=t) cur=s; else break; } return cur; }
function renderTimeline(host){
  host.innerHTML='';
  const wrap=el('div','tlwrap');
  if (!PI.D.events.length){
    const e=el('div','tl-empty');
    e.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><br>'
      +'No clinical events were extracted from this recording.<br>Too short, noisy, or not clinical speech &mdash; shown as-is rather than invented.';
    wrap.append(e); host.append(wrap); return;
  }
  wrap.append(snapshot());
  const rail=el('div','rail');
  PI.D.events.slice().sort((a,b)=>a.t_start_s-b.t_start_s).forEach(e=>{
    const row=el('div','ev'); row.dataset.id=e.id;
    row.style.setProperty('--rc', (ROLE[e.by_role||EVROLE[e.type]]||ROLE.other).c);
    if (e.t_start_s>PI.playT) row.classList.add('future');
    if (PI.hotEv.has(e.id)) row.classList.add('hot');
    row.append(el('div','clk tnum',clock(e.t_start_s)));
    const txt=el('div','txt');
    txt.append(el('span','kind',KIND[e.type]||e.type));
    txt.append(document.createTextNode(' '+evText(e)));
    const who=ROLE[e.by_role]; if (who && who.label) txt.append(el('span','by',' · '+who.label.toLowerCase()));
    row.append(txt);
    row.onmouseenter=()=>traceFromEvent(e.id);
    row.onmouseleave=clearTrace;
    rail.append(row);
  });
  wrap.append(rail);
  host.append(wrap);
}
function snapshot(){
  const S=stateAt(PI.playT), d=el('div','snap');
  const sev=severity(S), sc={stable:'var(--ok)',watcher:'var(--watch)',unstable:'var(--alert)'}[sev];
  d.style.setProperty('--sev', sc);
  const chip=(t)=>`<span class="chip">${t}</span>`;
  const parts=[
    (PI.playT<PI.dur-.5 ? `<b>${clock(PI.playT)}</b>` : 'final') + ' ·',
    `<span class="sev-label">${sev}</span>`,
    `phase <b>${(S.phase||'').replace(/_/g,' ')}</b>`,
  ];
  if ((S.findings||[]).length) parts.push(chip(S.findings.length + ' finding' + (S.findings.length>1?'s':'')));
  if (S.ebl_ml!=null) parts.push(chip(`EBL ${S.ebl_ml} mL`));
  const tx=S.transfusion_totals||{}; if (Object.keys(tx).length) parts.push(chip(Object.entries(tx).map(([k,v])=>`${v} ${k}`).join(', ')));
  if ((S.implants||[]).length) parts.push(chip('implant'));
  if ((S.drains||[]).length) parts.push(chip('drain'));
  if (S.converted) parts.push(chip('converted'));
  if (S.counts) parts.push(chip('counts ' + esc(String(S.counts).split(/[(:]/)[0].trim())));
  if (S.disposition) parts.push('→ <b>' + esc(String(S.disposition).split(/[(,]/)[0].trim()) + '</b>');
  d.innerHTML = parts.join(' ');
  return d;
}
function severity(S){
  const c=(S.complications||[]).length, o=(S.open_concerns||[]).length;
  if (S.disposition && /icu/i.test(S.disposition) && (c||o)) return 'unstable';
  if (c||o||S.converted) return 'watcher';
  return 'stable';
}
function evText(e){
  const p=e.payload||{};
  if (e.type==='phase_transition') return (p.phase||'').replace(/_/g,' ');
  if (e.type==='finding') return p.description||'';
  if (e.type==='medication_given') return [p.name,p.dose,p.route].filter(Boolean).join(' ');
  if (e.type==='blood_loss') return 'about '+p.ebl_ml+' mL';
  if (e.type==='transfusion') return [p.units,p.product].filter(Boolean).join(' ');
  if (e.type==='conversion') return (p.from||'')+' to '+(p.to||'');
  if (e.type==='count_status') return (p.status||'')+(p.intentional?' (intentional)':'');
  if (e.type==='disposition') return [p.destination,p.detail].filter(Boolean).join(' - ');
  return Object.values(p).filter(v=>typeof v!=='object').join(' - ')||'';
}

/* ---------- document ---------- */
function renderDoc(host, kind){
  host.innerHTML='';
  const dr=PI.D.drafts[kind];
  const d=el('div','doc');
  if (!dr||!dr.text){ d.className='doc empty'; d.textContent='no draft'; host.append(d); return; }
  if (dr.text.startsWith('[')){ d.className='doc empty'; d.textContent=dr.text.replace(/^\[|\]$/g,''); host.append(d); return; }
  const flags=(dr.unsupported_claims||[]).filter(x=>!/not generated|not fact-checked/.test(x));
  if (flags.length){
    const f=el('div','flags'); f.append(el('b',null,'Not verified against the transcript'));
    const ul=el('ul'); flags.forEach(x=>ul.append(el('li',null,x))); f.append(ul); d.append(f);
  }
  if (PI.playT<PI.dur-.5){
    const n=el('div','scrubnote');
    n.textContent='This document reflects the whole case; the transcript is scrubbed back to '+clock(PI.playT)+'.';
    d.append(n);
  }
  const links=PI.D.links[kind]||[]; const text=dr.text;
  let off=0;
  for (const raw of text.split('\n')){
    const lstart=off; off+=raw.length+1;
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/^\*{0,2}([A-Z][A-Za-z0-9 ,/&()'—–-]{1,44}?)\*{0,2}:\s*(.*)$/);
    if (m && (m[2]==='' || m[1].length<46)){
      const p=el('p');
      p.append(el('span','lead',m[1].replace(/\*/g,'')));
      if (m[2]) inline(p, m[2], lstart+(raw.length-m[2].length), links);
      d.append(p); continue;
    }
    const p=el('p'); inline(p, raw, lstart, links); d.append(p);
  }
  host.append(d);
}
function inline(p, str, gOff, links){
  const clean=str.replace(/\*\*/g,'');
  const shift=i=>i-(str.slice(0,i).match(/\*\*/g)||[]).length*2;
  const local=links.map(lk=>({...lk,s:lk.start-gOff,e:lk.end-gOff})).filter(lk=>lk.s>=0&&lk.e<=str.length&&lk.e>lk.s).sort((a,b)=>a.s-b.s);
  let i=0;
  for (const lk of local){
    const s=shift(lk.s), e=shift(lk.e);
    if (s>i) p.append(document.createTextNode(clean.slice(i,s)));
    const span=el('span','lk',clean.slice(s,e)); span.title=lk.label;
    span.dataset.ev=lk.event_ids.join(','); span.dataset.tn=lk.turn_ids.join(',');
    span.onmouseenter=()=>{ PI.hotEv=new Set(lk.event_ids); PI.hotTurn=new Set(lk.turn_ids); paintTrace(true); };
    span.onmouseleave=clearTrace;
    p.append(span); i=e;
  }
  if (i<clean.length) p.append(document.createTextNode(clean.slice(i)));
}

/* ---------- trace ---------- */
function traceFromTurn(tid){
  PI.hotTurn=new Set([tid]);
  PI.hotEv=new Set(PI.D.events.filter(e=>(e.evidence_turn_ids||[]).includes(tid)).map(e=>e.id));
  paintTrace();
}
function traceFromEvent(eid){
  const e=PI.D.events.find(x=>x.id===eid);
  PI.hotEv=new Set([eid]); PI.hotTurn=new Set(e?e.evidence_turn_ids:[]);
  paintTrace(true);
}
function clearTrace(){ PI.hotEv.clear(); PI.hotTurn.clear(); paintTrace(); }
function paintTrace(scrollTurn){
  document.querySelectorAll('.turn').forEach(r=>{
    r.classList.toggle('hot',PI.hotTurn.has(r.dataset.id));
    r.classList.toggle('dim',PI.hotTurn.size>0 && !PI.hotTurn.has(r.dataset.id));
  });
  document.querySelectorAll('.ev').forEach(r=>r.classList.toggle('hot',PI.hotEv.has(r.dataset.id)));
  document.querySelectorAll('.doc .lk').forEach(s=>{
    const evs=(s.dataset.ev||'').split(',').filter(Boolean);
    s.classList.toggle('hot', evs.some(x=>PI.hotEv.has(x)));
  });
  if (scrollTurn && PI.hotTurn.size){
    const first=[...document.querySelectorAll('.turn.hot')][0];
    if (first) first.scrollIntoView({block:'center',behavior:'smooth'});
  }
}

/* ---------- transport ---------- */
function syncScrub(){
  const scrubbed = PI.playT < PI.dur-.5;
  const pct=Math.min(100,PI.playT/PI.dur*100);
  $('#scrubFill').style.width=pct+'%'; $('#scrubKnob').style.left=pct+'%';
  $('#clk').innerHTML = scrubbed ? `<b>${clock(PI.playT)}</b> / ${clock(PI.dur)}` : clock(PI.dur);
}
function seekTo(v){
  PI.playT = Math.max(0, Math.min(1, v)) * PI.dur;
  if (PI.audio && isFinite(PI.audio.duration)) PI.audio.currentTime = Math.min(PI.playT, PI.audio.duration-0.05);
  followPlay(true);
}
let _last=0;
function followPlay(force){
  syncScrub();
  const now=performance.now();
  if (!force && now-_last<140) return;
  _last=now;
  if (PI.tab==='timeline') renderTab();
  const S=PI.D.turns; let best=null;
  for (const t of S){ if (t.start_s<=PI.playT+1.5) best=t; else break; }
  if (best && !PI.hotTurn.size){
    const row=document.querySelector(`.turn[data-id="${best.id}"]`);
    if (row) row.scrollIntoView({block:'center'});
  }
}
function play(){
  PI.playing=!PI.playing;
  $('#playBtn').innerHTML = PI.playing ? '&#10073;&#10073;' : '&#9654;';
  if (PI.audio){
    if (PI.playing){ if (PI.playT>=PI.dur-.5){ PI.playT=0; PI.audio.currentTime=0; } PI.audio.play(); }
    else PI.audio.pause();
    return;
  }
  if (!PI.playing){ cancelAnimationFrame(PI.raf); return; }
  if (PI.playT>=PI.dur) PI.playT=0;
  let t0=performance.now();
  const step=now=>{
    if (!PI.playing) return;
    PI.playT += (now-t0)/1000*50; t0=now;
    if (PI.playT>=PI.dur){ PI.playT=PI.dur; PI.playing=false; $('#playBtn').innerHTML='&#9654;'; followPlay(true); return; }
    followPlay(); PI.raf=requestAnimationFrame(step);
  };
  PI.raf=requestAnimationFrame(step);
}

function setupAudio(D){
  const a=$('#audio'), tag=$('#audioTag');
  a.pause(); PI.playing=false; $('#playBtn').innerHTML='&#9654;';
  if (PI.live && D.has_audio){
    a.src='/api/cases/'+PI.id+'/audio?v='+(D.audio_bytes||1); tag.hidden=false;
    a.onended=()=>{ PI.playing=false; $('#playBtn').innerHTML='&#9654;'; };
    a.ontimeupdate=()=>{ if(!a.paused){ PI.playT=a.currentTime; followPlay(); } };
    PI.audio=a;
  } else { a.removeAttribute('src'); a.load(); tag.hidden=true; PI.audio=null; }
}

/* ---------- profile re-run ---------- */
async function reprofile(p){
  const base=PI.id.split('__')[0], newId=base+'__'+p;
  tip('re-running with the '+p.replace(/_/g,' ')+' profile — about 3 min');
  try{
    const fd=new FormData(); fd.append('profile',p);
    const r=await fetch('/api/cases/'+base+'/reprofile',{method:'POST',body:fd});
    if (!r.ok) throw new Error((await r.json()).detail||r.statusText);
    poll(newId,p);
  }catch(e){ tip('could not switch: '+e.message); $('#profSel').value=PI.D.profile.id; }
}
function poll(id,p){
  const t0=Date.now();
  const go=async()=>{
    const s=await (await fetch('/api/cases/'+id+'/status')).json();
    if (s.error){ tip('run failed: '+s.error); return; }
    if (s.done){
      PI.cases[id]=null;
      if (![...$('#caseSel').options].some(o=>o.value===id)) $('#caseSel').append(new Option((TITLE[id.split('__')[0]]||id)+' ('+p.replace(/_/g,' ')+')',id));
      await load(id); tip('same transcript, '+p.replace(/_/g,' ')+' profile');
      return;
    }
    $('#tip').textContent = 'reconstructing … '+((s.logged_agents||[]).length)+'/10 steps';
    if (Date.now()-t0<600000) setTimeout(go,2500);
  };
  go();
}
function tip(m){ const t=$('#tip'); t.textContent=m; setTimeout(()=>t.textContent=t.dataset.def,3500); }

/* ---------- wire ---------- */
function wire(){
  $('#tip').dataset.def=$('#tip').textContent;
  $('#playBtn').onclick=play;
  const sc=$('#scrub'); let drag=false;
  const at=x=>{ const r=sc.getBoundingClientRect(); seekTo((x-r.left)/r.width); };
  sc.onpointerdown=e=>{ drag=true; sc.setPointerCapture(e.pointerId); at(e.clientX); };
  sc.onpointermove=e=>{ if(drag) at(e.clientX); };
  sc.onpointerup=()=>drag=false;
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'));
  };
  addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return; if(e.key===' '){ e.preventDefault(); play(); } });
}
boot();
</script>
