<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#EEF1EF; --surface:#FFFFFF; --surface-2:#F1F4F2; --surface-3:#E7ECE9;
  --ink:#14231F; --ink-soft:#566661; --ink-faint:#8B9A94;
  --line:#DBE2DE; --line-strong:#C6D0CB;
  --accent:#0B6E63; --accent-ink:#0A5850; --accent-wash:rgba(11,110,99,.09);
  --ok:#2E7D5B; --watch:#B0791A; --alert:#B23B32;
  --r-surgeon:#0B6E63; --r-anesthesia:#9A6114; --r-nurse:#3D6A9E; --r-scrub:#7A5AA6; --r-other:#8B9A94;
  --shadow-sm:0 1px 2px rgba(20,35,31,.06);
  --shadow-md:0 4px 16px -4px rgba(20,35,31,.12),0 1px 3px rgba(20,35,31,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0F0E; --surface:#131B19; --surface-2:#0F1615; --surface-3:#1B2523;
  --ink:#E6ECE9; --ink-soft:#93A29C; --ink-faint:#5F6E68;
  --line:#26312E; --line-strong:#38443F;
  --accent:#42C3B2; --accent-ink:#74DACB; --accent-wash:rgba(66,195,178,.12);
  --ok:#4FB489; --watch:#D4A65A; --alert:#E2726B;
  --r-surgeon:#42C3B2; --r-anesthesia:#D4A65A; --r-nurse:#6FA6D8; --r-scrub:#AC8FDC; --r-other:#5F6E68;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px -6px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0A0F0E; --surface:#131B19; --surface-2:#0F1615; --surface-3:#1B2523;
  --ink:#E6ECE9; --ink-soft:#93A29C; --ink-faint:#5F6E68;
  --line:#26312E; --line-strong:#38443F;
  --accent:#42C3B2; --accent-ink:#74DACB; --accent-wash:rgba(66,195,178,.12);
  --ok:#4FB489; --watch:#D4A65A; --alert:#E2726B;
  --r-surgeon:#42C3B2; --r-anesthesia:#D4A65A; --r-nurse:#6FA6D8; --r-scrub:#AC8FDC; --r-other:#5F6E68;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px -6px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-wash)}
.tnum{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100vh;opacity:0}
.app.in{opacity:1;transition:opacity .35s ease}

/* header */
.bar{display:flex;align-items:center;gap:11px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;box-shadow:var(--shadow-sm);z-index:5}
.mark{width:24px;height:24px;flex:none;border-radius:6px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));display:grid;place-items:center}
.mark svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bar h1{font-family:var(--serif);font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:.01em}
.bar h1 .dim{color:var(--ink-faint);font-weight:400}
select{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 28px 6px 11px;appearance:none;cursor:pointer;transition:border-color .12s,background .12s;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat}
select:hover{border-color:var(--line-strong);background-color:var(--surface-3)}
.bar .spacer{flex:1}
.themebtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-soft);transition:background .12s,color .12s}
.themebtn:hover{background:var(--surface-2);color:var(--ink)}

/* body: two panes */
.panes{flex:1;display:grid;grid-template-columns:39fr 61fr;min-height:0;gap:0}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.pane.left{border-right:1px solid var(--line);background:var(--surface-2)}
.pane.right{background:var(--ground)}
.pane-head{flex:none;display:flex;align-items:center;gap:8px;padding:13px 18px 9px}
.pane-head h2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.pane-head .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:11px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);background-clip:padding-box}

/* transcript */
#turns{padding:2px 0 24px}
.turn{position:relative;display:grid;grid-template-columns:40px 1fr;gap:11px;padding:6px 16px 6px 15px;border-left:2px solid transparent;transition:background .12s,opacity .15s}
.turn::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--rc,transparent);opacity:.5;transition:opacity .12s}
.turn:hover{background:var(--surface)}
.turn.hot{background:var(--accent-wash);border-left-color:var(--accent)}
.turn.hot::before{opacity:0}
.turn.dim{opacity:.32}
.turn .t{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding-top:4px;text-align:right}
.turn .who{font-size:10.5px;font-weight:600;color:var(--rc,var(--accent-ink));text-transform:uppercase;letter-spacing:.03em}
.turn .tx{color:var(--ink);font-size:13.5px;line-height:1.5}
.turn .tx.q{color:var(--ink-soft)}

/* patient strip */
.patient{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);box-shadow:var(--shadow-sm);z-index:2}
.patient b{color:var(--ink);font-weight:600}
.patient .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}
.patient .tag{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-wash);border-radius:4px;padding:2px 6px}
.patient .warn{color:var(--alert);font-weight:600;background:color-mix(in srgb,var(--alert) 10%,transparent);border-radius:4px;padding:2px 7px;font-size:11.5px}

/* tabs */
.tabs{flex:none;display:flex;gap:2px;padding:10px 18px 0;background:var(--ground)}
.tab{font-size:12.5px;padding:9px 14px;border-radius:9px 9px 0 0;color:var(--ink-soft);border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px;transition:color .12s,background .12s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--line);background:var(--surface);position:relative;top:1px;box-shadow:0 -3px 10px -6px rgba(20,35,31,.15)}
.tab .fmt{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.tab .dot.ok{background:var(--ok)} .tab .dot.flag{background:var(--alert);box-shadow:0 0 0 3px color-mix(in srgb,var(--alert) 20%,transparent)}
#tabScroll{background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-md)}

/* timeline tab */
.tlwrap{padding:18px 22px 44px}
.snap{position:relative;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--sev,var(--ok));border-radius:9px;padding:11px 14px;margin-bottom:20px;line-height:1.6}
.snap b{color:var(--ink)}
.snap .chip{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.snap .sev-label{font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--sev,var(--ok))}
.rail{position:relative;padding-left:26px}
.rail::before{content:"";position:absolute;left:6px;top:8px;bottom:14px;width:2px;background:linear-gradient(var(--line-strong),var(--line))}
.ev{position:relative;display:grid;grid-template-columns:48px 1fr;gap:12px;padding:8px 10px 8px 0;border-radius:8px;cursor:default;transition:background .12s,opacity .18s}
.ev::before{content:"";position:absolute;left:-23px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--rc,var(--accent));transition:transform .12s,box-shadow .12s}
.ev:hover{background:var(--surface-2)}
.ev:hover::before,.ev.hot::before{transform:scale(1.3);box-shadow:0 0 0 4px var(--accent-wash)}
.ev.hot{background:var(--accent-wash)}
.ev.future{opacity:.28}
.ev.future::before{background:var(--line);border-color:var(--line-strong)}
.ev .clk{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);padding-top:3px;text-align:right}
.ev .txt{font-size:13.5px;color:var(--ink);line-height:1.5}
.ev .txt .kind{display:inline-block;color:var(--rc,var(--ink-soft));font-family:var(--mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-right:7px;vertical-align:1px}
.ev .txt .by{color:var(--ink-faint);font-size:11px;margin-left:6px}
.tl-empty{padding:56px 24px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.95}
.tl-empty svg{width:34px;height:34px;stroke:var(--line-strong);fill:none;stroke-width:1.6;margin-bottom:12px}

/* document tab */
.doc{padding:26px 34px 68px;font-family:var(--serif);font-size:15.5px;line-height:1.72;color:var(--ink);max-width:70ch}
.doc p{margin:0 0 12px}
.doc .lead{display:block;font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin:18px 0 3px}
.doc p:first-child .lead{margin-top:0}
.doc .lk{border-bottom:1.5px solid var(--accent);cursor:pointer;transition:background .12s;border-radius:2px}
.doc .lk:hover,.doc .lk.hot{background:var(--accent-wash)}
.doc .flags{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent);border:1px solid color-mix(in srgb,var(--alert) 22%,transparent);border-radius:9px;padding:11px 13px;margin-bottom:18px}
.doc .flags b{display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.doc .flags ul{margin:0 0 0 16px}
.doc .scrubnote{font-family:var(--sans);font-size:11.5px;color:var(--watch);background:color-mix(in srgb,var(--watch) 9%,transparent);border-radius:7px;padding:7px 11px;margin-bottom:16px}
.doc.empty{font-family:var(--sans);color:var(--ink-faint);font-size:13px;padding-top:40px}

/* transport */
.transport{flex:none;display:flex;align-items:center;gap:15px;padding:11px 20px;border-top:1px solid var(--line);background:var(--surface);box-shadow:0 -2px 12px -6px rgba(20,35,31,.12);z-index:3}
.play{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink);background:var(--surface-2);font-size:12px;transition:border-color .12s,color .12s,background .12s,transform .1s}
.play:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.play:active{transform:scale(.94)}
.scrub{flex:1;height:22px;display:flex;align-items:center;position:relative;cursor:pointer}
.scrub .track{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-ink),var(--accent));border-radius:3px}
.scrub .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);transform:translate(-50%,-50%);box-shadow:var(--shadow-sm);transition:width .1s,height .1s}
.scrub:hover .knob{width:16px;height:16px}
.clk{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.02em}
.clk b{color:var(--ink)}
.audiotag{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent-wash);border-radius:5px;padding:3px 7px;white-space:nowrap}
.tip{font-size:11px;color:var(--ink-faint);white-space:nowrap;max-width:34ch;overflow:hidden;text-overflow:ellipsis}
#audio{display:none}

.loading{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:var(--ink-soft);z-index:50}
.loading .mark{width:34px;height:34px;border-radius:9px;animation:pulse 1.6s ease-in-out infinite}
.loading .mark svg{width:19px;height:19px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.93)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.app{opacity:1}}
@media (max-width:960px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .panes{grid-template-columns:1fr}
  .pane.left{border-right:none;border-bottom:1px solid var(--line)}
  .pane .scroll{max-height:58vh}
  .tip{display:none}
  .doc{padding:22px 20px 60px}
}
</style>
</head>

he cystic duct and artery clearly getting my critical view","source":"whisper"},{"id":"t0015","start_s":127.29503,"end_s":135.29503,"speaker":null,"role":"surgeon","text":"Clipping the cystic artery, and the cystic duct, two clips proximal, one distal, dividing.","source":"whisper"},{"id":"t0016","start_s":135.29503,"end_s":140.29503,"speaker":null,"role":"surgeon","text":"Taking the gallbladder off the liver bed with the cautery.","source":"whisper"},{"id":"t0017","start_s":140.29503,"end_s":147.79503,"speaker":null,"role":"surgeon","text":"Gallbladder is out. It's going to pathology. Send it as gallbladder. Acute cholecystitis.","source":"whisper"},{"id":"t0018","start_s":150.29503,"end_s":155.45503,"speaker":null,"role":"surgeon","text":"More oozing from the liver bed. Let's put some hemostatic agent on it and pack it for a few minutes.","source":"whisper"},{"id":"t0019","start_s":157.97504,"end_s":164.35503,"speaker":null,"role":"anesthesia","text":"Blood pressure dipped to 92 over 55, giving a fluid bolus. Heart rate's up to 104.","source":"whisper"},{"id":"t0020","start_s":164.35503,"end_s":171.67502,"speaker":null,"role":"surgeon","text":"Bleeding's controlled now. Total blood loss I'd estimate around 400 mils.","source":"whisper"},{"id":"t0021","start_s":174.07503,"end_s":180.51501,"speaker":null,"role":"anesthesia","text":"Pressure came back up to 118 over 68 after the liter of crystalloid. No transfusion needed.","source":"whisper"},{"id":"t0022","start_s":182.77502,"end_s":187.99503,"speaker":null,"role":"surgeon","text":"Placing a Jackson-Pratt drain in the gallbladder fossa, bringing it out the lateral port site.","source":"whisper"},{"id":"t0023","start_s":190.43503,"end_s":194.03503,"speaker":null,"role":"circulating_nurse","text":"Instrument, sponge, and needle counts are correct times two.","source":"whisper"},{"id":"t0024","start_s":194.35503,"end_s":200.09503,"speaker":null,"role":"surgeon","text":"Closing the fascia with looped PDS, skin with staples","source":"whisper"},{"id":"t0025","start_s":200.09503,"end_s":209.39502,"speaker":null,"role":"anesthesia","text":"Reversing paralysis, patient breathing spontaneously, extubated, moving all four extremities","source":"whisper"},{"id":"t0026","start_s":211.39502,"end_s":220.43503,"speaker":null,"role":"surgeon","text":"For handoff, converted lap chole to open, difficult anatomy, EBL 400, 1JP drain in the fossa, no transfusion","source":"whisper"},{"id":"t0027","start_s":220.43503,"end_s":228.89502,"speaker":null,"role":"surgeon","text":"He'll go to the PACU first, then I want him admitted overnight for pain control and to watch the drain output","source":"whisper"},{"id":"t0028","start_s":228.89502,"end_s":235.51503,"speaker":null,"role":"circulating_nurse","text":"Agree, floor admission after PACU, I'll update the family now","source":"whisper"}],"events":[{"id":"e000","t_start_s":0.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"arrival"},"evidence_turn_ids":["t0000"],"by_role":"circulating_nurse","confidence":1.0,"extractor":"llm"},{"id":"e001","t_start_s":17.74,"t_end_s":null,"type":"phase_transition","payload":{"phase":"induction"},"evidence_turn_ids":["t0002"],"by_role":"anesthesia","confidence":1.0,"extractor":"llm"},{"id":"e002","t_start_s":17.74,"t_end_s":null,"type":"line_placed","payload":{"type":"IV","site":"left forearm"},"evidence_turn_ids":["t0002"],"by_role":"anesthesia","confidence":1.0,"extractor":"llm"},{"id":"e003","t_start_s":24.48,"t_end_s":null,"type":"phase_transition","payload":{"phase":"timeout"},"evidence_turn_ids":["t0003"],"by_role":"surgeon","confidence":1.0,"extractor":"llm"},{"id":"e004","t_start_s":38.899998,"t_end_s":null,"type":"medication_given","payload":{"name":"Cefazolin","dose":"2 grams","route":"IV"},"evidence_turn_ids":["t0004"],"by_role":"circulating_nurse","confidence":1.0,"extractor":"llm"},{"id":"e005","t_start_s":49.559998,"t_end_s":null,"type":"phase_transition","payload":{"phase":"positioning_prep :["transient chest pain and hypotension during balloon inflation","chest pain and hypotension (95 mmHg systolic) during balloon inflation"],"disposition":"coronary care unit (for overnight monitoring)","disposition_path":["coronary care unit"],"last_event_id":"e024","provenance":{"phase":["e000","e003","e005","e008","e009","e020","e021","e022"],"meds":["e001","e002","e006","e007","e023","e024"],"lines":["e004"],"complications":["e013"],"open_concerns":["e014"],"implants":["e016"],"ebl_ml":["e019"],"disposition":["e022"]}}],"drafts":{"handoff":{"kind":"handoff","text":"**S \u2014 Situation**: 61-year-old man, underwent coronary angiography and PCI to mid-LAD. Currently stable, transferred to CCU for overnight monitoring.\n**B \u2014 Background**: Indication NSTEMI. Allergies: iodinated contrast (mild urticaria) - premedicated. Right radial access site, 6 French sheath, closed with radial band. Contrast volume 140 mL. Heparin given (radial cocktail). Aspirin and Ticagrelor started post-procedure. One 3x18mm drug-eluting stent deployed in mid-LAD. Transient chest pain and hypotension (95 mmHg systolic) occurred during balloon inflation, resolved. Blood loss minimal (0 mL EBL).\n**A \u2014 Assessment**: Stable. Right radial access site with radial band, distal pulse good, hand pink and warm. Main concern is history of transient chest pain and hypotension during balloon inflation, which resolved.\n**R \u2014 Recommendation**: Monitor right radial access site for bleeding/hematoma. Monitor right hand for distal pulse, color, temperature, and sensation. Bed rest duration not documented. Continue Aspirin and Ticagrelor. Escalate if chest pain recurs, hypotension, access site bleeding, or neurovascular changes in right hand.\n\nReceiving nurse read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Date: not documented\nOperator: not documented\nProcedure: Coronary angiography and percutaneous coronary intervention (PCI)\nIndication: Non-ST-elevation myocardial infarction (NSTEMI)\nAccess site and closure: Right radial, radial band for hemostasis\nSheath size: 6 French\nContrast agent and volume: 140 mL, agent not documented\nFluoroscopy time / dose: 12 minutes / not documented\nAnticoagulation: Heparin (given as part of radial cocktail)\nFindings: 90% stenosis in the mid-LAD. Right coronary artery clean.\nDevices / stents deployed: One 3x18mm drug-eluting stent\nComplications: Transient chest pain and hypotension during balloon inflation, resolved.\nEstimated blood loss: Minimal (0 mL)\nDisposition: Coronary care unit for overnight monitoring\n\nBrief narrative:\nFollowing sedation, right radial access was obtained, and diagnostic angiography revealed a 90% stenosis in the mid-LAD. Percutaneous coronary intervention was performed, including predilation and deployment of a 3x18mm drug-eluting stent, despite a transient episode of chest pain and hypotension during balloon inflation which resolved. Post-dilation was performed, and the sheath was removed with a radial band applied for hemostasis. Dual antiplatelet therapy was initiated, and the patient was transferred to the coronary care unit for overnight monitoring.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your loved one has completed the procedure to open a blocked artery in the heart. This was done through a small tube in an artery, not open surgery. There was a difficulty during the procedure that the team managed. The patient is now in the coronary care unit and will need to lie still for a while so the small puncture site can heal. The cardiologist will come speak with you directly.","unsupported_claims":[],"revised":false,"accepted":true}},"links":{"handoff":[{"start":46,"end":54,"field":"disposition","label":"disposition: coronary care unit (for overnight monitoring)","event_ids":["e022"],"turn_ids":["t0013"]},{"start":344,"end":351,"field":"meds","label":"medication: heparin","even art rate 130, activating massive transfusion protocol, hanging PRBC and FFP now","source":"whisper"},{"id":"t0003","start_s":30.599998,"end_s":37.62,"speaker":null,"role":"surgeon","text":"No time for a formal timeout, prepping and draping, beta-9, wide","source":"whisper"},{"id":"t0004","start_s":40.02,"end_s":46.28,"speaker":null,"role":"surgeon","text":"Midline laparotomy from xiphoid to pubis, lots of blood in the abdomen, suction, and get me packs","source":"whisper"},{"id":"t0005","start_s":46.28,"end_s":54.1,"speaker":null,"role":"surgeon","text":"Packing all four quadrants. The bleeding is coming from the left upper quadrant. I think the spleen.","source":"whisper"},{"id":"t0006","start_s":56.66,"end_s":64.28,"speaker":null,"role":"anesthesia","text":"Still hypotensive. 68 systolic. Giving another 2 units red cells and 2 FFP. Started norepinephrine.","source":"whisper"},{"id":"t0007","start_s":66.38,"end_s":72.6,"speaker":null,"role":"surgeon","text":"The spleen is shattered. Doing a splenectomy. Clamping the hilum now. Dividing the short gastrics.","source":"whisper"},{"id":"t0008","start_s":72.6,"end_s":79.28,"speaker":null,"role":"surgeon","text":"Spleen is out, that was the main source, pressure should start coming up","source":"whisper"},{"id":"t0009","start_s":79.28,"end_s":99.96,"speaker":null,"role":"surgeon","text":"Coming up now 95 over 55 on a little Narepi we given 6 units red cells 4 FFP 1 platelet so far Now running the bowel there a segment of small bowel with a mesenteric tear and it looks non about 20 cm","source":"whisper"},{"id":"t0010","start_s":102.659996,"end_s":103.78,"speaker":null,"role":"surgeon","text":"Resecting that segment.","source":"whisper"},{"id":"t0011","start_s":104.34,"end_s":106.36,"speaker":null,"role":"surgeon","text":"Stapling across proximal and distal.","source":"whisper"},{"id":"t0012","start_s":106.67999,"end_s":108.6,"speaker":null,"role":"surgeon","text":"Leaving it in discontinuity for now.","source":"whisper"},{"id":"t0013","start_s":110.759995,"end_s":112.659996,"speaker":null,"role":"surgeon","text":"Rest of the bowel looks okay.","source":"whisper"},{"id":"t0014","start_s":113.02,"end_s":113.96,"speaker":null,"role":"surgeon","text":"Liver is intact.","source":"whisper"},{"id":"t0015","start_s":114.28,"end_s":116.479996,"speaker":null,"role":"surgeon","text":"No other major injuries that I can see.","source":"whisper"},{"id":"t0016","start_s":118.06,"end_s":126.22,"speaker":null,"role":"surgeon","text":"Patient still cold and coagulopathic. We're going to do damage control. Temporary abdominal closure with a wound vac.","source":"whisper"},{"id":"t0017","start_s":128.28,"end_s":132.78,"speaker":null,"role":"surgeon","text":"Leaving packs in the pelvis and the left upper quadrant. Abdomen stays open.","source":"whisper"},{"id":"t0018","start_s":135.28,"end_s":142.98,"speaker":null,"role":"circulating_nurse","text":"Counts are intentionally incorrect. Documenting. Four laparotomy pads retained on purpose for damage control, plus the packs.","source":"whisper"},{"id":"t0019","start_s":142.98,"end_s":154.51999,"speaker":null,"role":"anesthesia","text":"EBL is hard to estimate, at least 3 liters, total given, 8 red cells, 6 FFP, 2 platelets, 1 cryo","source":"whisper"},{"id":"t0020","start_s":154.51999,"end_s":165.0,"speaker":null,"role":"surgeon","text":"For handoff, damage control laparotomy, splenectomy, small bowel resection in discontinuity, open abdomen with packs","source":"whisper"},{"id":"t0021","start_s":165.0,"end_s":177.41998,"speaker":null,"role":"surgeon","text":"Going to the ICU intubated, on norepinephrine. Plan is to warm, resuscitate, correct COADs, and back to the OR in 24-48 hours","source":"whisper"},{"id":"t0022","start_s":179.45999,"end_s":185.01999,"speaker":null,"role":"surgeon","text":"The family is in the surgical waiting room, they know it's serious, I'll go talk to them now","source":"whisper"}],"events":[{"id":"e000","t_start_s":9.44,"t_end_s" ion in discontinuity; Temporary abdominal closure with wound vac; Damage control laparotomy\nSurgeon / anesthesia: not documented\nAnesthesia type: Rapid sequence induction\nFindings: Lots of blood in the abdomen; Shattered spleen; Small bowel mesenteric tear, non-viable segment (20 cm)\nImplants: Wound vac\nEstimated blood loss: 3000 mL\nSpecimens: not documented\nComplications: Small bowel mesenteric tear, non-viable segment (20 cm)\nCounts: Incorrect (Four laparotomy pads retained on purpose for damage control, plus the packs)\nDisposition: ICU (intubated, on norepinephrine, plan for re-exploration in 24-48 hours)\nBrief narrative: Induction was performed with etomidate and succinylcholine, and 2 large bore IVs were placed. A midline laparotomy revealed a shattered spleen and a small bowel mesenteric tear with a 20 cm non-viable segment. The patient remained hypotensive and tachycardic, requiring norepinephrine and massive transfusion protocol activation. A splenectomy and small bowel resection were performed, followed by temporary abdominal closure with a wound vac for damage control. Counts were intentionally incorrect due to retained laparotomy pads and packs. The patient was transferred to the ICU, intubated and on norepinephrine, with plans for re-exploration in 24-48 hours.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your family member had surgery on their abdomen. This was a very serious operation, and the patient is very sick and in critical condition. The team is doing everything possible to care for them. The surgery is being done in stages, and they will need another operation later. Your family member is now in the intensive care unit. The surgeon will come speak with you directly.","unsupported_claims":[],"revised":false,"accepted":true}},"links":{"handoff":[{"start":292,"end":306,"field":"meds","label":"medication: norepinephrine","event_ids":["e008"],"turn_ids":["t0006"]},{"start":326,"end":336,"field kay. And how many times a day are you going, let's say, over the last couple of days?","source":"whisper"},{"id":"t0006","start_s":48.14,"end_s":50.32,"speaker":null,"role":"patient","text":"Probably like six, seven times a day.","source":"whisper"},{"id":"t0007","start_s":50.62,"end_s":53.62,"speaker":null,"role":"clinician","text":"Six, seven times a day. And you mentioned it's mainly watery.","source":"whisper"},{"id":"t0008","start_s":53.62,"end_s":59.26,"speaker":null,"role":"clinician","text":"Have you noticed any other things like blood in your stools? No, no blood. Yeah, just watery and loose stool","source":"whisper"},{"id":"t0009","start_s":59.399998,"end_s":64.26,"speaker":null,"role":"clinician","text":"Okay, and you mentioned you've had some pain in your tummy as well. Yeah, whereabouts is the pain?","source":"whisper"},{"id":"t0010","start_s":64.26,"end_s":68.08,"speaker":null,"role":"patient","text":"Is that so in my lower abdomen? So like","source":"whisper"},{"id":"t0011","start_s":69.299995,"end_s":72.439995,"speaker":null,"role":"clinician","text":"Yeah, just to one side one side. What side is that?","source":"whisper"},{"id":"t0012","start_s":73.1,"end_s":78.86,"speaker":null,"role":"patient","text":"On the left side. Yes. Okay, then can you describe the pain to me? Yeah, it feels","source":"whisper"},{"id":"t0013","start_s":79.42,"end_s":81.299995,"speaker":null,"role":"patient","text":"like a cramp","source":"whisper"},{"id":"t0014","start_s":81.299995,"end_s":83.299995,"speaker":null,"role":"patient","text":"like a muscular cramp and","source":"whisper"},{"id":"t0015","start_s":84.17999,"end_s":86.31999,"speaker":null,"role":"patient","text":"Yeah, I feel a bit weak and shaky","source":"whisper"},{"id":"t0016","start_s":86.74,"end_s":90.439995,"speaker":null,"role":"clinician","text":"Okay, and there's a pain is that is it there all the time or does it come and go?","source":"whisper"},{"id":"t0017","start_s":90.95999,"end_s":95.24,"speaker":null,"role":"clinician","text":"Comes and goes. Does the pain move anywhere else? For example towards your back?","source":"whisper"},{"id":"t0018","start_s":96.34,"end_s":102.49999,"speaker":null,"role":"clinician","text":"No, just mainly in my stomach. Okay, fine. And you mentioned you've been feeling quite weak and shaky as well","source":"whisper"},{"id":"t0019","start_s":102.49999,"end_s":104.49999,"speaker":null,"role":"clinician","text":"What do you mean by shaky? Do you mean you've been having","source":"whisper"},{"id":"t0020","start_s":104.88,"end_s":106.88,"speaker":null,"role":"clinician","text":"been feeling feverish for example?","source":"whisper"},{"id":"t0021","start_s":106.88,"end_s":120.68,"speaker":null,"role":"patient","text":"Yeah it doesn feel like yeah I just make me feel weak I haven had a fever at the moment but I did notice a temperature when the symptoms started So yeah around about three or four days ago","source":"whisper"},{"id":"t0022","start_s":121.060005,"end_s":122.08,"speaker":null,"role":"clinician","text":"Did you measure your temperature then?","source":"whisper"},{"id":"t0023","start_s":122.920006,"end_s":126.840004,"speaker":null,"role":"patient","text":"Yeah, I didn't measure my temperature, no, but I felt just a bit hot.","source":"whisper"},{"id":"t0024","start_s":127.340004,"end_s":131.94,"speaker":null,"role":"clinician","text":"OK, OK. Any other symptoms like sweating or night?","source":"whisper"},{"id":"t0025","start_s":132.1,"end_s":132.54001,"speaker":null,"role":"patient","text":"No.","source":"whisper"},{"id":"t0026","start_s":133.54001,"end_s":135.3,"speaker":null,"role":"clinician","text":"And any vomiting at all?","source":"whisper"},{"id":"t0027","start_s":135.3,"end_s":142.18001,"speaker":null,"role":"patient","text":"Yeah, so I vomited at the start of the symptoms but now I've stopped vomiting.","source":"whisper"},{"id":"t0028","start_s":142.18001,"end_s":146.34,"speaker":null,"role":"clinician","text":"You ":["e001","e012"],"disposition":["e012"],"meds":["e013"]}},{"as_of_s":399.74,"phase":"safety_netting","meds":[{"name":"Dirolite","dose":"as needed","route":"oral","t_s":383.86},{"name":"paracetamol","dose":"up to 4 times a day","route":"oral","t_s":399.74}],"ebl_ml":null,"transfusions":[],"transfusion_totals":{},"implants":[],"lines":[],"drains":[],"converted":null,"counts":null,"findings":["[symptom] 3-day history of loose, watery diarrhea, 6-7 episodes per day","[symptom] Lower abdominal pain, localized to the left side, cramping in nature, intermittent","[symptom] No blood in stools","[symptom] Generalized weakness and shakiness; subjective fever at onset, no current fever","[symptom] Initial vomiting at symptom onset, now resolved; no blood in vomit","[symptom] Loss of appetite; tolerating fluids and light/liquid foods","[history] Potential trigger: Chinese takeaway consumed 4 days prior to symptom onset","[history] History of asthma, well-controlled with inhaler","[history] No other medications","[history] Non-smoker, no alcohol use","[impression] Gastroenteritis (viral or bacterial)"],"complications":[],"open_concerns":[],"disposition":"follow-up (Review in 3-4 days if symptoms not improved; consider stool sample if ongoing)","disposition_path":["follow-up"],"last_event_id":"e014","provenance":{"findings":["e000","e002","e003","e004","e005","e006","e007","e008","e009","e010","e011"],"phase":["e001","e012"],"disposition":["e012"],"meds":["e013","e014"]}}],"drafts":{"handoff":{"kind":"handoff","text":"**History**: 3-day hx of loose, watery diarrhea (6-7 episodes/day). Associated with intermittent, cramping lower abdominal pain (L-sided). Initial vomiting at onset (now resolved, no blood). Subjective fever at onset, no current fever. Generalized weakness/shakiness. Anorexia, but tolerating fluids and light/liquid foods. No blood in stools. Potential trigger: Chinese takeaway 4 days prior to onset.\n**Background**: PMH: Asthma (well-controlled on inhaler). No other meds. Non-smoker, no alcohol.\n**Examination**: not examined (remote consultation)\n**Impression**: Gastroenteritis (viral or bacterial)\n**Plan**:\n1. Dirolite PO PRN (rehydration).\n2. Paracetamol PO up to 4 times daily for first few days.\n3. Review in 3-4 days if symptoms not improved; consider stool sample if ongoing.\n**Safety-netting**: none documented","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Date: not documented\nClinician: not documented\nConsultation type: Primary care consultation\nPresenting complaint: 3-day history of loose, watery diarrhea, 6-7 episodes per day\nHistory: Patient reports lower abdominal pain, localized to the left side, cramping in nature, and intermittent. No blood in stools. Generalized weakness and shakiness present; subjective fever at onset, no current fever. Initial vomiting at symptom onset, now resolved; no blood in vomit. Loss of appetite, but tolerating fluids and light/liquid foods. Potential trigger identified as Chinese takeaway consumed 4 days prior to symptom onset.\nPast medical history: History of asthma, well-controlled with inhaler.\nMedications and allergies: No other medications. Non-smoker, no alcohol use.\nExamination: not documented\nWorking diagnosis: Gastroenteritis (viral or bacterial)\nManagement plan: Advised to take Dirolite (oral, as needed) to replenish fluids. Advised to take paracetamol (oral, up to 4 times a day) for weakness.\nFollow-up: Review in 3-4 days if symptoms not improved; consider stool sample if ongoing.\nSafety-netting advice: not documented\nBrief narrative: The patient presented with a 3-day history of loose, watery diarrhea and lower abdominal pain. Symptoms included initial vomiting, which has resolved, and generalized weakness. The patient reported consuming Chinese takeaway 4 days prior to onset. The clinician assessed the patient and formed an impression of gastroenteritis. Management included advice to take Dirolite and paracetamol, with a recommendation to review in 3-4 days if symptoms persist.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"You visited the clinic because you have had loose, watery diarrhea and lower stomach pain for the last three days. You also mentioned feeling weak and shaky, and that you vomited at the start of your symptoms but have since stopped. The clinician believes you have gastroenteritis, which is a common stomach infection often caused by a virus. This condition is usually not serious and should get better on its own with time.\n\nFor now, you should take Dirolite as needed to help replace fluids and electrolytes. You can also take paracetamol up to four times a day to help with any pain or weakness. It is important to keep drinking fluids and eating light foods that you can tolerate. You should come back for a review in three to four days if your symptoms have not improved. If your symptoms continue, the clinician may suggest a stool sample to check for other causes.\n\nContact the surgery or 111 if you are unsure or things get worse.","unsupported_claims":[],"revised":false,"accepted":true}},"links":{"handoff":[{"start":618,"end":626,"field":"meds","label":"medication: Dirolite","event_ids":["e013"],"turn_ids":["t0085"]},{"start":652,"end":663,"field":"meds","label":"medication: paracetamol","event_ids":["e014"],"turn_ids":["t0088"]}],"opnote":[{"start":884,"end":892,"field":"meds","label":"medication: Dirolite","event_ids":["e013"],"turn_ids":["t0085"]},{"start":948,"end":959,"field":"meds","label":"medication: paracetamol","event_ids":["e014"],"turn_ids":["t0088"]},{"start":1002,"end":1011,"field":"disposition","label":"disposition: follow-up (Review in 3-4 days if symptoms not improved; consider stool sample if ongoing)","event_ids":["e012"],"turn_ids":["t0082","t0089","t0091","t0093"]},{"start":1510,"end":1518,"field":"meds","label":"medication: Dirolite","event_ids":["e013"],"turn_ids":["t0085"]},{"start":15 s and it's been affecting me. I need to stay close to the toilet and yeah, it's been affecting my day-to-day activities.\", 'allergies': [], 'home_medications': [], 'problem_list': []}"},{"t_wall":1788450582.960852,"agent":"context","message":"groq:qwen/qwen3.8-27b: sources=transcript {'indication': '3 days of diarrhoea', 'allergies': [], 'home_medications': [], 'problem_list': []}"}]},"primock_d2c01":{"case_id":"primock_d2c01","source":"primock_d2c01.mp3","has_audio":true,"audio_bytes":1630700,"profile":{"id":"primary_care","label":"Primary-care consultation (UK)","care_setting":"primary_care_consultation","phases":["greeting","history","examination","assessment","plan","safety_netting"],"handoff_name":"SOAP note"},"context":{"patient_descriptor":"34-year-old man","planned_procedure":null,"indication":"Left-sided hearing loss, tinnitus, and dizziness for six weeks","anesthesia_type":null,"allergies":[],"home_medications":[],"problem_list":[],"sources":{"patient_descriptor":"transcript","indication":"transcript"},"evidence_turn_ids":["t0003","t0005","t0006","t0007","t0013","t0015","t0016"]},"turns":[{"id":"t0000","start_s":0.0,"end_s":10.88,"speaker":null,"role":"clinician","text":"Hi there, good morning. I'm Dr Dean Mirza from Babylon. Can you hear me okay?","source":"whisper"},{"id":"t0001","start_s":10.88,"end_s":16.619999,"speaker":null,"role":"clinician","text":"Can you hear me fine? Okay great, well nice to see you this morning. Before we start your","source":"whisper"},{"id":"t0002","start_s":16.619999,"end_s":19.08,"speaker":null,"role":"clinician","text":"appointment, can I confirm your full name and date of birth please?","source":"whisper"},{"id":"t0003","start_s":19.08,"end_s":27.96,"speaker":null,"role":"patient","text":"Yeah, Jack Smith, 31st October 1990. That's perfect, thank you Jack. Are you in a private","source":"whisper"},{"id":"t0004","start_s":27.96,"end_s":33.059998,"speaker":null,"role":"clinician","text":"place where you're okay to speak at the moment? I am, yes. Okay, great. So tell me what's been","source":"whisper"},{"id":"t0005","start_s":33.059998,"end_s":37.02,"speaker":null,"role":"patient","text":"going on. You've been saying there's a problem with your hearing, is that right? Yes, I just","source":"whisper"},{"id":"t0006","start_s":37.02,"end_s":40.879997,"speaker":null,"role":"patient","text":"feel like I can't really hear as well as I used to, like my hearing's kind of deteriorating in","source":"whisper"},{"id":"t0007","start_s":40.879997,"end_s":46.539997,"speaker":null,"role":"clinician","text":"some way. Right, okay. How long has this been going on for? About six weeks. Six weeks, okay.","source":"whisper"},{"id":"t0008","start_s":47.559998,"end_s":53.899998,"speaker":null,"role":"patient","text":"And before that, have you had any hearing problem at all? I had something maybe about a year ago,","source":"whisper"},{"id":"t0009","start_s":53.899998,"end_s":57.64,"speaker":null,"role":"patient","text":"but it only lasted a couple of days. It wasn't anything as long as this. Right, okay.","source":"whisper"},{"id":"t0010","start_s":57.96,"end_s":60.82,"speaker":null,"role":"clinician","text":"Okay, and in this six week period,","source":"whisper"},{"id":"t0011","start_s":60.82,"end_s":62.02,"speaker":null,"role":"clinician","text":"have you had anything else happen?","source":"whisper"},{"id":"t0012","start_s":62.02,"end_s":64.22,"speaker":null,"role":"clinician","text":"Have you had any other ear symptoms at all?","source":"whisper"},{"id":"t0013","start_s":65.72,"end_s":69.34,"speaker":null,"role":"patient","text":"I occasionally get like a ringing in my left ear,","source":"whisper"},{"id":"t0014","start_s":69.34,"end_s":72.18,"speaker":null,"role":"patient","text":"just on the one side, and there's actually been a few times","source":"whisper"},{"id":"t0015","start_s":72.18,"end_s":74.52,"speaker":null,"role":"patient","text":"when I felt kind of a bit sick or a bit dizzy as well.","source":"whisper"},{"id":"t0016","start_s":74.52,"end_s":91.47,"speaker":null,"role":"clinician","text":"Right okay and just to clarify the difficulty you got in hearing is that both ears or just the left ear Just the left ear yeah All right so your right ear is fine It seems to be yeah Okay so you had ringing difficulty hearing in your left ear and feeling slightly sick","source":"whisper"},{"id":"t0017","start_s":92.11,"end_s":96.59,"speaker":null,"role":"clinician","text":"And that's been on and off for the six weeks or is it continuous throughout that six weeks?","source":"whisper"},{"id":"t0018","start_s":97.55,"end_s":98.53,"speaker":null,"role":"patient","text":"It's kind of on and off.","source":"whisper"},{"id":"t0019","start_s":98.65,"end_s":99.91,"speaker":null,"role":"patient","text":"Like some things trigger it as well.","source":"whisper"},{"id":"t0020","start_s":100.05,"end_s":104.55,"speaker":null,"role":"patient","text":"So, for example, if I'm watching TV or listening to music or something, that will set off the ringing in the ear.","source":"whisper"},{"id":"t0021","start_s":105.15,"end_s":105.87,"speaker":null,"role":"clinician","text":"Right, okay.","source":"whisper"},{"id":"t0022","start_s":105.87,"end_s":110.25,"speaker":null,"role":"clinician","text":"Okay. And have you had any pain from the ear at all?","source":"whisper"},{"id":"t0023","start_s":111.05,"end_s":111.990005,"speaker":null,"role":"patient","text":"No, not that much.","source":"whisper"},{"id":"t0024","start_s":112.21,"end_s":114.09,"speaker":null,"role":"clinician","text":"Okay. Any discharge coming out of the ear?","source":"whisper"},{"id":"t0025","start_s":114.69,"end_s":114.91,"speaker":null,"role":"patient","text":"No.","source":"whisper"},{"id":"t0026","start_s":115.43,"end_s":118.53,"speaker":null,"role":"clinician","text":"Okay. Have you been experiencing any fever?","source":"whisper"},{"id":"t0027","start_s":120.07,"end_s":122.89,"speaker":null,"role":"patient","text":"Not specifically, apart from the dizziness and sickness I mentioned.","source":"whisper"},{"id":"t0028","start_s":123.57,"end_s":126.75,"speaker":null,"role":"clinician","text":"Right, okay. And has your ear been itchy at all?","source":"whisper"},{"id":"t0029","start_s":127.55,"end_s":127.75,"speaker":null,"role":"patient","text":"No.","source":"whisper"},{"id":"t0030","start_s":128.31,"end_s":132.81,"speaker":null,"role":"clinician","text":"Okay. Now, do you use cotton wool buds to try and clean out wax from your ears?","source":"whisper"},{"id":"t0031","start_s":133.61,"end_s":134.51,"speaker":null,"role":"patient","text":"No, I don't.","source":"whisper"},{"id":"t0032","start_s":134.51,"end_s":139.53,"speaker":null,"role":"clinician","text":"No, okay. Well, you're right. You should be shouldn't be doing that doesn't clean that away pushes it back in. All right","source":"whisper"},{"id":"t0033","start_s":139.53,"end_s":143.65,"speaker":null,"role":"clinician","text":"Um, the first thing that we need to do is we need to get someone to have a look inside your ear","source":"whisper"},{"id":"t0034","start_s":143.65,"end_s":147.37,"speaker":null,"role":"clinician","text":"Okay, and just exclude the simple things simple things might be wax","source":"whisper"},{"id":"t0035","start_s":147.53,"end_s":153.67,"speaker":null,"role":"clinician","text":"You know someone might have impacted wax blocking the tube going into the ear drum which can lead to muffled hearing","source":"whisper"},{"id":"t0036","start_s":154.63,"end_s":157.41,"speaker":null,"role":"clinician","text":"If that's the case that that's something that's easily fixable","source":"whisper"},{"id":"t0037","start_s":157.54999,"end_s":174.6,"speaker":null,"role":"clinician","text":"But so we need to exclude that first and then after that we can consider other potential possibilities For that we need to have a look inside the eardrum So what I think we could do is maybe if we book you in for a face appointment in one of our clinics","source":"whisper"},{"id":"t0038","start_s":174.88,"end_s":178.96,"speaker":null,"role":"clinician","text":"it's not an emergency, it can be done within the next four or five days or so, okay?","source":"whisper"},{"id":"t0039","start_s":179.14,"end_s":182.62,"speaker":null,"role":"clinician","text":"And then what I'll do is I'll send a message to our admin team,","source":"whisper"},{"id":"t0040","start_s":183.02,"end_s":186.22,"speaker":null,"role":"clinician","text":"I'll ask them to slot you in a clinic, one of our clinics in that time frame.","source":"whisper"},{"id":"t0041","start_s":186.22,"end_s":191.22,"speaker":null,"role":"clinician","text":"you can come in and one of the GPs just have a quick look down the ear and figure out whether","source":"whisper"},{"id":"t0042","start_s":191.22,"end_s":195.8,"speaker":null,"role":"clinician","text":"there's a physical blockage or whether there's something else going on. Can I just double check","source":"whisper"},{"id":"t0043","start_s":195.8,"end_s":203.44,"speaker":null,"role":"patient","text":"the dizziness that you've been getting how severe is it? Nothing major it's just kind of","source":"whisper"},{"id":"t0044","start_s":203.44,"end_s":209.26001,"speaker":null,"role":"patient","text":"it's not the kind of dizziness you get with nausea like not proper room spinning or anything","source":"whisper"},{"id":"t0045","start_s":209.26001,"end_s":215.34,"speaker":null,"role":"clinician","text":"like that but just just a little bit kind of off balance. Right okay have you any chest pain with","source":"whisper"},{"id":"t0046","start_s":215.34,"end_s":216.34,"speaker":null,"role":"patient","text":"No.","source":"whisper"},{"id":"t0047","start_s":216.34,"end_s":218.34,"speaker":null,"role":"clinician","text":"No, any palpitations, heartbeats and fast?","source":"whisper"},{"id":"t0048","start_s":218.34,"end_s":219.34,"speaker":null,"role":"patient","text":"Not that much.","source":"whisper"},{"id":"t0049","start_s":219.34,"end_s":220.34,"speaker":null,"role":"clinician","text":"Okay, fine, alright.","source":"whisper"},{"id":"t0050","start_s":220.34,"end_s":225.34,"speaker":null,"role":"clinician","text":"So let's get your ear checked out, I think that would be the most sensible thing to do,","source":"whisper"},{"id":"t0051","start_s":225.34,"end_s":228.34,"speaker":null,"role":"clinician","text":"and then after that we'll be a step closer to figuring out which way we're going to go.","source":"whisper"},{"id":"t0052","start_s":228.34,"end_s":232.34,"speaker":null,"role":"clinician","text":"It might be that there's a problem inside the drum or the balance system within the","source":"whisper"},{"id":"t0053","start_s":232.34,"end_s":237.34,"speaker":null,"role":"clinician","text":"ear, but we just need to exclude whether there's a physical blockage first and try and deal","source":"whisper"},{"id":"t0054","start_s":237.34,"end_s":239.34,"speaker":null,"role":"clinician","text":"with that if that's the case, okay?","source":"whisper"},{"id":"t0055","start_s":239.34,"end_s":252.93,"speaker":null,"role":"patient","text":"Is that the sort of thing that can cause this ringing I got in my ear The ringing that you got is something called tinnitus And tinnitus is something actually that medicine","source":"whisper"},{"id":"t0056","start_s":253.23,"end_s":254.98999,"speaker":null,"role":"clinician","text":"doctors, we don't really understand it fully.","source":"whisper"},{"id":"t0057","start_s":255.76999,"end_s":256.16998,"speaker":null,"role":"clinician","text":"We haven't,","source":"whisper"},{"id":"t0058","start_s":257.43,"end_s":259.44998,"speaker":null,"role":"clinician","text":"people can't give you a specific cause","source":"whisper"},{"id":"t0059","start_s":259.44998,"end_s":261.35,"speaker":null,"role":"clinician","text":"for why some patients get tinnitus and some","source":"whisper"},{"id":"t0060","start_s":261.35,"end_s":263.47,"speaker":null,"role":"clinician","text":"patients don't. It can be triggered by a wide","source":"whisper"},{"id":"t0061","start_s":263.47,"end_s":265.43,"speaker":null,"role":"clinician","text":"range of different things. And in fact, I'm glad that","source":"whisper"},{"id":"t0062","start_s":265.43,"end_s":267.41,"speaker":null,"role":"clinician","text":"you mentioned that. What I might do","source":"whisper"},{"id":"t0063","start_s":267.41,"end_s":269.44998,"speaker":null,"role":"clinician","text":"in the time between now and when you come","source":"whisper"},{"id":"t0064","start_s":269.44998,"end_s":271.05,"speaker":null,"role":"clinician","text":"for the appointment, I'm going to","source":"whisper"},{"id":"t0065","start_s":271.05,"end_s":277.53,"speaker":null,"role":"clinician","text":"paste the link for a leaflet about tinnitus in the notes for this appointment. I'd really","source":"whisper"},{"id":"t0066","start_s":277.53,"end_s":283.78998,"speaker":null,"role":"clinician","text":"appreciate it if you could start reading about it. And often that awareness of what it is and","source":"whisper"},{"id":"t0067","start_s":283.78998,"end_s":288.16998,"speaker":null,"role":"clinician","text":"what the treatment options are, and there are limited options, that helps us in terms of","source":"whisper"},{"id":"t0068","start_s":288.16998,"end_s":292.72998,"speaker":null,"role":"clinician","text":"conversation about what we do next, if it is clear. So I'm going to paste a link to that,","source":"whisper"},{"id":"t0069","start_s":292.91,"end_s":297.07,"speaker":null,"role":"clinician","text":"and you can read about that. And what we'll do is we'll see you in about four or five days time.","source":"whisper"},{"id":"t0070","start_s":297.11,"end_s":300.94998,"speaker":null,"role":"clinician","text":"It won't be with me, it'll be another GP, but they'll have my notes and they'll know exactly","source":"whisper"},{"id":"t0071","start_s":300.94998,"end_s":305.63,"speaker":null,"role":"patient rsion to open","indication":"acute calculous cholecystitis","anesthesia_type":"general endotracheal","allergies":["penicillin (rash)","shellfish"],"home_medications":["lisinopril 10 mg daily","atorvastatin 40 mg nightly","aspirin 81 mg daily"],"problem_list":["hypertension","hyperlipidaemia","cholelithiasis","type 2 diabetes"],"sources":{"patient_descriptor":"ehr","indication":"ehr","planned_procedure":"ehr","anesthesia_type":"ehr","allergies":"ehr","home_medications":"ehr","problem_list":"ehr"},"evidence_turn_ids":[]},"turns":[{"id":"t0001","start_s":12.0,"end_s":18.0,"speaker":"CIRCULATOR","role":"circulating_nurse","text":"Room's ready. Patient is a 54-year-old for laparoscopic cholecystectomy, acute cholecystitis.","source":"srt"},{"id":"t0002","start_s":65.0,"end_s":74.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Pre-oxygenating now. Plan is general endotracheal, propofol and rocuronium for induction.","source":"srt"},{"id":"t0003","start_s":220.0,"end_s":226.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Induction complete, tube's in, good bilateral breath sounds. Second IV placed in the left forearm.","source":"srt"},{"id":"t0004","start_s":330.0,"end_s":352.0,"speaker":"SURGEON","role":"surgeon","text":"Let's do our time out. Confirming patient, laparoscopic cholecystectomy, possible conversion to open, consent signed, antibiotics given?","source":"srt"},{"id":"t0005","start_s":352.0,"end_s":357.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Cefazolin two grams IV went in about ten minutes ago.","source":"srt"},{"id":"t0006","start_s":370.0,"end_s":374.0,"speaker":"SURGEON","role":"surgeon","text":"Great. Everyone agree? Time out complete.","source":"srt"},{"id":"t0007","start_s":500.0,"end_s":507.0,"speaker":"SURGEON","role":"surgeon","text":"Prepped and draped. Making the infraumbilical incision now for the Veress needle.","source":"srt"},{"id":"t0008","start_s":555.0,"end_s":560.0,"speaker":"SURGEON","role":"surgeon","text":"Insufflating. Pressures look good, fifteen millimeters of mercury. Placing the ports.","source":"srt"},{"id":"t0009","start_s":720.0,"end_s":730.0,"speaker":"SURGEON","role":"surgeon","text":"Camera's in. There's a lot of inflammation around the gallbladder, omentum is stuck to it. Adhesions are dense.","source":"srt"},{"id":"t0010","start_s":930.0,"end_s":938.0,"speaker":"SURGEON","role":"surgeon","text":"Taking down the adhesions. The tissue planes are really hard to see here.","source":"srt"},{"id":"t0011","start_s":1185.0,"end_s":1195.0,"speaker":"SURGEON","role":"surgeon","text":"I'm having trouble getting a critical view of safety. The anatomy at the triangle is completely obscured.","source":"srt"},{"id":"t0012","start_s":1330.0,"end_s":1339.0,"speaker":"SURGEON","role":"surgeon","text":"There's bleeding from the liver bed, more than I'd like. Suction please. Estimate maybe 150 mils so far.","source":"srt"},{"id":"t0013","start_s":1440.0,"end_s":1452.0,"speaker":"SURGEON","role":"surgeon","text":"I'm not comfortable continuing laparoscopically. We're going to convert to open. Let's get the open tray.","source":"srt"},{"id":"t0014","start_s":1470.0,"end_s":1475.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Copy, converting to open. Patient's stable, heart rate 88, pressure 120 over 70.","source":"srt"},{"id":"t0015","start_s":1620.0,"end_s":1628.0,"speaker":"SURGEON","role":"surgeon","text":"Making a right subcostal incision. Extending it now.","source":"srt"},{"id":"t0016","start_s":1935.0,"end_s":1945.0,"speaker":"SURGEON","role":"surgeon","text":"Better exposure now. I can see the cystic duct and artery clearly. Getting my critical view.","source":"srt"},{"id":"t0017","start_s":2200.0,"end_s":2208.0,"speaker":"SURGEON","role":"surgeon","text":"Clipping the cystic artery. And the cystic duct, two clips proximal, one distal. Dividing.","source":"srt"},{"id":"t0018","start_s":2340.0,"end_s":2347.0,"speaker":"SURGEON","role":"surgeon","text":"Taking the gallbladder off the liver bed with the cautery.","source":"srt"},{"id":"t0019","start_s":2480.0,"end_s":2488.0,"speaker":"SURGEON","role":"surgeon","text":"Gallbladder is out. It's going to pathology. Send it as gallbladder, acute cholecystitis.","source":"srt"},{"id":"t0020","start_s":2550.0,"end_s":2560.0,"speaker":"SURGEON","role":"surgeon","text":"More oozing from the liver bed. Let's put some hemostatic agent on it and pack it for a few minutes.","source":"srt"},{"id":"t0021","start_s":2760.0,"end_s":2769.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Blood pressure dipped to 92 over 55. Giving a fluid bolus. Heart rate's up to 104.","source":"srt"},{"id":"t0022","start_s":2910.0,"end_s":2920.0,"speaker":"SURGEON","role":"surgeon","text":"Bleeding's controlled now. Total blood loss I'd estimate around 400 mils.","source":"srt"},{"id":"t0023","start_s":2950.0,"end_s":2958.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Pressure came back up to 118 over 68 after the liter of crystalloid. No transfusion needed.","source":"srt"},{"id":"t0024","start_s":3120.0,"end_s":3128.0,"speaker":"SURGEON","role":"surgeon","text":"Placing a Jackson-Pratt drain in the gallbladder fossa, bringing it out the lateral port site.","source":"srt"},{"id":"t0025","start_s":3345.0,"end_s":3353.0,"speaker":"CIRCULATOR","role":"circulating_nurse","text":"Instrument, sponge, and needle counts are correct times two.","source":"srt"},{"id":"t0026","start_s":3390.0,"end_s":3397.0,"speaker":"SURGEON","role":"surgeon","text":"Closing the fascia with looped PDS. Skin with staples.","source":"srt"},{"id":"t0027","start_s":3720.0,"end_s":3730.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Reversing paralysis. Patient breathing spontaneously, extubated, moving all four extremities.","source":"srt"},{"id":"t0028","start_s":3870.0,"end_s":3882.0,"speaker":"SURGEON","role":"surgeon","text":"For handoff: converted lap chole to open, difficult anatomy, EBL 400, one JP drain in the fossa. No transfusion.","source":"srt"},{"id":"t0029","start_s":3900.0,"end_s":3912.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"He'll go to the PACU first, then I want him admitted overnight for pain control and to watch the drain output.","source":"srt"},{"id":"t0030","start_s":3930.0,"end_s":3938.0,"speaker":"SURGEON","role":"surgeon","text":"Agree, floor admission after PACU. I'll update the family now.","source":"srt"}],"events":[{"id":"e000","t_start_s":12.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"sign_in"},"evidence_turn_ids":["t0001"],"by_role":"circulating_nurse","confidence":0.95,"extractor":"llm"},{"id":"e001","t_start_s":65.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"induction"},"evidence_turn_ids":["t0002","t0003"],"by_role":"anesthesia","confidence":0.95,"extractor":"llm"},{"id":"e002","t_start_s":65.0,"t_end_s":null,"type":"medication_given","payload":{"name":"propofol","route":"IV"},"evidence_turn_ids":["t0002"],"by_role":"anesthesia","confidence":0.9,"extractor":"llm"},{"id":"e003","t_start_s":65.0,"t_end_s":null,"type":"medication_given","payload":{"name":"rocuronium","route":"IV"},"evidence_turn_ids":["t0002"],"by_role":"anesthesia","confidence":0.9,"extractor":"llm"},{"id":"e004","t_start_s":220.0,"t_end_s":null,"type":"line_placed","payload":{"type":"IV","site":"left forearm"},"evidence_turn_ids":["t0003"],"by_role":"anesthesia","confidence":0.95,"extractor":"llm"},{"id":"e005","t_start_s":330.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"time_out"},"evidence_turn_ids":["t0004"],"by_role":"surgeon","confidence":0.95,"extractor":"llm"},{"id":"e006","t_start_s":352.0,"t_end_s":null,"type":"medication_given","payload":{"name":"Cefazolin","dose":"2 grams","route":"IV"},"evidence_turn_ids":["t0005"],"by_role":"anesthesia","confidence":0.95,"extractor":"llm"},{"id":"e007","t_start_s":500.0,"t_end_s":null,"type":"incision","payload":{"site":"infraumbilical"},"evidence_turn_ids":["t0007"],"by_role":"surge ed; converted to open via right subcostal incision due to difficult anatomy and bleeding; cholecystectomy performed; hemostasis achieved; Jackson-Pratt drain placed in gallbladder fossa; fascia and skin closed\nImplants / prostheses: none documented\nEstimated blood loss: 400 ml\nSpecimens sent: Gallbladder (acute cholecystitis)\nComplications: Dense adhesions and inflammation obscuring anatomy; converted to open due to inability to obtain critical view of safety and bleeding from liver bed; oozing from liver bed (resolved); hypotension (92/55) and tachycardia (HR 104)\nSwab and instrument count: Correct\nPost-operative instructions: Admit to floor overnight for pain control and to monitor drain output\nDisposal: not documented\nBrief narrative: The patient underwent a laparoscopic cholecystectomy for acute calculous cholecystitis, but dense adhesions and inflammation prevented obtaining a critical view of safety. The procedure was converted to an open cholecystectomy via a right subcostal incision due to persistent bleeding from the liver bed. The gallbladder was removed and sent for pathology, and a Jackson-Pratt drain was placed in the gallbladder fossa. Intraoperative hypotension and tachycardia were managed with a 1-liter crystalloid bolus. The patient was extubated in the theatre and transferred to recovery, with a plan for overnight admission to the floor.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your family member had surgery to remove his gallbladder. There was a difficulty during the procedure that the team managed. He is now in the recovery area. The medical team is watching him closely to make sure he is comfortable. He will stay in the hospital overnight for further care. The surgeon will come and speak with you as soon as they can.","unsupported_claims":[],"revised":false,"accepted":false}},"links":{"handoff":[{"start":37,"end":46,"field":"converted","label":"conversion: laparoscopic -> open","event_id ull,"role":null,"text":"I have to try.","source":"srt"},{"id":"t0006","start_s":72.08,"end_s":75.5,"speaker":null,"role":null,"text":"Right.","source":"srt"},{"id":"t0007","start_s":75.5,"end_s":82.86,"speaker":null,"role":null,"text":"That's fine.","source":"srt"},{"id":"t0008","start_s":82.86,"end_s":84.86,"speaker":null,"role":null,"text":"It's already starting, yes, please.","source":"srt"},{"id":"t0009","start_s":106.86,"end_s":107.86,"speaker":null,"role":null,"text":"Yes.","source":"srt"},{"id":"t0010","start_s":142.86,"end_s":146.34,"speaker":null,"role":null,"text":"Well, we're gonna have to deal peek-a-boo.","source":"srt"},{"id":"t0011","start_s":150.46,"end_s":152.62,"speaker":null,"role":null,"text":"Oh, shit.","source":"srt"},{"id":"t0012","start_s":154.78,"end_s":157.18,"speaker":null,"role":null,"text":"We're gonna have an error message.","source":"srt"},{"id":"t0013","start_s":157.3,"end_s":159.46,"speaker":null,"role":null,"text":"Here's the robot.","source":"srt"},{"id":"t0014","start_s":159.58,"end_s":162.02,"speaker":null,"role":null,"text":"\u2013Caught something? \u2013Yes.","source":"srt"},{"id":"t0015","start_s":162.14,"end_s":164.54,"speaker":null,"role":null,"text":"A camera connection error earlier.","source":"srt"},{"id":"t0016","start_s":166.94,"end_s":169.58,"speaker":null,"role":null,"text":"What do we do? Either...","source":"srt"},{"id":"t0017","start_s":169.58,"end_s":192.22,"speaker":null,"role":null,"text":"That means we're going to clean some cables.","source":"srt"},{"id":"t0018","start_s":192.22,"end_s":197.22,"speaker":null,"role":null,"text":"I don't know where the cables are.","source":"srt"},{"id":"t0019","start_s":312.22,"end_s":319.22,"speaker":null,"role":null,"text":"David, are we going to do CR?","source":"srt"},{"id":"t0020","start_s":319.22,"end_s":321.22,"speaker":null,"role":null,"text":"Yes, we are doing CR.","source":"srt"},{"id":"t0021","start_s":321.22,"end_s":323.22,"speaker":null,"role":null,"text":"Then we don't need the saw blade, right?","source":"srt"},{"id":"t0022","start_s":323.22,"end_s":324.22,"speaker":null,"role":null,"text":"No.","source":"srt"},{"id":"t0023","start_s":328.22,"end_s":330.22,"speaker":null,"role":null,"text":"The problem has been solved.","source":"srt"},{"id":"t0024","start_s":330.22,"end_s":331.22,"speaker":null,"role":null,"text":"Does it fit?","source":"srt"},{"id":"t0025","start_s":331.22,"end_s":334.22,"speaker":null,"role":null,"text":"At least we hope so.","source":"srt"},{"id":"t0026","start_s":372.22,"end_s":374.22,"speaker":null,"role":null,"text":"Finally, end of the day.","source":"srt"},{"id":"t0027","start_s":385.22,"end_s":388.22,"speaker":null,"role":null,"text":"David, we could do a short finish.","source":"srt"},{"id":"t0028","start_s":389.22,"end_s":391.22,"speaker":null,"role":null,"text":"A short underbar.","source":"srt"},{"id":"t0029","start_s":391.22,"end_s":393.22,"speaker":null,"role":null,"text":"That's a good idea.","source":"srt"},{"id":"t0030","start_s":394.22,"end_s":397.22,"speaker":null,"role":null,"text":"We'll take the shorter one.","source":"srt"},{"id":"t0031","start_s":398.22,"end_s":400.22,"speaker":null,"role":null,"text":"Does it matter?","source":"srt"},{"id":"t0032","start_s":400.22,"end_s":404.82,"speaker":null,"role":null,"text":"It doesn't matter, because we still have to think about it.","source":"srt"},{"id":"t0033","start_s":404.82,"end_s":407.94,"speaker":null,"role":null,"text":"So actually, there's only a small head left for the right things.","source":"srt"},{"id":"t0034","start_s":407.94,"end_s":410.26,"speaker":null,"role":null,"text":"It doesn't matter, but we can take the shorter ones.","source":"srt"},{"id":"t0035","start_s":410.26,"end_s":412.26,"speaker":null,"role":null,"text":"We don't have to put them in that far.","source":"srt"},{"id":"t0036","start_s":413.7,"end_s":415.98,"speaker":null,"role":null,"text":"Just put the longer ones to the side, right?","source":"srt"},{"id":"t0037","start_s":415.98,"end_s":416.98,"speaker":null,"role":null,"text":"Okay.","source":"srt"},{"id":"t0038","start_s":418.82,"end_s":419.9,"speaker":null,"role":null,"text":"But that's nothing.","source":"srt"},{"id":"t0039","start_s":419.9,"end_s":424.38,"speaker":null,"role":null,"text":"Just make sure that we don't mix them up, that we give them back.","source":"srt"},{"id":"t0040","start_s":424.38,"end_s":426.38,"speaker":null,"role":null,"text":"That's the only thing, right?","source":"srt"},{"id":"t0041","start_s":426.38,"end_s":431.38,"speaker":null,"role":null,"text":"This is a Mako module for the hip.","source":"srt"},{"id":"t0042","start_s":431.38,"end_s":434.38,"speaker":null,"role":null,"text":"Mainly for the pan and shaft,","source":"srt"},{"id":"t0043","start_s":434.38,"end_s":437.38,"speaker":null,"role":null,"text":"you operate manually.","source":"srt"},{"id":"t0044","start_s":442.38,"end_s":445.38,"speaker":null,"role":null,"text":"I think the hip is a nice gimmick.","source":"srt"},{"id":"t0045","start_s":445.38,"end_s":448.38,"speaker":null,"role":null,"text":"You can pull it over.","source":"srt"},{"id":"t0046","start_s":448.38,"end_s":452.38,"speaker":null,"role":null,"text":"Especially when you operate in the back position,","source":"srt"},{"id":"t0047","start_s":452.38,"end_s":458.38,"speaker":null,"role":null,"text":"The Nogla for example does backrests and with robots.","source":"srt"},{"id":"t0048","start_s":458.38,"end_s":466.38,"speaker":null,"role":null,"text":"I think you can give yourself a present because I can place the implants almost as well without robots.","source":"srt"},{"id":"t0049","start_s":466.38,"end_s":469.38,"speaker":null,"role":null,"text":"Once in the upper middle, then I have the whole thing in the middle.","source":"srt"},{"id":"t0050","start_s":469.38,"end_s":471.38,"speaker":null,"role":null,"text":"No, it starts in the middle, straight.","source":"srt"},{"id":"t0051","start_s":471.38,"end_s":475.38,"speaker":null,"role":null,"text":"Then I also have a very high...","source":"srt"},{"id":"t0052","start_s":475.38,"end_s":479.38,"speaker":null,"role":null,"text":"Exactly, you have to adjust it so that the incisions are not too wide.","source":"srt"},{"id":"t0053","start_s":479.38,"end_s":483.38,"speaker":null,"role":null,"text":"The knee is also a bit more important than the knee.","source":"srt"},{"id":"t0054","start_s":483.38,"end_s":487.38,"speaker":null,"role":null,"text":"They take it with very thick legs.","source":"srt"},{"id":"t0055","start_s":487.38,"end_s":490.38,"speaker":null,"role":null,"text":"They operate more in the side position.","source":"srt"},{"id":"t0056","start_s":490.38,"end_s":493.38,"speaker":null,"role":null,"text":"And it's a bit more difficult, especially when they are so thick,","source":"srt"},{"id":"t0057","start_s":493.38,"end_s":497.38,"speaker":null,"role":null,"text":"to get the panning position right.","source":"srt"},{"id":"t0058","start_s":497.38,"end_s":501.38,"speaker":null,"role":null,"text":"And that's where it helps most.","source":"srt"},{"id":"t0059","start_s":501.38,"end_s":505.38,"speaker":null,"role":null,"text":"But it doesn't work quite as well as on the knee.","source":"srt"},{"id":"t0060","start_s":505.38,"end_s":508.38,"speaker":null,"role":null,"text":"You have to work on the accuracy.","source":"srt"},{"id":"t0061","start_s":509.38,"end_s":524.38,"speaker":null,"role":null,"text":"The first robot was originally for the hip, the RoboDoc, which then fell into disrepute.","source":"srt"},{"id":"t0062","start_s":524.38,"end_s":532.38,"speaker":null,"role":null,"text":"We made the access, then we pushed the button and then he milled the shaft.","source":"srt"},{"id":"t0063","start_s":532.38,"end_s":538.38,"speaker":null,"role":null,"text":"But of course he didn't take into account whether he was hanging somewhere in the software.","source":"srt"},{"id":"t0064","start_s":538.38,"end_s":542.38,"speaker":null,"role":null,"text":"And then he milled away a lot of softwares, partly.","source":"srt"},{"id":"t0065","start_s":542.38,"end_s":551.38,"speaker":null,"role":null,"text":"And on that basis, a knee variant was developed by the company.","source":"srt"},{"id":"t0066","start_s":551.38,"end_s":553.38,"speaker":null,"role":null,"text":"It was sold 5 times.","source":"srt"},{"id":"t0067","start_s":553.38,"end_s":555.38,"speaker":null,"role":null,"text":"But you can still buy it later.","source":"srt"},{"id":"t0068","start_s":555.38,"end_s":557.38,"speaker":null,"role":null,"text":"The technique is of course a bit more developed.","source":"srt"},{"id":"t0069","start_s":557.38,"end_s":561.38,"speaker":null,"role":null,"text":"But it is mainly used in Asia, in South Korea.","source":"srt"},{"id":"t0070","start_s":561.38,"end_s":567.38,"speaker":null,"role":null,"text":"There are some European brands, but no one is involved anymore.","source":"srt"},{"id":"t0071","start_s":569.38,"end_s":577.38,"speaker":null,"role":null,"text":"Because of course on the European market, the big American companies are trying to place their products.","source":"srt"},{"id":"t0072","start_s":577.38,"end_s":579.38,"speaker":null,"role":null,"text":"...or whatever they are called.","source":"srt"},{"id":"t0073","start_s":579.38,"end_s":581.38,"speaker":null,"role":null,"text":"And now, the drycat room...","source":"srt"},{"id":"t0074","start_s":582.38,"end_s":585.38,"speaker":null,"role":null,"text":"The robot should finally come.","source":"srt"},{"id":"t0075","start_s":590.38,"end_s":591.38,"speaker":null,"role":null,"text":"The Pew.","source":"srt"},{"id":"t0076","start_s":591.38,"end_s":593.38,"speaker":null,"role":null,"text":"That's the Pew.","source":"srt"},{"id":"t0077","start_s":593.38,"end_s":595.38,"speaker":null,"role":null,"text":"Written by the Pui.","source":"srt"},{"id":"t0078","start_s":599.38,"end_s":600.38,"speaker":null,"role":null,"text":"Who?","source":"srt"},{"id":"t0079","start_s":603.38,"end_s":604.38,"speaker":null,"role":null,"text":"No.","source":"srt"},{"id":"t0080","start_s":607.38,"end_s":609.38,"speaker":null,"role":null,"text":"Yes.","source":"srt"},{"id":"t0081","start_s":609.38,"end_s":611.38,"speaker":null,"role":null,"text":"That's fine.","source":"srt"},{"id":"t0082","start_s":622.38,"end_s":627.38,"speaker":null,"role":null,"text":"We have to distinguish a bit between this and a DaVinci.","source":"srt"},{"id":"t0083","start_s":627.38,"end_s":631.38,"speaker":null,"role":null,"text":"On the one hand, this is a bit of remote operating.","source":"srt"},{"id":"t0084","start_s":631.38,"end_s":633.38,"speaker":null,"role":null,"text":"We said size 4, right?","source":"srt"},{"id":"t0085","start_s":633.38,"end_s":638.38,"speaker":null,"role":null,"text":"...that the operator sits in one place and in the other...","source":"srt"},{"id":"t0086","start_s":638.38,"end_s":643.38,"speaker":null,"role":null,"text":"...that you can make the three circles smaller.","source":"srt"},{"id":"t0087","start_s":643.38,"end_s":645.38,"speaker":null,"role":null,"text":"But that works.","source":"srt"},{"id":"t0088","start_s":645.38,"end_s":648.38,"speaker":null,"role":null,"text":"That's a bit of a different principle.","source":"srt"},{"id":"t0089","start_s":648.38,"end_s":649.38,"speaker":null,"role":null,"text":"But it works.","source":"srt"},{"id":"t0090","start_s":649.38,"end_s":652.38,"speaker":null,"role":null,"text":"We cut exactly the same way.","source":"srt"},{"id":"t0091","start_s":652.38,"end_s":654.38,"speaker":null,"role":null,"text":"We have the best solution for the patient.","source":"srt"},{"id":"t0092","start_s":654.38,"end_s":660.38,"speaker":null,"role":null,"text":"And it's less about sitting somewhere on the laptop and operating with it.","source":"srt"},{"id":"t0093","start_s":660.38,"end_s":666.38,"speaker":null,"role":null,"text":"We are talking about precision, angle and implant position.","source":"srt"},{"id":"t0094","start_s":66
