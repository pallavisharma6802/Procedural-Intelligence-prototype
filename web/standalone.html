<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const clock = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), ss=s%60, h=Math.floor(m/60);
  return h ? `${h}:${String(m%60).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; };
const ROLE = {
  surgeon:{label:'Surgeon',c:'var(--r-surgeon)'}, anesthesia:{label:'Anesthesia',c:'var(--r-anesthesia)'},
  circulating_nurse:{label:'Nurse',c:'var(--r-nurse)'}, scrub_nurse:{label:'Scrub',c:'var(--r-scrub)'},
  assistant:{label:'Assistant',c:'var(--r-surgeon)'}, perfusionist:{label:'Perfusion',c:'var(--r-other)'},
  other:{label:'',c:'var(--r-other)'},
};
const roleOf = t => ROLE[t.role] || ROLE.other;
const KIND = { phase_transition:'phase', medication_given:'medication', incision:'incision', conversion:'conversion', implant_placed:'implant', line_placed:'line', drain_placed:'drain', device_step:'step', blood_loss:'blood loss', hemodynamic_event:'hemodynamics', transfusion:'transfusion', count_status:'count', specimen:'specimen', complication:'complication', equipment_issue:'equipment', personnel_change:'personnel', disposition:'disposition' };
const EVROLE = { phase_transition:'circulating_nurse', medication_given:'anesthesia', hemodynamic_event:'anesthesia', transfusion:'anesthesia', count_status:'circulating_nurse', incision:'surgeon', conversion:'surgeon', implant_placed:'surgeon', drain_placed:'surgeon', specimen:'surgeon', complication:'surgeon', disposition:'surgeon' };
const TITLE = { case01_lapchole:'Lap chole → open', case01_uk:'Lap chole → open (NHS)', case03_trauma_exlap:'Trauma laparotomy', case04_cath_pci:'Coronary PCI', case02_tka_uneventful:'Routine knee replacement', mmor_007_TKA:'MM-OR robotic knee', mmor_007_audio:'MM-OR knee (audio)' };

const PI = { cases:{}, id:null, D:null, dur:1, playT:1e9, tab:'timeline', hotEv:new Set(), hotTurn:new Set(), playing:false, raf:0, audio:null, live:false };

/* ---------- boot ---------- */
async function boot(){
  let bundle={}; try{ bundle=JSON.parse($('#bundle').textContent)||{}; }catch(e){}
  let live=[]; try{ const r=await fetch('/api/cases'); if(r.ok) live=await r.json(); }catch(e){}
  PI.live = live.length>0;
  const sel=$('#caseSel');
  let ids;
  if (PI.live){ live.forEach(c=>{ PI.cases[c.case_id]=null; sel.append(new Option(label(c.case_id,c.source),c.case_id)); }); ids=live.map(c=>c.case_id); }
  else { PI.cases=bundle; ids=Object.keys(bundle); ids.forEach(id=>sel.append(new Option(label(id,bundle[id].source),id))); }
  if (!ids.length){ $('#loading').textContent='no cases'; return; }
  ['default_or','uk_or','cath_lab','mmor_robotic'].forEach(p=>$('#profSel').append(new Option(p.replace(/_/g,' '),p)));
  sel.onchange=()=>load(sel.value);
  $('#profSel').onchange=()=>{ const p=$('#profSel').value; if(p===PI.D.profile.id)return; PI.live?reprofile(p):(($('#profSel').value=PI.D.profile.id), tip('profile switching needs the local server')); };
  wire();
  await load(ids[0]);
  $('#loading').hidden=true; $('#app').hidden=false;
  requestAnimationFrame(()=>$('#app').classList.add('in'));
}
const isAudio = src => /audio|\.mp3|\.m4a|\.wav/i.test(src||'');
function label(id,src){ const nm=TITLE[id]||id; return isAudio(src) ? nm+'  ·  audio' : nm; }

async function load(id){
  let D=PI.cases[id];
  if (!D){ try{ const r=await fetch('/api/cases/'+id); D=r.ok?await r.json():null; }catch(e){ D=null; } if(D&&D.events) PI.cases[id]=D; }
  if (!D||!D.events){ tip('could not load '+id); return; }
  PI.id=id; PI.D=D;
  PI.dur=Math.max(1,...D.events.map(e=>e.t_start_s),...D.turns.map(t=>t.end_s))+15;
  PI.playT=1e9; PI.tab='timeline'; PI.hotEv.clear(); PI.hotTurn.clear();
  $('#caseSel').value=id; $('#profSel').value=D.profile.id;
  setupAudio(D);
  renderPatient(); renderTurns(); renderTabs(); renderTab(); syncScrub();
}

/* ---------- patient strip ---------- */
function renderPatient(){
  const c=PI.D.context||{}, host=$('#patient');
  host.innerHTML='';
  const add=(html)=>{ if(host.children.length) host.append(el('span','sep')); const s=el('span'); s.innerHTML=html; host.append(s); };
  if (c.patient_descriptor) add('<b>'+esc(c.patient_descriptor)+'</b>');
  if (c.planned_procedure) add(esc(c.planned_procedure));
  if (c.indication) add(esc(c.indication));
  if (!host.children.length){ host.hidden=true; return; }
  if (Object.values(c.sources||{}).includes('ehr')) host.append(el('span','tag','from records'));
  if ((c.allergies||[]).length){ const w=el('span','warn'); w.textContent='allergy: '+c.allergies.join(', '); host.append(w); }
  host.hidden=false;
}
function esc(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ---------- transcript ---------- */
function renderTurns(){
  const box=$('#turns'); box.innerHTML='';
  $('#turnCount').textContent=PI.D.turns.length+' lines';
  PI.D.turns.forEach(t=>{
    const row=el('div','turn'); row.dataset.id=t.id;
    const rl=roleOf(t); row.style.setProperty('--rc', rl.c);
    row.append(el('div','t tnum',clock(t.start_s)));
    const body=el('div');
    if (rl.label) body.append(el('span','who',rl.label+'  '));
    const tx=el('span','tx'+(/\?\s*$/.test(t.text)?' q':''),t.text);
    body.append(tx);
    row.append(body);
    row.onmouseenter=()=>traceFromTurn(t.id);
    row.onmouseleave=clearTrace;
    box.append(row);
  });
  paintTrace();
}

/* ---------- tabs ---------- */
const TABS=[['timeline','Timeline'],['handoff','Handoff'],['opnote','Op note'],['family','Family']];
function renderTabs(){
  const box=$('#tabs'); box.innerHTML='';
  TABS.forEach(([k,nm])=>{
    if (k!=='timeline' && !PI.D.drafts[k]) return;
    const t=el('button','tab'); t.setAttribute('role','tab'); t.setAttribute('aria-selected',String(k===PI.tab));
    t.append(el('span',null,nm));
    if (k==='handoff') t.append(el('span','fmt',PI.D.profile.handoff_name));
    const dr=PI.D.drafts[k];
    if (dr && dr.text && !dr.text.startsWith('[')){
      const flags=(dr.unsupported_claims||[]).filter(x=>!/not generated|not fact-checked/.test(x));
      t.append(el('span','dot '+(flags.length?'flag':'ok')));
    }
    t.onclick=()=>{ PI.tab=k; renderTabs(); renderTab(); };
    box.append(t);
  });
}

function renderTab(){
  const host=$('#tabBody');
  if (PI.tab==='timeline') return renderTimeline(host);
  renderDoc(host, PI.tab);
}

/* ---------- timeline ---------- */
function stateAt(t){ let cur=(PI.D.states||[])[0]||{}; for(const s of PI.D.states||[]){ if(s.as_of_s<=t) cur=s; else break; } return cur; }
function renderTimeline(host){
  host.innerHTML='';
  const wrap=el('div','tlwrap');
  if (!PI.D.events.length){
    const e=el('div','tl-empty');
    e.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><br>'
      +'No clinical events were extracted from this recording.<br>Too short, noisy, or not clinical speech &mdash; shown as-is rather than invented.';
    wrap.append(e); host.append(wrap); return;
  }
  wrap.append(snapshot());
  const rail=el('div','rail');
  PI.D.events.slice().sort((a,b)=>a.t_start_s-b.t_start_s).forEach(e=>{
    const row=el('div','ev'); row.dataset.id=e.id;
    row.style.setProperty('--rc', (ROLE[e.by_role||EVROLE[e.type]]||ROLE.other).c);
    if (e.t_start_s>PI.playT) row.classList.add('future');
    if (PI.hotEv.has(e.id)) row.classList.add('hot');
    row.append(el('div','clk tnum',clock(e.t_start_s)));
    const txt=el('div','txt');
    txt.append(el('span','kind',KIND[e.type]||e.type));
    txt.append(document.createTextNode(' '+evText(e)));
    const who=ROLE[e.by_role]; if (who && who.label) txt.append(el('span','by',' · '+who.label.toLowerCase()));
    row.append(txt);
    row.onmouseenter=()=>traceFromEvent(e.id);
    row.onmouseleave=clearTrace;
    rail.append(row);
  });
  wrap.append(rail);
  host.append(wrap);
}
function snapshot(){
  const S=stateAt(PI.playT), d=el('div','snap');
  const sev=severity(S), sc={stable:'var(--ok)',watcher:'var(--watch)',unstable:'var(--alert)'}[sev];
  d.style.setProperty('--sev', sc);
  const chip=(t)=>`<span class="chip">${t}</span>`;
  const parts=[
    (PI.playT<PI.dur-.5 ? `<b>${clock(PI.playT)}</b>` : 'final') + ' ·',
    `<span class="sev-label">${sev}</span>`,
    `phase <b>${(S.phase||'').replace(/_/g,' ')}</b>`,
  ];
  if (S.ebl_ml!=null) parts.push(chip(`EBL ${S.ebl_ml} mL`));
  const tx=S.transfusion_totals||{}; if (Object.keys(tx).length) parts.push(chip(Object.entries(tx).map(([k,v])=>`${v} ${k}`).join(', ')));
  if ((S.implants||[]).length) parts.push(chip('implant'));
  if ((S.drains||[]).length) parts.push(chip('drain'));
  if (S.converted) parts.push(chip('converted'));
  if (S.counts) parts.push(chip('counts ' + esc(String(S.counts).split(/[(:]/)[0].trim())));
  if (S.disposition) parts.push('→ <b>' + esc(String(S.disposition).split(/[(,]/)[0].trim()) + '</b>');
  d.innerHTML = parts.join(' ');
  return d;
}
function severity(S){
  const c=(S.complications||[]).length, o=(S.open_concerns||[]).length;
  if (S.disposition && /icu/i.test(S.disposition) && (c||o)) return 'unstable';
  if (c||o||S.converted) return 'watcher';
  return 'stable';
}
function evText(e){
  const p=e.payload||{};
  if (e.type==='phase_transition') return (p.phase||'').replace(/_/g,' ');
  if (e.type==='medication_given') return [p.name,p.dose,p.route].filter(Boolean).join(' ');
  if (e.type==='blood_loss') return 'about '+p.ebl_ml+' mL';
  if (e.type==='transfusion') return [p.units,p.product].filter(Boolean).join(' ');
  if (e.type==='conversion') return (p.from||'')+' to '+(p.to||'');
  if (e.type==='count_status') return (p.status||'')+(p.intentional?' (intentional)':'');
  if (e.type==='disposition') return [p.destination,p.detail].filter(Boolean).join(' - ');
  return Object.values(p).filter(v=>typeof v!=='object').join(' - ')||'';
}

/* ---------- document ---------- */
function renderDoc(host, kind){
  host.innerHTML='';
  const dr=PI.D.drafts[kind];
  const d=el('div','doc');
  if (!dr||!dr.text){ d.className='doc empty'; d.textContent='no draft'; host.append(d); return; }
  if (dr.text.startsWith('[')){ d.className='doc empty'; d.textContent=dr.text.replace(/^\[|\]$/g,''); host.append(d); return; }
  const flags=(dr.unsupported_claims||[]).filter(x=>!/not generated|not fact-checked/.test(x));
  if (flags.length){
    const f=el('div','flags'); f.append(el('b',null,'Not verified against the transcript'));
    const ul=el('ul'); flags.forEach(x=>ul.append(el('li',null,x))); f.append(ul); d.append(f);
  }
  if (PI.playT<PI.dur-.5){
    const n=el('div','scrubnote');
    n.textContent='This document reflects the whole case; the transcript is scrubbed back to '+clock(PI.playT)+'.';
    d.append(n);
  }
  const links=PI.D.links[kind]||[]; const text=dr.text;
  let off=0;
  for (const raw of text.split('\n')){
    const lstart=off; off+=raw.length+1;
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/^\*{0,2}([A-Z][A-Za-z0-9 ,/&()'—–-]{1,44}?)\*{0,2}:\s*(.*)$/);
    if (m && (m[2]==='' || m[1].length<46)){
      const p=el('p');
      p.append(el('span','lead',m[1].replace(/\*/g,'')));
      if (m[2]) inline(p, m[2], lstart+(raw.length-m[2].length), links);
      d.append(p); continue;
    }
    const p=el('p'); inline(p, raw, lstart, links); d.append(p);
  }
  host.append(d);
}
function inline(p, str, gOff, links){
  const clean=str.replace(/\*\*/g,'');
  const shift=i=>i-(str.slice(0,i).match(/\*\*/g)||[]).length*2;
  const local=links.map(lk=>({...lk,s:lk.start-gOff,e:lk.end-gOff})).filter(lk=>lk.s>=0&&lk.e<=str.length&&lk.e>lk.s).sort((a,b)=>a.s-b.s);
  let i=0;
  for (const lk of local){
    const s=shift(lk.s), e=shift(lk.e);
    if (s>i) p.append(document.createTextNode(clean.slice(i,s)));
    const span=el('span','lk',clean.slice(s,e)); span.title=lk.label;
    span.dataset.ev=lk.event_ids.join(','); span.dataset.tn=lk.turn_ids.join(',');
    span.onmouseenter=()=>{ PI.hotEv=new Set(lk.event_ids); PI.hotTurn=new Set(lk.turn_ids); paintTrace(true); };
    span.onmouseleave=clearTrace;
    p.append(span); i=e;
  }
  if (i<clean.length) p.append(document.createTextNode(clean.slice(i)));
}

/* ---------- trace ---------- */
function traceFromTurn(tid){
  PI.hotTurn=new Set([tid]);
  PI.hotEv=new Set(PI.D.events.filter(e=>(e.evidence_turn_ids||[]).includes(tid)).map(e=>e.id));
  paintTrace();
}
function traceFromEvent(eid){
  const e=PI.D.events.find(x=>x.id===eid);
  PI.hotEv=new Set([eid]); PI.hotTurn=new Set(e?e.evidence_turn_ids:[]);
  paintTrace(true);
}
function clearTrace(){ PI.hotEv.clear(); PI.hotTurn.clear(); paintTrace(); }
function paintTrace(scrollTurn){
  document.querySelectorAll('.turn').forEach(r=>{
    r.classList.toggle('hot',PI.hotTurn.has(r.dataset.id));
    r.classList.toggle('dim',PI.hotTurn.size>0 && !PI.hotTurn.has(r.dataset.id));
  });
  document.querySelectorAll('.ev').forEach(r=>r.classList.toggle('hot',PI.hotEv.has(r.dataset.id)));
  document.querySelectorAll('.doc .lk').forEach(s=>{
    const evs=(s.dataset.ev||'').split(',').filter(Boolean);
    s.classList.toggle('hot', evs.some(x=>PI.hotEv.has(x)));
  });
  if (scrollTurn && PI.hotTurn.size){
    const first=[...document.querySelectorAll('.turn.hot')][0];
    if (first) first.scrollIntoView({block:'center',behavior:'smooth'});
  }
}

/* ---------- transport ---------- */
function syncScrub(){
  const scrubbed = PI.playT < PI.dur-.5;
  const pct=Math.min(100,PI.playT/PI.dur*100);
  $('#scrubFill').style.width=pct+'%'; $('#scrubKnob').style.left=pct+'%';
  $('#clk').innerHTML = scrubbed ? `<b>${clock(PI.playT)}</b> / ${clock(PI.dur)}` : clock(PI.dur);
}
function seekTo(v){
  PI.playT = Math.max(0, Math.min(1, v)) * PI.dur;
  if (PI.audio && isFinite(PI.audio.duration)) PI.audio.currentTime = Math.min(PI.playT, PI.audio.duration-0.05);
  followPlay(true);
}
let _last=0;
function followPlay(force){
  syncScrub();
  const now=performance.now();
  if (!force && now-_last<140) return;
  _last=now;
  if (PI.tab==='timeline') renderTab();
  const S=PI.D.turns; let best=null;
  for (const t of S){ if (t.start_s<=PI.playT+1.5) best=t; else break; }
  if (best && !PI.hotTurn.size){
    const row=document.querySelector(`.turn[data-id="${best.id}"]`);
    if (row) row.scrollIntoView({block:'center'});
  }
}
function play(){
  PI.playing=!PI.playing;
  $('#playBtn').innerHTML = PI.playing ? '&#10073;&#10073;' : '&#9654;';
  if (PI.audio){
    if (PI.playing){ if (PI.playT>=PI.dur-.5){ PI.playT=0; PI.audio.currentTime=0; } PI.audio.play(); }
    else PI.audio.pause();
    return;
  }
  if (!PI.playing){ cancelAnimationFrame(PI.raf); return; }
  if (PI.playT>=PI.dur) PI.playT=0;
  let t0=performance.now();
  const step=now=>{
    if (!PI.playing) return;
    PI.playT += (now-t0)/1000*50; t0=now;
    if (PI.playT>=PI.dur){ PI.playT=PI.dur; PI.playing=false; $('#playBtn').innerHTML='&#9654;'; followPlay(true); return; }
    followPlay(); PI.raf=requestAnimationFrame(step);
  };
  PI.raf=requestAnimationFrame(step);
}

function setupAudio(D){
  const a=$('#audio'), tag=$('#audioTag');
  a.pause(); PI.playing=false; $('#playBtn').innerHTML='&#9654;';
  if (PI.live && D.has_audio){
    a.src='/api/cases/'+PI.id+'/audio?v='+(D.audio_bytes||1); tag.hidden=false;
    a.onended=()=>{ PI.playing=false; $('#playBtn').innerHTML='&#9654;'; };
    a.ontimeupdate=()=>{ if(!a.paused){ PI.playT=a.currentTime; followPlay(); } };
    PI.audio=a;
  } else { a.removeAttribute('src'); a.load(); tag.hidden=true; PI.audio=null; }
}

/* ---------- profile re-run ---------- */
async function reprofile(p){
  const base=PI.id.split('__')[0], newId=base+'__'+p;
  tip('re-running with the '+p.replace(/_/g,' ')+' profile — about 3 min');
  try{
    const fd=new FormData(); fd.append('profile',p);
    const r=await fetch('/api/cases/'+base+'/reprofile',{method:'POST',body:fd});
    if (!r.ok) throw new Error((await r.json()).detail||r.statusText);
    poll(newId,p);
  }catch(e){ tip('could not switch: '+e.message); $('#profSel').value=PI.D.profile.id; }
}
function poll(id,p){
  const t0=Date.now();
  const go=async()=>{
    const s=await (await fetch('/api/cases/'+id+'/status')).json();
    if (s.error){ tip('run failed: '+s.error); return; }
    if (s.done){
      PI.cases[id]=null;
      if (![...$('#caseSel').options].some(o=>o.value===id)) $('#caseSel').append(new Option((TITLE[id.split('__')[0]]||id)+' ('+p.replace(/_/g,' ')+')',id));
      await load(id); tip('same transcript, '+p.replace(/_/g,' ')+' profile');
      return;
    }
    $('#tip').textContent = 'reconstructing … '+((s.logged_agents||[]).length)+'/10 steps';
    if (Date.now()-t0<600000) setTimeout(go,2500);
  };
  go();
}
function tip(m){ const t=$('#tip'); t.textContent=m; setTimeout(()=>t.textContent=t.dataset.def,3500); }

/* ---------- wire ---------- */
function wire(){
  $('#tip').dataset.def=$('#tip').textContent;
  $('#playBtn').onclick=play;
  const sc=$('#scrub'); let drag=false;
  const at=x=>{ const r=sc.getBoundingClientRect(); seekTo((x-r.left)/r.width); };
  sc.onpointerdown=e=>{ drag=true; sc.setPointerCapture(e.pointerId); at(e.clientX); };
  sc.onpointermove=e=>{ if(drag) at(e.clientX); };
  sc.onpointerup=()=>drag=false;
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'));
  };
  addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return; if(e.key===' '){ e.preventDefault(); play(); } });
}
boot();
</script>
