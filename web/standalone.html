<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#EEF1EF; --surface:#FFFFFF; --surface-2:#F1F4F2; --surface-3:#E7ECE9;
  --ink:#14231F; --ink-soft:#566661; --ink-faint:#8B9A94;
  --line:#DBE2DE; --line-strong:#C6D0CB;
  --accent:#0B6E63; --accent-ink:#0A5850; --accent-wash:rgba(11,110,99,.09);
  --ok:#2E7D5B; --watch:#B0791A; --alert:#B23B32;
  --r-surgeon:#0B6E63; --r-anesthesia:#9A6114; --r-nurse:#3D6A9E; --r-scrub:#7A5AA6; --r-other:#8B9A94;
  --shadow-sm:0 1px 2px rgba(20,35,31,.06);
  --shadow-md:0 4px 16px -4px rgba(20,35,31,.12),0 1px 3px rgba(20,35,31,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0F0E; --surface:#131B19; --surface-2:#0F1615; --surface-3:#1B2523;
  --ink:#E6ECE9; --ink-soft:#93A29C; --ink-faint:#5F6E68;
  --line:#26312E; --line-strong:#38443F;
  --accent:#42C3B2; --accent-ink:#74DACB; --accent-wash:rgba(66,195,178,.12);
  --ok:#4FB489; --watch:#D4A65A; --alert:#E2726B;
  --r-surgeon:#42C3B2; --r-anesthesia:#D4A65A; --r-nurse:#6FA6D8; --r-scrub:#AC8FDC; --r-other:#5F6E68;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px -6px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0A0F0E; --surface:#131B19; --surface-2:#0F1615; --surface-3:#1B2523;
  --ink:#E6ECE9; --ink-soft:#93A29C; --ink-faint:#5F6E68;
  --line:#26312E; --line-strong:#38443F;
  --accent:#42C3B2; --accent-ink:#74DACB; --accent-wash:rgba(66,195,178,.12);
  --ok:#4FB489; --watch:#D4A65A; --alert:#E2726B;
  --r-surgeon:#42C3B2; --r-anesthesia:#D4A65A; --r-nurse:#6FA6D8; --r-scrub:#AC8FDC; --r-other:#5F6E68;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px -6px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-wash)}
.tnum{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100vh;opacity:0}
.app.in{opacity:1;transition:opacity .35s ease}

/* header */
.bar{display:flex;align-items:center;gap:11px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;box-shadow:var(--shadow-sm);z-index:5}
.mark{width:24px;height:24px;flex:none;border-radius:6px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));display:grid;place-items:center}
.mark svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bar h1{font-family:var(--serif);font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:.01em}
.bar h1 .dim{color:var(--ink-faint);font-weight:400}
select{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 28px 6px 11px;appearance:none;cursor:pointer;transition:border-color .12s,background .12s;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat}
select:hover{border-color:var(--line-strong);background-color:var(--surface-3)}
.bar .spacer{flex:1}
.themebtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-soft);transition:background .12s,color .12s}
.themebtn:hover{background:var(--surface-2);color:var(--ink)}

/* body: two panes */
.panes{flex:1;display:grid;grid-template-columns:39fr 61fr;min-height:0;gap:0}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.pane.left{border-right:1px solid var(--line);background:var(--surface-2)}
.pane.right{background:var(--ground)}
.pane-head{flex:none;display:flex;align-items:center;gap:8px;padding:13px 18px 9px}
.pane-head h2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.pane-head .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:11px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);background-clip:padding-box}

/* transcript */
#turns{padding:2px 0 24px}
.turn{position:relative;display:grid;grid-template-columns:40px 1fr;gap:11px;padding:6px 16px 6px 15px;border-left:2px solid transparent;transition:background .12s,opacity .15s}
.turn::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--rc,transparent);opacity:.5;transition:opacity .12s}
.turn:hover{background:var(--surface)}
.turn.hot{background:var(--accent-wash);border-left-color:var(--accent)}
.turn.hot::before{opacity:0}
.turn.dim{opacity:.32}
.turn .t{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding-top:4px;text-align:right}
.turn .who{font-size:10.5px;font-weight:600;color:var(--rc,var(--accent-ink));text-transform:uppercase;letter-spacing:.03em}
.turn .tx{color:var(--ink);font-size:13.5px;line-height:1.5}
.turn .tx.q{color:var(--ink-soft)}

/* patient strip */
.patient{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);box-shadow:var(--shadow-sm);z-index:2}
.patient b{color:var(--ink);font-weight:600}
.patient .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}
.patient .tag{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-wash);border-radius:4px;padding:2px 6px}
.patient .warn{color:var(--alert);font-weight:600;background:color-mix(in srgb,var(--alert) 10%,transparent);border-radius:4px;padding:2px 7px;font-size:11.5px}

/* tabs */
.tabs{flex:none;display:flex;gap:2px;padding:10px 18px 0;background:var(--ground)}
.tab{font-size:12.5px;padding:9px 14px;border-radius:9px 9px 0 0;color:var(--ink-soft);border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px;transition:color .12s,background .12s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--line);background:var(--surface);position:relative;top:1px;box-shadow:0 -3px 10px -6px rgba(20,35,31,.15)}
.tab .fmt{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.tab .dot.ok{background:var(--ok)} .tab .dot.flag{background:var(--alert);box-shadow:0 0 0 3px color-mix(in srgb,var(--alert) 20%,transparent)}
#tabScroll{background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-md)}

/* timeline tab */
.tlwrap{padding:18px 22px 44px}
.snap{position:relative;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--sev,var(--ok));border-radius:9px;padding:11px 14px;margin-bottom:20px;line-height:1.6}
.snap b{color:var(--ink)}
.snap .chip{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.snap .sev-label{font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--sev,var(--ok))}
.rail{position:relative;padding-left:26px}
.rail::before{content:"";position:absolute;left:6px;top:8px;bottom:14px;width:2px;background:linear-gradient(var(--line-strong),var(--line))}
.ev{position:relative;display:grid;grid-template-columns:48px 1fr;gap:12px;padding:8px 10px 8px 0;border-radius:8px;cursor:default;transition:background .12s,opacity .18s}
.ev::before{content:"";position:absolute;left:-23px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--rc,var(--accent));transition:transform .12s,box-shadow .12s}
.ev:hover{background:var(--surface-2)}
.ev:hover::before,.ev.hot::before{transform:scale(1.3);box-shadow:0 0 0 4px var(--accent-wash)}
.ev.hot{background:var(--accent-wash)}
.ev.future{opacity:.28}
.ev.future::before{background:var(--line);border-color:var(--line-strong)}
.ev .clk{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);padding-top:3px;text-align:right}
.ev .txt{font-size:13.5px;color:var(--ink);line-height:1.5}
.ev .txt .kind{display:inline-block;color:var(--rc,var(--ink-soft));font-family:var(--mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-right:7px;vertical-align:1px}
.ev .txt .by{color:var(--ink-faint);font-size:11px;margin-left:6px}
.tl-empty{padding:56px 24px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.95}
.tl-empty svg{width:34px;height:34px;stroke:var(--line-strong);fill:none;stroke-width:1.6;margin-bottom:12px}

/* document tab */
.doc{padding:26px 34px 68px;font-family:var(--serif);font-size:15.5px;line-height:1.72;color:var(--ink);max-width:70ch}
.doc p{margin:0 0 12px}
.doc .lead{display:block;font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin:18px 0 3px}
.doc p:first-child .lead{margin-top:0}
.doc .lk{border-bottom:1.5px solid var(--accent);cursor:pointer;transition:background .12s;border-radius:2px}
.doc .lk:hover,.doc .lk.hot{background:var(--accent-wash)}
.doc .flags{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent);border:1px solid color-mix(in srgb,var(--alert) 22%,transparent);border-radius:9px;padding:11px 13px;margin-bottom:18px}
.doc .flags b{display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.doc .flags ul{margin:0 0 0 16px}
.doc .scrubnote{font-family:var(--sans);font-size:11.5px;color:var(--watch);background:color-mix(in srgb,var(--watch) 9%,transparent);border-radius:7px;padding:7px 11px;margin-bottom:16px}
.doc.empty{font-family:var(--sans);color:var(--ink-faint);font-size:13px;padding-top:40px}

/* transport */
.transport{flex:none;display:flex;align-items:center;gap:15px;padding:11px 20px;border-top:1px solid var(--line);background:var(--surface);box-shadow:0 -2px 12px -6px rgba(20,35,31,.12);z-index:3}
.play{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink);background:var(--surface-2);font-size:12px;transition:border-color .12s,color .12s,background .12s,transform .1s}
.play:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.play:active{transform:scale(.94)}
.scrub{flex:1;height:22px;display:flex;align-items:center;position:relative;cursor:pointer}
.scrub .track{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-ink),var(--accent));border-radius:3px}
.scrub .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);transform:translate(-50%,-50%);box-shadow:var(--shadow-sm);transition:width .1s,height .1s}
.scrub:hover .knob{width:16px;height:16px}
.clk{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.02em}
.clk b{color:var(--ink)}
.audiotag{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent-wash);border-radius:5px;padding:3px 7px;white-space:nowrap}
.tip{font-size:11px;color:var(--ink-faint);white-space:nowrap;max-width:34ch;overflow:hidden;text-overflow:ellipsis}
#audio{display:none}

.loading{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:var(--ink-soft);z-index:50}
.loading .mark{width:34px;height:34px;border-radius:9px;animation:pulse 1.6s ease-in-out infinite}
.loading .mark svg{width:19px;height:19px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.93)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.app{opacity:1}}
@media (max-width:960px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .panes{grid-template-columns:1fr}
  .pane.left{border-right:none;border-bottom:1px solid var(--line)}
  .pane .scroll{max-height:58vh}
  .tip{display:none}
  .doc{padding:22px 20px 60px}
}
</style>
</head>

he cystic duct and artery clearly getting my critical view","source":"whisper"},{"id":"t0015","start_s":127.29503,"end_s":135.29503,"speaker":null,"role":"surgeon","text":"Clipping the cystic artery, and the cystic duct, two clips proximal, one distal, dividing.","source":"whisper"},{"id":"t0016","start_s":135.29503,"end_s":140.29503,"speaker":null,"role":"surgeon","text":"Taking the gallbladder off the liver bed with the cautery.","source":"whisper"},{"id":"t0017","start_s":140.29503,"end_s":147.79503,"speaker":null,"role":"surgeon","text":"Gallbladder is out. It's going to pathology. Send it as gallbladder. Acute cholecystitis.","source":"whisper"},{"id":"t0018","start_s":150.29503,"end_s":155.45503,"speaker":null,"role":"surgeon","text":"More oozing from the liver bed. Let's put some hemostatic agent on it and pack it for a few minutes.","source":"whisper"},{"id":"t0019","start_s":157.97504,"end_s":164.35503,"speaker":null,"role":"anesthesia","text":"Blood pressure dipped to 92 over 55, giving a fluid bolus. Heart rate's up to 104.","source":"whisper"},{"id":"t0020","start_s":164.35503,"end_s":171.67502,"speaker":null,"role":"surgeon","text":"Bleeding's controlled now. Total blood loss I'd estimate around 400 mils.","source":"whisper"},{"id":"t0021","start_s":174.07503,"end_s":180.51501,"speaker":null,"role":"anesthesia","text":"Pressure came back up to 118 over 68 after the liter of crystalloid. No transfusion needed.","source":"whisper"},{"id":"t0022","start_s":182.77502,"end_s":187.99503,"speaker":null,"role":"surgeon","text":"Placing a Jackson-Pratt drain in the gallbladder fossa, bringing it out the lateral port site.","source":"whisper"},{"id":"t0023","start_s":190.43503,"end_s":194.03503,"speaker":null,"role":"circulating_nurse","text":"Instrument, sponge, and needle counts are correct times two.","source":"whisper"},{"id":"t0024","start_s":194.35503,"end_s":200.09503,"speaker":null,"role":"surgeon","text":"Closing the fascia with looped PDS, skin with staples","source":"whisper"},{"id":"t0025","start_s":200.09503,"end_s":209.39502,"speaker":null,"role":"anesthesia","text":"Reversing paralysis, patient breathing spontaneously, extubated, moving all four extremities","source":"whisper"},{"id":"t0026","start_s":211.39502,"end_s":220.43503,"speaker":null,"role":"surgeon","text":"For handoff, converted lap chole to open, difficult anatomy, EBL 400, 1JP drain in the fossa, no transfusion","source":"whisper"},{"id":"t0027","start_s":220.43503,"end_s":228.89502,"speaker":null,"role":"surgeon","text":"He'll go to the PACU first, then I want him admitted overnight for pain control and to watch the drain output","source":"whisper"},{"id":"t0028","start_s":228.89502,"end_s":235.51503,"speaker":null,"role":"circulating_nurse","text":"Agree, floor admission after PACU, I'll update the family now","source":"whisper"}],"events":[{"id":"e000","t_start_s":0.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"arrival"},"evidence_turn_ids":["t0000"],"by_role":"circulating_nurse","confidence":1.0,"extractor":"llm"},{"id":"e001","t_start_s":17.74,"t_end_s":null,"type":"phase_transition","payload":{"phase":"induction"},"evidence_turn_ids":["t0002"],"by_role":"anesthesia","confidence":1.0,"extractor":"llm"},{"id":"e002","t_start_s":17.74,"t_end_s":null,"type":"line_placed","payload":{"type":"IV","site":"left forearm"},"evidence_turn_ids":["t0002"],"by_role":"anesthesia","confidence":1.0,"extractor":"llm"},{"id":"e003","t_start_s":24.48,"t_end_s":null,"type":"phase_transition","payload":{"phase":"timeout"},"evidence_turn_ids":["t0003","t0005"],"by_role":"surgeon","confidence":1.0,"extractor":"llm"},{"id":"e004","t_start_s":38.899998,"t_end_s":null,"type":"medication_given","payload":{"name":"Cefazolin","dose":"2 grams","route":"IV"},"evidence_turn_ids":["t0004"],"by_role":"circulating_nurse","confidence":1.0,"extractor":"llm"},{"id":"e005","t_start_s":49.559998,"t_end_s":null,"type":"phase_transition","payload":{"phase":"position -Pratt drain output. Standard PACU recovery.\n**S \u2014 Situation awareness & contingencies**: Watch for increasing drain output or hemodynamic changes (if bleeding). Watch for signs of infection.\n**S \u2014 Synthesis by receiver**:\nReceiver read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Preoperative diagnosis: acute calculous cholecystitis\nPostoperative diagnosis: acute calculous cholecystitis\nProcedure: laparoscopic cholecystectomy converted to open cholecystectomy\nSurgeon / anesthesia: not documented\nAnesthesia type: general endotracheal\nFindings: Significant inflammation around the gallbladder with omentum stuck to it and dense adhesions. Obscured anatomy and bleeding encountered during the laparoscopic approach.\nImplants: none documented\nEstimated blood loss: 400 mL\nSpecimens: gallbladder, acute cholecystitis\nComplications: unable to proceed laparoscopically due to obscured anatomy and bleeding, converted to open; blood pressure dipped to 92/55, heart rate up to 104\nCounts: correct\nDisposition: PACU (then admitted overnight to floor for pain control and drain output monitoring)\nBrief narrative: After induction and antibiotic administration, initial laparoscopic approach revealed significant inflammation, dense adhesions, and obscured anatomy with bleeding, leading to conversion to an open procedure. A right subcostal incision was made, and the gallbladder was removed. A Jackson-Pratt drain was placed in the gallbladder fossa. Instrument, sponge, and needle counts were correct. The patient was extubated and transferred to PACU.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your family member has finished the surgery on their gallbladder. There was a difficulty during the procedure that the team managed. He is now in the recovery area, where nurses will be watching him closely as he wakes up. He will be staying in the hospital overnight for observa g-eluting stent. Counts: not documented.\n**A \u2014 Assessment**: Stable, for close observation. Right radial access site with radial band, distal pulse good, hand pink and warm. Main concern: History of transient hypotension during balloon inflation.\n**R \u2014 Recommendation**: Monitor right radial access site for bleeding/hematoma. Perform frequent right hand distal pulse and neurovascular checks. Bed rest as per unit protocol for radial access post-PCI. Continue dual antiplatelet therapy (aspirin and ticagrelor). If chest pain, hypotension, access site bleeding, or neurovascular changes in right hand, notify consultant cardiologist immediately.\n\nReceiving nurse read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Date: not documented\nOperator: not documented (cardiologist)\nProcedure: Coronary angiography and percutaneous coronary intervention\nIndication: Non-ST-elevation myocardial infarction\nAccess site and closure: Right radial access, radial band for hemostasis\nSheath size: 6 French\nContrast agent and volume: 140 mls\nFluoroscopy time / dose: 12 minutes / not documented\nAnticoagulation: Heparin (as part of radial cocktail)\nFindings: 90% stenosis in the mid-LAD; right coronary artery clean.\nDevices / stents deployed: 3 by 18 mm drug-eluting stent\nComplications: Chest pain and hypotension (95 systolic) during balloon inflation\nEstimated blood loss: Minimal\nDisposition: CCU for overnight monitoring\n\nBrief narrative:\nThe patient received midazolam and fentanyl for sedation. Right radial access was obtained with a 6 French sheath, and a radial cocktail including Verapamil and heparin was administered. Diagnostic angiography identified a 90% stenosis in the mid-LAD. Percutaneous coronary intervention proceeded with predilation and deployment of a 3 by 18 mm drug-eluting stent. During balloon inflation, the patient experienced transient chest pain and hypotension, which resolved upon balloon deflation. The sheath was removed, a radial band was applied for hemostasis, and the patient was transferred to the CCU with aspirin and ticagrelor initiated.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your loved one had a procedure today to check and clear blockages in the heart's arteries. This was done using a small tube inserted into an artery, not open surgery. There was a difficulty during the procedure that the team managed. The patient is now in a special heart monitoring area where they will need to lie still for a while so the small entry site can heal. The cardiologist will come speak with you directly.","unsupported_claims":[],"revised":false,"accepted":true}},"links":{"handoff":[{"start":106,"end":109,"field":"disposition","label":"disposition: CCU (for overnight monitoring)","event_ids":["e020"],"turn_ids":["t0013"]},{"start":344,"end":351,"field":"meds","label":"medication: heparin","event_ids":["e006"],"turn_ids":["t0003"]},{"start":386,"end":393,"field":"meds","label":"medication: aspirin","event_ids":["e021"],"turn_ids":["t0013"]},{"start":398,"end":408,"field":"meds","label":"medication: ticagrelor","event_ids":["e022"],"turn_ids":["t0013"]},{"start":442,"end":468,"field":"implants","label":"implant: 3x18 mm drug-eluting stent","event_ids":["e014"],"turn_ids":["t0008"]},{"start":515,"end":526,"field":"complications","label":"complication: chest pain and hypotension (95 systolic) during balloon infl","event_ids":["e011"],"turn_ids":["t0007","t0008","t0012"]},{"start":630,"end":656,"field":"implants","label":"implant: 3x18 mm drug-eluting stent","event_ids":["e014"],"turn_ids":["t0008"]},{"start":850,"end":861,"field":"complications","label":"complication: chest pain and hypotension (95 systolic) during balloon infl","event_ids":["e011"],"turn_ids":["t0007","t0008","t0012"]},{"start":1129,"end":1136,"field":"meds","label":"medication: aspirin","event_ids":["e021"],"turn_ids":["t0013"]},{"start":1141,"end":1 eneric operating room (US)","care_setting":"operating_room","phases":["arrival","setup","timeout","induction","positioning_prep","incision","dissection","key_procedure","closure","emergence","handoff"],"handoff_name":"I-PASS"},"context":{"patient_descriptor":"27-year-old patient","planned_procedure":null,"indication":"Trauma activation, high speed MVC, hypotensive","anesthesia_type":"Rapid sequence induction with etomidate and succinylcholine","allergies":[],"home_medications":[],"problem_list":[],"sources":{"patient_descriptor":"transcript","indication":"transcript","anesthesia_type":"transcript"},"evidence_turn_ids":["t0000","t0001"]},"turns":[{"id":"t0000","start_s":0.0,"end_s":7.3999996,"speaker":null,"role":"circulating_nurse","text":"Trauma activation 27 year old, high speed MVC, hypotensive in the bay, going straight to X lab.","source":"whisper"},{"id":"t0001","start_s":9.44,"end_s":18.56,"speaker":null,"role":"anesthesia","text":"Rapid sequence induction, etomidate and succinylcholine, tube confirmed, 2 large bore IVs, starting the rapid transfuser.","source":"whisper"},{"id":"t0002","start_s":18.56,"end_s":30.599998,"speaker":null,"role":"anesthesia","text":"Pressure is 74 over 40, heart rate 130, activating massive transfusion protocol, hanging PRBC and FFP now","source":"whisper"},{"id":"t0003","start_s":30.599998,"end_s":37.62,"speaker":null,"role":"surgeon","text":"No time for a formal timeout, prepping and draping, beta-9, wide","source":"whisper"},{"id":"t0004","start_s":40.02,"end_s":46.28,"speaker":null,"role":"surgeon","text":"Midline laparotomy from xiphoid to pubis, lots of blood in the abdomen, suction, and get me packs","source":"whisper"},{"id":"t0005","start_s":46.28,"end_s":54.1,"speaker":null,"role":"surgeon","text":"Packing all four quadrants. The bleeding is coming from the left upper quadrant. I think the spleen.","source":"whisper"},{"id":"t0006","start_s":56.66,"end_s":64.28,"speaker":null,"role":"anesthesia","text":"Still hypotensive. 68 systolic. Giving another 2 units red cells and 2 FFP. Started norepinephrine.","source":"whisper"},{"id":"t0007","start_s":66.38,"end_s":72.6,"speaker":null,"role":"surgeon","text":"The spleen is shattered. Doing a splenectomy. Clamping the hilum now. Dividing the short gastrics.","source":"whisper"},{"id":"t0008","start_s":72.6,"end_s":79.28,"speaker":null,"role":"surgeon","text":"Spleen is out, that was the main source, pressure should start coming up","source":"whisper"},{"id":"t0009","start_s":79.28,"end_s":99.96,"speaker":null,"role":"anesthesia","text":"Coming up now 95 over 55 on a little Narepi we given 6 units red cells 4 FFP 1 platelet so far Now running the bowel there a segment of small bowel with a mesenteric tear and it looks non about 20 cm","source":"whisper"},{"id":"t0010","start_s":102.659996,"end_s":103.78,"speaker":null,"role":"surgeon","text":"Resecting that segment.","source":"whisper"},{"id":"t0011","start_s":104.34,"end_s":106.36,"speaker":null,"role":"surgeon","text":"Stapling across proximal and distal.","source":"whisper"},{"id":"t0012","start_s":106.67999,"end_s":108.6,"speaker":null,"role":"surgeon","text":"Leaving it in discontinuity for now.","source":"whisper"},{"id":"t0013","start_s":110.759995,"end_s":112.659996,"speaker":null,"role":"surgeon","text":"Rest of the bowel looks okay.","source":"whisper"},{"id":"t0014","start_s":113.02,"end_s":113.96,"speaker":null,"role":"surgeon","text":"Liver is intact.","source":"whisper"},{"id":"t0015","start_s":114.28,"end_s":116.479996,"speaker":null,"role":"surgeon","text":"No other major injuries that I can see.","source":"whisper"},{"id":"t0016","start_s":118.06,"end_s":126.22,"speaker":null,"role":"surgeon","text":"Patient still cold and coagulopathic. We're going to do damage control. Temporary abdominal closure with a wound vac.","source":"whisper"},{"id":"t0017","start_s":128.28,"end_s":132.78,"speaker":null,"role":"surgeon","text":"Leaving packs in the pelvis and the left upper quadrant. Abdomen stays open.","source":"whisper"},{"id":"t0018","start_s":135.28,"end_s":142.98,"speaker":null,"role":"circulating_nurse","text":"Counts are intentionally incorrect. Documenting. Four laparotomy pads retained on purpose for damage control, plus the packs.","source":"whisper"},{"id":"t0019","start_s":142.98,"end_s":154.51999,"speaker":null,"role":"anesthesia","text":"EBL is hard to estimate, at least 3 liters, total given, 8 red cells, 6 FFP, 2 platelets, 1 cryo","source":"whisper"},{"id":"t0020","start_s":154.51999,"end_s":165.0,"speaker":null,"role":"surgeon","text":"For handoff, damage control laparotomy, splenectomy, small bowel resection in discontinuity, open abdomen with packs","source":"whisper"},{"id":"t0021","start_s":165.0,"end_s":177.41998,"speaker":null,"role":"anesthesia","text":"Going to the ICU intubated, on norepinephrine. Plan is to warm, resuscitate, correct COADs, and back to the OR in 24-48 hours","source":"whisper"},{"id":"t0022","start_s":179.45999,"end_s":185.01999,"speaker":null,"role":"surgeon","text":"The family is in the surgical waiting room, they know it's serious, I'll go talk to them now","source":"whisper"}],"events":[{"id":"e000","t_start_s":0.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"arrival"},"evidence_turn_ids":["t0000"],"by_role":"circulating_nurse","confidence":1.0,"extractor":"llm"},{"id":"e001","t_start_s":0.0,"t_end_s":null,"type":"hemodynamic_event","payload":{"description":"Pressure 74 over 40, heart rate 130"},"evidence_turn_ids":["t0000","t0002","t0006","t0009"],"by_role":"anesthesia","confidence":1.0,"extractor":"llm"},{"id":"e002","t_start_s":9.44,"t_end_s":null,"type":"phase_transition","payload":{"phase":"induction"},"evidence_turn_ids":["t0001"],"by_role":"anesthesia","confidence":1.0,"extractor":"llm"},{"id":"e003","t_start_s":9.44,"t_end_s":null,"type":"medication_given","payload":{"name":"etomidate","route":"IV"},"evidence_turn_ids":["t0001"],"by_role":"anesthesia","confidence":1.0 ote":{"kind":"opnote","text":"Preoperative diagnosis: Trauma activation, high speed MVC, hypotensive\nPostoperative diagnosis: Trauma activation, high speed MVC, hypotensive with shattered spleen and non-viable small bowel segment with mesenteric tear\nProcedure: Splenectomy, small bowel resection in discontinuity, damage control laparotomy with temporary abdominal closure\nSurgeon / anesthesia: not documented\nAnesthesia type: Rapid sequence induction with etomidate and succinylcholine\nFindings: Lots of blood in the abdomen, shattered spleen, segment of small bowel with a mesenteric tear and it looks non-viable (20 cm)\nImplants: not documented\nEstimated blood loss: 3000 ml\nSpecimens: Spleen, 20 cm segment of small bowel\nComplications: segment of small bowel with a mesenteric tear and it looks non-viable (20 cm)\nCounts: incorrect (intentional: Four laparotomy pads retained on purpose for damage control, plus the packs.)\nDisposition: ICU (intubated, on norepinephrine. Plan is to warm, resuscitate, correct COADs, and back to the OR in 24-48 hours)\nBrief narrative: The patient arrived with trauma activation, high speed MVC, and was hypotensive. Rapid sequence induction was performed, and a midline laparotomy was opened, revealing lots of blood. A shattered spleen and a 20 cm non-viable small bowel segment with a mesenteric tear were identified. A splenectomy and small bowel resection in discontinuity were performed. Damage control laparotomy with temporary abdominal closure and retained packs was completed. The patient was transferred to the ICU intubated and on norepinephrine for further resuscitation.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your loved one had surgery to address serious injuries in the abdomen, including the spleen and a part of the bowel. This was a very serious situation, and they are currently very sick and in critical condition. The team is doing everything possible to stabilize them, and aker":"ANESTHESIA","role":"anesthesia","text":"Pre-oxygenating now. Plan is general endotracheal, propofol and rocuronium for induction.","source":"srt"},{"id":"t0003","start_s":220.0,"end_s":226.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Induction complete, tube's in, good bilateral breath sounds. Second IV placed in the left forearm.","source":"srt"},{"id":"t0004","start_s":330.0,"end_s":352.0,"speaker":"SURGEON","role":"surgeon","text":"Let's do our time out. Confirming patient, laparoscopic cholecystectomy, possible conversion to open, consent signed, antibiotics given?","source":"srt"},{"id":"t0005","start_s":352.0,"end_s":357.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Cefazolin two grams IV went in about ten minutes ago.","source":"srt"},{"id":"t0006","start_s":370.0,"end_s":374.0,"speaker":"SURGEON","role":"surgeon","text":"Great. Everyone agree? Time out complete.","source":"srt"},{"id":"t0007","start_s":500.0,"end_s":507.0,"speaker":"SURGEON","role":"surgeon","text":"Prepped and draped. Making the infraumbilical incision now for the Veress needle.","source":"srt"},{"id":"t0008","start_s":555.0,"end_s":560.0,"speaker":"SURGEON","role":"surgeon","text":"Insufflating. Pressures look good, fifteen millimeters of mercury. Placing the ports.","source":"srt"},{"id":"t0009","start_s":720.0,"end_s":730.0,"speaker":"SURGEON","role":"surgeon","text":"Camera's in. There's a lot of inflammation around the gallbladder, omentum is stuck to it. Adhesions are dense.","source":"srt"},{"id":"t0010","start_s":930.0,"end_s":938.0,"speaker":"SURGEON","role":"surgeon","text":"Taking down the adhesions. The tissue planes are really hard to see here.","source":"srt"},{"id":"t0011","start_s":1185.0,"end_s":1195.0,"speaker":"SURGEON","role":"surgeon","text":"I'm having trouble getting a critical view of safety. The anatomy at the triangle is completely obscured.","source":"srt"},{"id":"t0012","start_s":1330.0,"end_s":1339.0,"speaker":"SURGEON","role":"surgeon","text":"There's bleeding from the liver bed, more than I'd like. Suction please. Estimate maybe 150 mils so far.","source":"srt"},{"id":"t0013","start_s":1440.0,"end_s":1452.0,"speaker":"SURGEON","role":"surgeon","text":"I'm not comfortable continuing laparoscopically. We're going to convert to open. Let's get the open tray.","source":"srt"},{"id":"t0014","start_s":1470.0,"end_s":1475.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Copy, converting to open. Patient's stable, heart rate 88, pressure 120 over 70.","source":"srt"},{"id":"t0015","start_s":1620.0,"end_s":1628.0,"speaker":"SURGEON","role":"surgeon","text":"Making a right subcostal incision. Extending it now.","source":"srt"},{"id":"t0016","start_s":1935.0,"end_s":1945.0,"speaker":"SURGEON","role":"surgeon","text":"Better exposure now. I can see the cystic duct and artery clearly. Getting my critical view.","source":"srt"},{"id":"t0017","start_s":2200.0,"end_s":2208.0,"speaker":"SURGEON","role":"surgeon","text":"Clipping the cystic artery. And the cystic duct, two clips proximal, one distal. Dividing.","source":"srt"},{"id":"t0018","start_s":2340.0,"end_s":2347.0,"speaker":"SURGEON","role":"surgeon","text":"Taking the gallbladder off the liver bed with the cautery.","source":"srt"},{"id":"t0019","start_s":2480.0,"end_s":2488.0,"speaker":"SURGEON","role":"surgeon","text":"Gallbladder is out. It's going to pathology. Send it as gallbladder, acute cholecystitis.","source":"srt"},{"id":"t0020","start_s":2550.0,"end_s":2560.0,"speaker":"SURGEON","role":"surgeon","text":"More oozing from the liver bed. Let's put some hemostatic agent on it and pack it for a few minutes.","source":"srt"},{"id":"t0021","start_s":2760.0,"end_s":2769.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Blood pressure dipped to 92 over 55. Giving a fluid bolus. Heart rate's up to 104.","source":"srt"},{"id":"t0022","start_s":2910.0,"end_s":2920.0,"speaker":"SURGEON","role":"surgeon","text":"Bleeding's controlled now. Total blood loss I'd estimate around 400 mils.","source":"srt"},{"id":"t0023","start_s":2950.0,"end_s":2958.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Pressure came back up to 118 over 68 after the liter of crystalloid. No transfusion needed.","source":"srt"},{"id":"t0024","start_s":3120.0,"end_s":3128.0,"speaker":"SURGEON","role":"surgeon","text":"Placing a Jackson-Pratt drain in the gallbladder fossa, bringing it out the lateral port site.","source":"srt"},{"id":"t0025","start_s":3345.0,"end_s":3353.0,"speaker":"CIRCULATOR","role":"circulating_nurse","text":"Instrument, sponge, and needle counts are correct times two.","source":"srt"},{"id":"t0026","start_s":3390.0,"end_s":3397.0,"speaker":"SURGEON","role":"surgeon","text":"Closing the fascia with looped PDS. Skin with staples.","source":"srt"},{"id":"t0027","start_s":3720.0,"end_s":3730.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"Reversing paralysis. Patient breathing spontaneously, extubated, moving all four extremities.","source":"srt"},{"id":"t0028","start_s":3870.0,"end_s":3882.0,"speaker":"SURGEON","role":"surgeon","text":"For handoff: converted lap chole to open, difficult anatomy, EBL 400, one JP drain in the fossa. No transfusion.","source":"srt"},{"id":"t0029","start_s":3900.0,"end_s":3912.0,"speaker":"ANESTHESIA","role":"anesthesia","text":"He'll go to the PACU first, then I want him admitted overnight for pain control and to watch the drain output.","source":"srt"},{"id":"t0030","start_s":3930.0,"end_s":3938.0,"speaker":"SURGEON","role":"surgeon","text":"Agree, floor admission after PACU. I'll update the family now.","source":"srt"}],"events":[{"id":"e000","t_start_s":12.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"sign_in"},"evidence_turn_ids":["t0001"],"by_role":"circulating_nurse","confidence":0.95,"extractor":"llm"},{"id":"e001","t_start_s":65.0,"t_end_s":null,"type":"phase_transition","payload":{"phase":"induction"},"evidence_turn_ids":["t0002","t0003"],"by_role":"anesthesia g anatomy, inability to obtain critical view of safety","t_s":720.0,"resolved":null},{"description":"converted to open due to inability to obtain critical view of safety and bleeding from liver bed","t_s":1330.0,"resolved":null},{"description":"Oozing from liver bed","t_s":2550.0,"resolved":true}],"open_concerns":["dense adhesions and inflammation obscuring anatomy, inability to obtain critical view of safety","converted to open due to inability to obtain critical view of safety and bleeding from liver bed","case converted laparoscopic -> open","Oozing from liver bed","Hypotension (92/55) and tachycardia (HR 104)"],"disposition":"PACU (Then admitted to floor overnight)","disposition_path":["PACU"],"last_event_id":"e026","provenance":{"phase":["e000","e001","e005","e007","e008","e010","e015","e023","e024","e025","e026"],"meds":["e002","e003","e006","e019"],"lines":["e004"],"complications":["e009","e012","e017"],"ebl_ml":["e011","e020"],"converted":["e013"],"open_concerns":["e018"],"drains":["e021"],"counts":["e022"],"disposition":["e026"]}}],"drafts":{"handoff":{"kind":"handoff","text":"**S \u2014 Situation**: 54-year-old male, converted laparoscopic to open cholecystectomy, currently in handover phase, extubated and moving all four extremities.\n**B \u2014 Background**: Indication acute calculous cholecystitis. History: hypertension, hyperlipidaemia, cholelithiasis, type 2 diabetes. Allergies: penicillin (rash), shellfish. Anaesthetic: general endotracheal (propofol, rocuronium). Intraoperative course: dense adhesions and inflammation obscured anatomy; converted to open due to inability to obtain critical view of safety and bleeding from liver bed; oozing from liver bed controlled with hemostatic agent and packing. EBL 400 ml. No transfusion. Lines: IV left forearm. Drains: Jackson-Pratt in gallbladder fossa. Implants: none. Swab/instrument count: correct.\n**A \u2014 Assessment**: Stable. Main concerns: difficult anatomy, recent hypotension (92/55) and tachycardia (HR 104) resolved with fluid bolus, drain output monitoring.\n**R \u2014 Recommendation**: Monitor drain output and vital signs. If drain output is excessive or haemodynamics unstable, notify consultant. Admit to floor overnight for pain control and observation.\n\nReceiving nurse read-back:","unsupported_claims":[],"revised":false,"accepted":true},"opnote":{"kind":"opnote","text":"Date and time: not documented\nOperating surgeon and anaesthetist: not documented\nOperation: Laparoscopic cholecystectomy converted to open cholecystectomy\nIndication: Acute calculous cholecystitis\nAnaesthetic: General endotracheal\nFindings: Dense adhesions and inflammation obscuring anatomy; inability to obtain critical view of safety laparoscopically; oozing from liver bed\nProcedure in brief: Laparoscopic approach initiated; converted to open via right subcostal incision due to difficult anatomy and bleeding; cholecystectomy performed; hemostasis achieved; Jackson-Pratt drain placed in gallbladder fossa; fascia and skin closed\nImplants / prostheses: none documented\nEstimated blood loss: 400 ml\nSpecimens sent: Gallbladder (acute cholecystitis)\nComplications: Dense adhesions and inflammation obscuring anatomy; converted to open due to inability to obtain critical view of safety and bleeding from liver bed; oozing from liver bed (resolved); hypotension (92/55) and tachycardia (HR 104)\nSwab and instrument count: Correct\nPost-operative instructions: Admit to floor overnight for pain control and to monitor drain output\nDisposal: not documented\nBrief narrative: The patient underwent a laparoscopic cholecystectomy for acute calculous cholecystitis, but dense adhesions and inflammation prevented obtaining a critical view of safety. The procedure was converted to an open cholecystectomy via a right subcostal incision due to persistent bleeding from the liver bed. The gallbladder was removed and sent for pathology, and a Jackson-Pratt drain was placed in the gallbladder fossa. Intraoperative hypotension and tachycardia were managed with a 1-liter crystalloid bolus. The patient was extubated in the theatre and transferred to recovery, with a plan for overnight admission to the floor.","unsupported_claims":[],"revised":false,"accepted":true},"family":{"kind":"family","text":"Your family member had surgery to remove his gallbladder. There was a difficulty during the procedure that the team managed. He is now in the recovery area. The medical team is watching him closely to make sure he is comfortable. He will stay in the hospital overnight for further care. The surgeon will come and speak with you as soon as they can.","unsupported_claims":[],"revised":false,"accepted":false}},"links":{"handoff":[{"start":37,"end":46,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":368,"end":376,"field":"meds","label":"medication: propofol","event_ids":["e002"],"turn_ids":["t0002"]},{"start":378,"end":388,"field":"meds","label":"medication: rocuronium","event_ids":["e003"],"turn_ids":["t0002"]},{"start":420,"end":429,"field":"complications","label":"complication: dense adhesions and inflammation obscuring anatomy, inabilit","event_ids":["e009"],"turn_ids":["t0009","t0010","t0011"]},{"start":465,"end":474,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e013"],"turn_ids":["t0013"]},{"start":563,"end":569,"field":"complications","label":"complication: Oozing from liver bed","event_ids":["e017"],"turn_ids":["t0020"]},{"start":635,"end":641,"field":"ebl_ml","label":"estimated blood loss","event_ids":["e020"],"turn_ids":["t0022"]},{"start":691,"end":704,"field":"drains","label":"drain: Jackson-Pratt gallbladder fossa","event_ids":["e021"],"turn_ids":["t0024"]},{"start":759,"end":764,"field":"counts","label":"counts: correct","event_ids":["e022"],"turn_ids":["t0025"]}],"opnote":[{"start":121,"end":130,"field":"converted","label":"conversion: laparoscopic -> open","event_ids":["e ","emergence","handoff"],"handoff_name":"I-PASS"},"context":{"patient_descriptor":null,"planned_procedure":"CR","indication":null,"anesthesia_type":null,"allergies":[],"home_medications":[],"problem_list":[],"sources":{},"evidence_turn_ids":["t0019","t0020"]},"turns":[{"id":"t0001","start_s":0.0,"end_s":2.0,"speaker":null,"role":null,"text":"Ok.","source":"srt"},{"id":"t0002","start_s":8.98,"end_s":13.82,"speaker":null,"role":null,"text":"Maybe we can do a personal clean-up drone of the toilets.","source":"srt"},{"id":"t0003","start_s":14.14,"end_s":20.62,"speaker":null,"role":null,"text":"It's a bit tricky with all the dust and all.","source":"srt"},{"id":"t0004","start_s":21.38,"end_s":23.38,"speaker":null,"role":null,"text":"Slippy.","source":"srt"},{"id":"t0005","start_s":60.0,"end_s":72.08,"speaker":null,"role":null,"text":"I have to try.","source":"srt"},{"id":"t0006","start_s":72.08,"end_s":75.5,"speaker":null,"role":null,"text":"Right.","source":"srt"},{"id":"t0007","start_s":75.5,"end_s":82.86,"speaker":null,"role":null,"text":"That's fine.","source":"srt"},{"id":"t0008","start_s":82.86,"end_s":84.86,"speaker":null,"role":null,"text":"It's already starting, yes, please.","source":"srt"},{"id":"t0009","start_s":106.86,"end_s":107.86,"speaker":null,"role":null,"text":"Yes.","source":"srt"},{"id":"t0010","start_s":142.86,"end_s":146.34,"speaker":null,"role":null,"text":"Well, we're gonna have to deal peek-a-boo.","source":"srt"},{"id":"t0011","start_s":150.46,"end_s":152.62,"speaker":null,"role":null,"text":"Oh, shit.","source":"srt"},{"id":"t0012","start_s":154.78,"end_s":157.18,"speaker":null,"role":null,"text":"We're gonna have an error message.","source":"srt"},{"id":"t0013","start_s":157.3,"end_s":159.46,"speaker":null,"role":null,"text":"Here's the robot.","source":"srt"},{"id":"t0014","start_s":159.58,"end_s":162.02,"speaker":null,"role":null,"text":"\u2013Caught something? \u2013Yes.","source":"srt"},{"id":"t0015","start_s":162.14,"end_s":164.54,"speaker":null,"role":null,"text":"A camera connection error earlier.","source":"srt"},{"id":"t0016","start_s":166.94,"end_s":169.58,"speaker":null,"role":null,"text":"What do we do? Either...","source":"srt"},{"id":"t0017","start_s":169.58,"end_s":192.22,"speaker":null,"role":null,"text":"That means we're going to clean some cables.","source":"srt"},{"id":"t0018","start_s":192.22,"end_s":197.22,"speaker":null,"role":null,"text":"I don't know where the cables are.","source":"srt"},{"id":"t0019","start_s":312.22,"end_s":319.22,"speaker":null,"role":null,"text":"David, are we going to do CR?","source":"srt"},{"id":"t0020","start_s":319.22,"end_s":321.22,"speaker":null,"role":null,"text":"Yes, we are doing CR.","source":"srt"},{"id":"t0021","start_s":321.22,"end_s":323.22,"speaker":null,"role":null,"text":"Then we don't need the saw blade, right?","source":"srt"},{"id":"t0022","start_s":323.22,"end_s":324.22,"speaker":null,"role":null,"text":"No.","source":"srt"},{"id":"t0023","start_s":328.22,"end_s":330.22,"speaker":null,"role":null,"text":"The problem has been solved.","source":"srt"},{"id":"t0024","start_s":330.22,"end_s":331.22,"speaker":null,"role":null,"text":"Does it fit?","source":"srt"},{"id":"t0025","start_s":331.22,"end_s":334.22,"speaker":null,"role":null,"text":"At least we hope so.","source":"srt"},{"id":"t0026","start_s":372.22,"end_s":374.22,"speaker":null,"role":null,"text":"Finally, end of the day.","source":"srt"},{"id":"t0027","start_s":385.22,"end_s":388.22,"speaker":null,"role":null,"text":"David, we could do a short finish.","source":"srt"},{"id":"t0028","start_s":389.22,"end_s":391.22,"speaker":null,"role":null,"text":"A short underbar.","source":"srt"},{"id":"t0029","start_s":391.22,"end_s":393.22,"speaker":null,"role":null,"text":"That's a good idea.","source":"srt"},{"id":"t0030","start_s":394.22,"end_s":397.22,"speaker":null,"role":null,"text":"We'll take the shorter one.","source":"srt"},{"id":"t0031","start_s":398.22,"end_s":400.22,"speaker":null,"role":null,"text":"Does it matter?","source":"srt"},{"id":"t0032","start_s":400.22,"end_s":404.82,"speaker":null,"role":null,"text":"It doesn't matter, because we still have to think about it.","source":"srt"},{"id":"t0033","start_s":404.82,"end_s":407.94,"speaker":null,"role":null,"text":"So actually, there's only a small head left for the right things.","source":"srt"},{"id":"t0034","start_s":407.94,"end_s":410.26,"speaker":null,"role":null,"text":"It doesn't matter, but we can take the shorter ones.","source":"srt"},{"id":"t0035","start_s":410.26,"end_s":412.26,"speaker":null,"role":null,"text":"We don't have to put them in that far.","source":"srt"},{"id":"t0036","start_s":413.7,"end_s":415.98,"speaker":null,"role":null,"text":"Just put the longer ones to the side, right?","source":"srt"},{"id":"t0037","start_s":415.98,"end_s":416.98,"speaker":null,"role":null,"text":"Okay.","source":"srt"},{"id":"t0038","start_s":418.82,"end_s":419.9,"speaker":null,"role":null,"text":"But that's nothing.","source":"srt"},{"id":"t0039","start_s":419.9,"end_s":424.38,"speaker":null,"role":null,"text":"Just make sure that we don't mix them up, that we give them back.","source":"srt"},{"id":"t0040","start_s":424.38,"end_s":426.38,"speaker":null,"role":null,"text":"That's the only thing, right?","source":"srt"},{"id":"t0041","start_s":426.38,"end_s":431.38,"speaker":null,"role":null,"text":"This is a Mako module for the hip.","source":"srt"},{"id":"t0042","start_s":431.38,"end_s":434.38,"speaker":null,"role":null,"text":"Mainly for the pan and shaft,","source":"srt"},{"id":"t0043","start_s":434.38,"end_s":437.38,"speaker":null,"role":null,"text":"you operate manually.","source":"srt"},{"id":"t0044","start_s":442.38,"end_s":445.38,"speaker":null,"role":null,"text":"I think the hip is a nice gimmick.","source":"srt"},{"id":"t0045","start_s":445.38,"end_s":448.38,"speaker":null,"role":null,"text":"You can pull it over.","source":"srt"},{"id":"t0046","start_s":448.38,"end_s":452.38,"speaker":null,"role":null,"text":"Especially when you operate in the back position,","source":"srt"},{"id":"t0047","start_s":452.38,"end_s":458.38,"speaker":null,"role":null,"text":"The Nogla for example does backrests and with robots.","source":"srt"},{"id":"t0048","start_s":458.38,"end_s":466.38,"speaker":null,"role":null,"text":"I think you can give yourself a present because I can place the implants almost as well without robots.","source":"srt"},{"id":"t0049","start_s":466.38,"end_s":469.38,"speaker":null,"role":null,"text":"Once in the upper middle, then I have the whole thing in the middle.","source":"srt"},{"id":"t0050","start_s":469.38,"end_s":471.38,"speaker":null,"role":null,"text":"No, it starts in the middle, straight.","source":"srt"},{"id":"t0051","start_s":471.38,"end_s":475.38,"speaker":null,"role":null,"text":"Then I also have a very high...","source":"srt"},{"id":"t0052","start_s":475.38,"end_s":479.38,"speaker":null,"role":null,"text":"Exactly, you have to adjust it so that the incisions are not too wide.","source":"srt"},{"id":"t0053","start_s":479.38,"end_s":483.38,"speaker":null,"role":null,"text":"The knee is also a bit more important than the knee.","source":"srt"},{"id":"t0054","start_s":483.38,"end_s":487.38,"speaker":null,"role":null,"text":"They take it with very thick legs.","source":"srt"},{"id":"t0055","start_s":487.38,"end_s":490.38,"speaker":null,"role":null,"text":"They operate more in the side position.","source":"srt"},{"id":"t0056","start_s":490.38,"end_s":493.38,"speaker":null,"role":null,"text":"And it's a bit more difficult, especially when they are so thick,","source":"srt"},{"id":"t0057","start_s":493.38,"end_s":497.38,"speaker":null,"role":null,"text":"to get the panning position right.","source":"srt"},{"id":"t0058","start_s":497.38,"end_s":501.38,"speaker":null,"role":null,"text":"And that's where it helps most.","source":"srt"},{"id":"t0059","start_s":501.38,"end_s":505.38,"speaker":null,"role":null,"text":"But it doesn't work quite as well as on the knee.","source":"srt"},{"id":"t0060","start_s":505.38,"end_s":508.38,"speaker":null,"role":null,"text":"You have to work on the accuracy.","source":"srt"},{"id":"t0061","start_s":509.38,"end_s":524.38,"speaker":null,"role":null,"text":"The first robot was originally for the hip, the RoboDoc, which then fell into disrepute.","source":"srt"},{"id":"t0062","start_s":524.38,"end_s":532.38,"speaker":null,"role":null,"text":"We made the access, then we pushed the button and then he milled the shaft.","source":"srt"},{"id":"t0063","start_s":532.38,"end_s":538.38,"speaker":null,"role":null,"text":"But of course he didn't take into account whether he was hanging somewhere in the software.","source":"srt"},{"id":"t0064","start_s":538.38,"end_s":542.38,"speaker":null,"role":null,"text":"And then he milled away a lot of softwares, partly.","source":"srt"},{"id":"t0065","start_s":542.38,"end_s":551.38,"speaker":null,"role":null,"text":"And on that basis, a knee variant was developed by the company.","source":"srt"},{"id":"t0066","start_s":551.38,"end_s":553.38,"speaker":null,"role":null,"text":"It was sold 5 times.","source":"srt"},{"id":"t0067","start_s":553.38,"end_s":555.38,"speaker":null,"role":null,"text":"But you can still buy it later.","source":"srt"},{"id":"t0068","start_s":555.38,"end_s":557.38,"speaker":null,"role":null,"text":"The technique is of course a bit more developed.","source":"srt"},{"id":"t0069","start_s":557.38,"end_s":561.38,"speaker":null,"role":null,"text":"But it is mainly used in Asia, in South Korea.","source":"srt"},{"id":"t0070","start_s":561.38,"end_s":567.38,"speaker":null,"role":null,"text":"There are some European brands, but no one is involved anymore.","source":"srt"},{"id":"t0071","start_s":569.38,"end_s":577.38,"speaker":null,"role":null,"text":"Because of course on the European market, the big American companies are trying to place their products.","source":"srt"},{"id":"t0072","start_s":577.38,"end_s":579.38,"speaker":null,"role":null,"text":"...or whatever they are called.","source":"srt"},{"id":"t0073","start_s":579.38,"end_s":581.38,"speaker":null,"role":null,"text":"And now, the drycat room...","source":"srt"},{"id":"t0074","start_s":582.38,"end_s":585.38,"speaker":null,"role":null,"text":"The robot should finally come.","source":"srt"},{"id":"t0075","start_s":590.38,"end_s":591.38,"speaker":null,"role":null,"text":"The Pew.","source":"srt"},{"id":"t0076","start_s":591.38,"end_s":593.38,"speaker":null,"role":null,"text":"That's the Pew.","source":"srt"},{"id":"t0077","start_s":593.38,"end_s":595.38,"speaker":null,"role":null,"text":"Written by the Pui.","source":"srt"},{"id":"t0078","start_s":599.38,"end_s":600.38,"speaker":null,"role":null,"text":"Who?","source":"srt"},{"id":"t0079","start_s":603.38,"end_s":604.38,"speaker":null,"role":null,"text":"No.","source":"srt"},{"id":"t0080","start_s":607.38,"end_s":609.38,"speaker":null,"role":null,"text":"Yes.","source":"srt"},{"id":"t0081","start_s":609.38,"end_s":611.38,"speaker":null,"role":null,"text":"That's fine.","source":"srt"},{"id":"t0082","start_s":622.38,"end_s":627.38,"speaker":null,"role":null,"text":"We have to distinguish a bit between this and a DaVinci.","source":"srt"},{"id":"t0083","start_s":627.38,"end_s":631.38,"speaker":null,"role":null,"text":"On the one hand, this is a bit of remote operating.","source":"srt"},{"id":"t0084","start_s":631.38,"end_s":633.38,"speaker":null,"role":null,"text":"We said size 4, right?","source":"srt"},{"id":"t0085","start_s":633.38,"end_s":638.38,"speaker":null,"role":null,"text":"...that the operator sits in one place and in the other...","source":"srt"},{"id":"t0086","start_s":638.38,"end_s":643.38,"speaker":null,"role":null,"text":"...that you can make the three circles smaller.","source":"srt"},{"id":"t0087","start_s":643.38,"end_s":645.38,"speaker":null,"role":null,"text":"But that works.","source":"srt"},{"id":"t0088","start_s":645.38,"end_s":648.38,"speaker":null,"role":null,"text":"That's a bit of a different principle.","source":"srt"},{"id":"t0089","start_s":648.38,"end_s":649.38,"speaker":null,"role":null,"text":"But it works.","source":"srt"},{"id":"t0090","start_s":649.38,"end_s":652.38,"speaker":null,"role":null,"text":"We cut exactly the same way.","source":"srt"},{"id":"t0091","start_s":652.38,"end_s":654.38,"speaker":null,"role":null,"text":"We have the best solution for the patient.","source":"srt"},{"id":"t0092","start_s":654.38,"end_s":660.38,"speaker":null,"role":null,"text":"And it's less about sitting somewhere on the laptop and operating with it.","source":"srt"},{"id":"t0093","start_s":660.38,"end_s":666.38,"speaker":null,"role":null,"text":"We are talking about precision, angle and implant position.","source":"srt"},{"id":"t0094","start_s":668.38,"end_s":672.38,"speaker":null,"role":null,"text":"No, no, you sit in this tax office and can do this.","source":"srt"},{"id":"t0095","start_s":673.38,"end_s":675.38,"speaker":null,"role":null,"text":"There are only error messages.","source":"srt"},{"id":"t0096","start_s":676.38,"end_s":680.38,"speaker":null,"role":null,"text":"You can do this a little more intensively than you normally can.","source":"srt"},{"id":"t0097","start_s":681.38,"end_s":683.38,"speaker":null,"role":null,"text":"I don't know, I can't judge it exactly.","source":"srt"},{"id":"t0098","start_s":683.38,"end_s":690.38,"speaker":null,"role":null,"text":"It's basically just an extended evening of the operator, if you will.","source":"srt"},{"id":"t0099","start_s":696.38,"end_s":698.38,"speaker":null,"role":null,"text":"That was the last time, right?","source":"srt"},{"id":"t0100","start_s":743.38,"end_s":745.38,"speaker":null,"role":null,"text":"Six implants.","source":"srt"},{"id":"t0101","start_s":746.38,"end_s":748.38,"speaker":null,"role":null,"text":"It's two sizes smaller.","source":"srt"},{"id":"t0102","start_s":750.38,"end_s":752.38,"speaker":null,"role":null,"text":"It's really four, right?","source":"srt"},{"id":"t0103","start_s":753.38,"end_s":755.38,"speaker":null,"role":null,"text":"I've already planned it.","source":"srt"},{"id":"t0104","start_s":755.38,"end_s":757.38,"speaker":null,"role":null,"text":"There will be a really nice stage.","source":"srt"},{"id":"t0105","start_s":759.38,"end_s":761.38,"speaker":null,"role":null,"text":"That's definitely something you shouldn't do.","source":"srt"},{"id":"t0106","start_s":761.38,"end_s":763.38,"speaker":null,"role":null,"text":"Okay, let's move on.","source":"srt"},{"id":"t0107","start_s":773.38,"end_s":779.38,"speaker":null,"role":null,"text":"I don't think there are any more exotic interventions.","source":"srt"},{"id":"t0108","start_s":779.38,"end_s":783.38,"speaker":null,"role":null,"text":"You have to think about what you want to do with your hands.","source":"srt"},{"id":"t0109","start_s":783.38,"end_s":791.38,"speaker":null,"role":null,"text":"It makes a lot of sense to operate with a robotic system.","source":"srt"},{"id":"t0110","start_s":791.38,"end_s":797.38,"speaker":null,"role":null,"text":"If there is an operation, like here on the laptop, that's the question.","source":"srt"},{"id":"t0111","start_s":797.38,"end_s":801.38,"speaker":null,"role":null,"text":"And that's how it is with Da Vinci at the moment.","source":"srt"},{"id":"t0112","start_s":808.38,"end_s":810.38,"speaker":null,"role":null,"text":"I missed something.","source":"srt"},{"id":"t0113","start_s":810.38,"end_s":813.38,"speaker":null,"role":null,"text":"It will have certain advantages.","source":"srt"},{"id":"t0114","start_s":813.38,"end_s":816.38,"speaker":null,"role":null,"text":"I'm waiting for him to stand on the edge again.","source":"srt"},{"id":"t0115","start_s":816.38,"end_s":822.38,"speaker":null,"role":null,"text":"The future is to have an extended arm and to operate telemedicine.","source":"srt"},{"id":"t0116","start_s":822.38,"end_s":826.38,"speaker":null,"role":null,"text":"I dare to doubt that.","source":"srt"},{"id":"t0117","start_s":826.38,"end_s":830.38,"speaker":null,"role":null,"text":"It looks like it's totally messed up.","source":"srt"},{"id":"t0118","start_s":830.38,"end_s":833.38,"speaker":null,"role":null,"text":"But I like it.","source":"srt"},{"id":"t0119","start_s":838.38,"end_s":841.38,"speaker":null,"role":null,"text":"Yeah, some kind of duality.","source":"srt"},{"id":"t0120","start_s":841.38,"end_s":845.38,"speaker":null,"role":null,"text":"But I don't really need it.","source":"srt"},{"id":"t0121","start_s":845.38,"end_s":849.38,"speaker":null,"role":null,"text":"I don't have to, like I said, I don't have to have the hair cut.","source":"srt"},{"id":"t0122","start_s":849.38,"end_s":853.38,"speaker":null,"role":null,"text":"I don't have to look into the vitreous all the time.","source":"srt"},{"id":"t0123","start_s":853.38,"end_s":857.38,"speaker":null,"role":null,"text":"You try to get used to it.","source":"srt"},{"id":"t0124","start_s":857.38,"end_s":863.38,"speaker":null,"role":null,"text":"In the beginning you look at the sitos and only look at the screen from time to time.","source":"srt"},{"id":"t0125","start_s":863.38,"end_s":871.38,"speaker":null,"role":null,"text":"But when you have implemented it in your workflow, you do it the other way around.","source":"srt"},{"id":"t0126","start_s":871.38,"end_s":877.38,"speaker":null,"role":null,"text":"Then you look at the screen and only look at the sitos in between.","source":"srt"},{"id":"t0127","start_s":877.38,"end_s":879.38,"speaker":null,"role":null,"text":"I think that's all in the green area.","source":"srt"},{"id":"t0128","start_s":879.38,"end_s":881.38,"speaker":null,"role":null,"text":"Yes, I think so too.","source":"srt"},{"id":"t0129","start_s":881.38,"end_s":886.38,"speaker":null,"role":null,"text":"But of course, there are some gimmicks with which you can make the whole thing a little cooler and more intuitive.","source":"srt"},{"id":"t0130","start_s":886.38,"end_s":890.38,"speaker":null,"role":null,"text":"And then it's really very, very good.","source":"srt"},{"id":"t0131","start_s":890.38,"end_s":892.38,"speaker":null,"role":null,"text":"I have to agree with you.","source":"srt"},{"id":"t0132","start_s":892.38,"end_s":894.38,"speaker":null,"role":null,"text":"I should probably do that too.","source":"srt"},{"id":"t0133","start_s":894.38,"end_s":911.98,"speaker":null,"role":null,"text":"I have less the technique itself, we can now first, otherwise, when you operate classically,","source":"srt"},{"id":"t0134","start_s":911.98,"end_s":915.7,"speaker":null,"role":null,"text":"you take it in your hand when the sample is in it, and say, yes, I think that's good,","source":"srt"},{"id":"t0135","start_s":915.7,"end_s":917.9,"speaker":null,"role":null,"text":"and so I leave it.","source":"srt"},{"id":"t0136","start_s":917.9,"end_s":922.1,"speaker":null,"role":null,"text":"Now we can do it even more similar, only that we don't do it now.","source":"srt"},{"id":"t0137","start_s":922.1,"end_s":927.1,"speaker":null,"role":null,"text":"I think that's good. But now we have quantitative data.","source":"srt"},{"id":"t0138","start_s":927.1,"end_s":934.1,"speaker":null,"role":null,"text":"But we don't really know yet what we should or can do with this quantitative data.","source":"srt"},{"id":"t0139","start_s":934.1,"end_s":941.1,"speaker":null,"role":null,"text":"I think the future lies in acquiring data.","source":"srt"},{"id":"t0140","start_s":941.1,"end_s":944.1,"speaker":null,"role":null,"text":"Of course, the technology is being refined.","source":"srt"},{"id":"t0141","start_s":944.1,"end_s":948.1,"speaker":null,"role":null,"text":"But the technical step is not the decisive one.","source":"srt"},{"id":"t0142","start_s":948.1,"end_s":950.1,"speaker":null,"role":null,"text":"because you can really do that well.","source":"srt"},{"id":"t0143","start_s":950.1,"end_s":952.1,"speaker":null,"role":null,"text":"Our circulator is also a man.","source":"srt"},{"id":"t0144","start_s":952.1,"end_s":957.1,"speaker":null,"role":null,"text":"And that we can then, based on the data we have collected over the years,","source":"srt"},{"id":"t0145","start_s":957.1,"end_s":961.1,"speaker":null,"role":null,"text":"really say, the patient needs this, the patient needs that.","source":"srt"},{"id":"t0146","start_s":961.1,"end_s":966.1,"speaker":null,"role":null,"text":"I think that's the next big leap.","source":"srt"},{"id":"t0147","start_s":966.1,"end_s":968.1,"speaker":null,"role":null,"text":"And less the technique itself.","source":"srt"},{"id":"t0148","start_s":968.1,"end_s":973.1,"speaker":null,"role":null,"text":"I don't know if you know exactly how the market is doing.","source":"srt"},{"id":"t0149","start_s":973.1,"end_s":977.1,"speaker":null,"role":null,"text":"No, no, less than with a patient.","source":"srt"},{"id":"t0150","start_s":977.1,"end_s":980.1,"speaker":null,"role":null,"text":"With a patient himself, it would be difficult to say.","source":"srt"},{"id":"t0151","start_s":980.1,"end_s":986.1,"speaker":null,"role":null,"text":"But you just know that with 1050 year olds,","source":"srt"},{"id":"t0152","start_s":986.1,"end_s":990.1,"speaker":null,"role":null,"text":"with the radiation of 6 degrees,","source":"srt"},{"id":"t0153","start_s":990.1,"end_s":996.1,"speaker":null,"role":null,"text":"the results are always better.","source":"srt"},{"id":"t0154","start_s":996.1,"end_s":998.1,"speaker":null,"role":null,"text":"I'll show you another way.","source":"srt"},{"id":"t0155","start_s":998.1,"end_s":1000.1,"speaker":null,"role":null,"text":"So you know exactly how to set it up.","source":"srt"},{"id":"t0156","start_s":1000.1,"end_s":1000.1,"speaker":null,"role":null,"text":"","source":"srt"},{"id":"t0157","start_s":1000.1,"end_s":1002.1,"speaker":null,"role":null,"text":"I'll show you another way.","source":"srt"},{"id":"t0158","start_s":1002.1,"end_s":1004.1,"speaker":null,"role":null,"text":"A Simstation.","source"
