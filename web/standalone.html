<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --surface-2:#EEF2F0;
  --ink:#132420; --ink-soft:#5A6C67; --ink-faint:#94A39D;
  --line:#DEE4E1; --line-strong:#C7D0CC;
  --accent:#0B6E63; --accent-ink:#08514A; --accent-wash:rgba(11,110,99,.09); --accent-line:rgba(11,110,99,.28);
  --ok:#2E7D5B; --watch:#A9761A; --alert:#B23B32;
  --r-surgeon:#0B6E63; --r-anesthesia:#8A5A1E; --r-circulating_nurse:#3C6FA0; --r-scrub_nurse:#6B4E9E; --r-assistant:#4A8C7C; --r-perfusionist:#B23B32; --r-other:#94A39D;
  --ph-cool:#7d8f96; --ph-mid:#9a8f6f; --ph-warm:#a8794f; --ph-close:#6f8a84;
  --shadow:0 1px 2px rgba(19,36,32,.05),0 6px 24px rgba(19,36,32,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1211; --surface:#131B19; --surface-2:#0F1615;
  --ink:#E4EBE8; --ink-soft:#8FA09A; --ink-faint:#5E6E68;
  --line:#26312E; --line-strong:#334039;
  --accent:#3FBFAE; --accent-ink:#6FD6C7; --accent-wash:rgba(63,191,174,.10); --accent-line:rgba(63,191,174,.30);
  --ok:#4FB489; --watch:#D0A24E; --alert:#E0716A;
  --r-surgeon:#3FBFAE; --r-anesthesia:#D0A24E; --r-circulating_nurse:#6FA6D8; --r-scrub_nurse:#A98BDA; --r-assistant:#63C7B4; --r-perfusionist:#E0716A; --r-other:#5E6E68;
  --ph-cool:#8794a0; --ph-mid:#a89a76; --ph-warm:#c08a5c; --ph-close:#7f9a94;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0C1211; --surface:#131B19; --surface-2:#0F1615;
  --ink:#E4EBE8; --ink-soft:#8FA09A; --ink-faint:#5E6E68;
  --line:#26312E; --line-strong:#334039;
  --accent:#3FBFAE; --accent-ink:#6FD6C7; --accent-wash:rgba(63,191,174,.10); --accent-line:rgba(63,191,174,.30);
  --ok:#4FB489; --watch:#D0A24E; --alert:#E0716A;
  --r-surgeon:#3FBFAE; --r-anesthesia:#D0A24E; --r-circulating_nurse:#6FA6D8; --r-scrub_nurse:#A98BDA; --r-assistant:#63C7B4; --r-perfusionist:#E0716A; --r-other:#5E6E68;
  --ph-cool:#8794a0; --ph-mid:#a89a76; --ph-warm:#c08a5c; --ph-close:#7f9a94;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:var(--accent-wash)}

/* ---- shell ---- */
.app{display:flex;flex-direction:column;height:100vh}
.bar{
  display:flex;align-items:center;gap:18px;padding:0 16px;height:52px;
  border-bottom:1px solid var(--line);background:var(--surface);flex:none;
}
.mark{display:flex;align-items:baseline;gap:9px}
.mark b{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:-.01em}
.mark span{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.bar .sel{flex:none}
.bar .spacer{flex:1}
select,.pill{
  font-family:var(--mono);font-size:12px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;appearance:none;cursor:pointer;
}
select{padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--ink-soft)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}

.cols{flex:1;display:grid;grid-template-columns:26fr 40fr 34fr;min-height:0}
.col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.col:last-child{border-right:none}
.col-head{
  flex:none;padding:11px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);
}
.col-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.col-body::-webkit-scrollbar{width:9px}
.col-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;border:2px solid var(--surface)}

/* ---- transcript ---- */
.legend{display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line)}
.rchip{
  font-family:var(--mono);font-size:10px;letter-spacing:.02em;padding:3px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-soft);display:flex;align-items:center;gap:5px;
}
.rchip .dot{width:7px;height:7px;border-radius:50%}
.rchip[aria-pressed="true"]{border-color:var(--accent-line);color:var(--ink);background:var(--accent-wash)}
.rchip.off{opacity:.35}
.search{margin:9px 12px;width:calc(100% - 24px);font-family:var(--mono);font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink)}
.turns{padding:4px 0 40px}
.turn{
  display:grid;grid-template-columns:52px 3px 1fr;gap:9px;padding:6px 14px 6px 12px;
  font-family:var(--mono);font-size:12px;line-height:1.55;cursor:default;
  border-left:2px solid transparent;transition:background .12s;
}
.turn:hover{background:var(--surface-2)}
.turn.hot{background:var(--accent-wash);border-left-color:var(--accent)}
.turn.dim{opacity:.32}
.turn .t{color:var(--ink-faint);font-size:10.5px;padding-top:2px}
.turn .spine{border-radius:2px;background:var(--r-other)}
.turn .body .who{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:1px}
.turn .body .tx{color:var(--ink)}

/* ---- timeline ---- */
.transport{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex:none}
.play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink);background:var(--surface-2)}
.play:hover{border-color:var(--accent);color:var(--accent)}
.scrub{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;cursor:pointer}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.scrub .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.tclock{font-family:var(--mono);font-size:11px;color:var(--ink-soft);min-width:58px;text-align:right}
.tl-wrap{flex:1;overflow-y:auto;position:relative}
.tl{position:relative;margin:16px 0 60px}
.tl-axis{position:absolute;left:96px;top:0;bottom:0;width:2px;background:var(--line)}
.phase{position:absolute;left:0;width:88px;padding-right:8px;text-align:right}
.phase .bar{position:absolute;right:-9px;top:0;bottom:0;width:6px;border-radius:3px;opacity:.5}
.phase .nm{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);position:sticky;top:6px}
.ev{position:absolute;left:104px;right:12px;display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:7px;cursor:pointer;transition:background .12s,transform .12s;transform-origin:left center}
.ev:hover{background:var(--surface-2)}
.ev.hot{background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent-line)}
.ev.future{opacity:.28}
.ev .node{margin-top:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--surface)}
.ev .node.lowconf{background:transparent;border:1.5px solid var(--accent)}
.ev .meta{min-width:0}
.ev .ty{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--ink-soft);text-transform:uppercase}
.ev .pl{font-family:var(--mono);font-size:11.5px;color:var(--ink);word-break:break-word;line-height:1.45}
.ev .role{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.tl-playhead{position:absolute;left:60px;right:0;height:0;border-top:1px dashed var(--accent);pointer-events:none;z-index:5}
.tl-playhead::after{content:"";position:absolute;left:36px;top:-3px;width:6px;height:6px;background:var(--accent);border-radius:50%}
.tl-empty{padding:60px 30px;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:12px;line-height:1.7}

/* ---- state + docs ---- */
.board{padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.board .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;transition:border-color .12s,background .12s}
.stat:hover{border-color:var(--line-strong);background:var(--surface-2)}
.stat.hot{border-color:var(--accent-line);background:var(--accent-wash)}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v{font-family:var(--mono);font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.35;word-break:break-word}
.stat.ghost .v{color:var(--ink-faint);font-style:italic}
.sev{display:inline-flex;align-items:center;gap:6px}
.sev .d{width:8px;height:8px;border-radius:50%}
.sev.stable .d{background:var(--ok)} .sev.watcher .d{background:var(--watch)} .sev.unstable .d{background:var(--alert)}

.docs{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:9px 14px 0;border-bottom:1px solid var(--line);flex:none}
.tab{
  font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:7px 11px;border-radius:7px 7px 0 0;
  color:var(--ink-soft);border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px;
}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--line);background:var(--surface);position:relative;top:1px}
.tab .fmt{font-size:9px;color:var(--ink-faint)}
.badge{font-size:9px;letter-spacing:.04em;padding:2px 5px;border-radius:4px;text-transform:uppercase}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.badge.flag{color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,transparent)}
.doc{flex:1;overflow-y:auto;padding:18px 22px 60px;font-family:var(--serif);font-size:15px;line-height:1.68;color:var(--ink)}
.doc h4{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:16px 0 4px}
.doc p{margin:0 0 10px;white-space:pre-wrap}
.doc .lk{border-bottom:1px solid var(--accent-line);cursor:pointer;transition:background .12s}
.doc .lk:hover,.doc .lk.hot{background:var(--accent-wash)}
.doc .flags{font-family:var(--sans);font-size:12px;color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,transparent);border:1px solid color-mix(in srgb,var(--alert) 25%,transparent);border-radius:8px;padding:9px 11px;margin-bottom:14px}
.doc .flags li{margin-left:16px}
.doc.empty{color:var(--ink-faint);font-family:var(--mono);font-size:12px;font-style:normal}

.loading{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);z-index:50}
.hint{padding:7px 14px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);border-top:1px solid var(--line);background:var(--surface);flex:none;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1100px){.cols{grid-template-columns:1fr}.col{border-right:none;border-bottom:1px solid var(--line);max-height:70vh}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header class="bar">
    <div class="mark"><b>Procedural Intelligence</b><span>OR &rarr; source of truth</span></div>
    <select id="caseSel" class="sel" aria-label="Case"></select>
    <select id="profSel" class="sel" aria-label="Site profile"></select>
    <div class="spacer"></div>
    <span class="lbl" id="srcInfo"></span>
    <button class="iconbtn" id="replayBtn" title="Replay reconstruction" aria-label="Replay">&#9654;</button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">&#9681;</button>
  </header>

  <div class="cols">
    <!-- transcript -->
    <section class="col" aria-label="Transcript">
      <div class="col-head"><span class="lbl">Transcript</span><span class="lbl mono" id="turnCount"></span></div>
      <div id="legend" class="legend"></div>
      <input id="search" class="search" placeholder="filter transcript&hellip;" />
      <div class="col-body"><div id="turns" class="turns"></div></div>
    </section>

    <!-- timeline -->
    <section class="col" aria-label="Procedural timeline">
      <div class="col-head"><span class="lbl">Procedural timeline</span><span class="lbl mono" id="evCount"></span></div>
      <div class="transport">
        <button class="play" id="playBtn" aria-label="Play">&#9654;</button>
        <div class="scrub" id="scrub"><div class="fill" id="scrubFill"></div><div class="knob" id="scrubKnob"></div></div>
        <span class="tclock tnum" id="transClock">00:00</span>
      </div>
      <div class="tl-wrap" id="tlWrap"><div class="tl" id="tl"></div></div>
    </section>

    <!-- state + docs -->
    <section class="col" aria-label="Case state and documents">
      <div class="board">
        <span class="lbl">Case state <span id="asOf" class="mono" style="color:var(--ink-faint)"></span></span>
        <div class="grid" id="board"></div>
      </div>
      <div class="docs">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="doc" id="doc" role="tabpanel"></div>
      </div>
    </section>
  </div>
  <div class="hint" id="hint">Hover an event to trace it to the transcript &amp; documents &nbsp;&middot;&nbsp; drag the playhead to replay the case state</div>
</div>
<div class="loading" id="loading">reconstructing&hellip;</div>

<script id="bundle" type="application/json">{"case01_lapchole": {"case_id": "case01_lapchole", "source": "case01_lapchole.srt", "profile": {"id": "default_or", "label": "Generic operating room (US)", "care_setting": "operating_room", "phases": ["arrival", "setup", "timeout", "induction", "positioning_prep", "incision", "dissection", "key_procedure", "closure", "emergence", "handoff"], "handoff_name": "I-PASS"}, "context": {"patient_descriptor": "54-year-old", "planned_procedure": "laparoscopic cholecystectomy", "indication": "acute cholecystitis", "anesthesia_type": "general endotracheal", "evidence_turn_ids": ["t0001", "t0002"]}, "turns": [{"id": "t0001", "start_s": 12.0, "end_s": 18.0, "speaker": "CIRCULATOR", "role": "circulating_nurse", "text": "Room's ready. Patient is a 54-year-old for laparoscopic cholecystectomy, acute cholecystitis.", "source": "srt"}, {"id": "t0002", "start_s": 65.0, "end_s": 74.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Pre-oxygenating now. Plan is general endotracheal, propofol and rocuronium for induction.", "source": "srt"}, {"id": "t0003", "start_s": 220.0, "end_s": 226.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Induction complete, tube's in, good bilateral breath sounds. Second IV placed in the left forearm.", "source": "srt"}, {"id": "t0004", "start_s": 330.0, "end_s": 352.0, "speaker": "SURGEON", "role": "surgeon", "text": "Let's do our time out. Confirming patient, laparoscopic cholecystectomy, possible conversion to open, consent signed, antibiotics given?", "source": "srt"}, {"id": "t0005", "start_s": 352.0, "end_s": 357.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Cefazolin two grams IV went in about ten minutes ago.", "source": "srt"}, {"id": "t0006", "start_s": 370.0, "end_s": 374.0, "speaker": "SURGEON", "role": "surgeon", "text": "Great. Everyone agree? Time out complete.", "source": "srt"}, {"id": "t0007", "start_s": 500.0, "end_s": 507.0, "speaker": "SURGEON", "role": "surgeon", "text": "Prepped and draped. Making the infraumbilical incision now for the Veress needle.", "source": "srt"}, {"id": "t0008", "start_s": 555.0, "end_s": 560.0, "speaker": "SURGEON", "role": "surgeon", "text": "Insufflating. Pressures look good, fifteen millimeters of mercury. Placing the ports.", "source": "srt"}, {"id": "t0009", "start_s": 720.0, "end_s": 730.0, "speaker": "SURGEON", "role": "surgeon", "text": "Camera's in. There's a lot of inflammation around the gallbladder, omentum is stuck to it. Adhesions are dense.", "source": "srt"}, {"id": "t0010", "start_s": 930.0, "end_s": 938.0, "speaker": "SURGEON", "role": "surgeon", "text": "Taking down the adhesions. The tissue planes are really hard to see here.", "source": "srt"}, {"id": "t0011", "start_s": 1185.0, "end_s": 1195.0, "speaker": "SURGEON", "role": "surgeon", "text": "I'm having trouble getting a critical view of safety. The anatomy at the triangle is completely obscured.", "source": "srt"}, {"id": "t0012", "start_s": 1330.0, "end_s": 1339.0, "speaker": "SURGEON", "role": "surgeon", "text": "There's bleeding from the liver bed, more than I'd like. Suction please. Estimate maybe 150 mils so far.", "source": "srt"}, {"id": "t0013", "start_s": 1440.0, "end_s": 1452.0, "speaker": "SURGEON", "role": "surgeon", "text": "I'm not comfortable continuing laparoscopically. We're going to convert to open. Let's get the open tray.", "source": "srt"}, {"id": "t0014", "start_s": 1470.0, "end_s": 1475.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Copy, converting to open. Patient's stable, heart rate 88, pressure 120 over 70.", "source": "srt"}, {"id": "t0015", "start_s": 1620.0, "end_s": 1628.0, "speaker": "SURGEON", "role": "surgeon", "text": "Making a right subcostal incision. Extending it now.", "source": "srt"}, {"id": "t0016", "start_s": 1935.0, "end_s": 1945.0, "speaker": "SURGEON", "role": "surgeon", "text": "Better exposure now. I can see the cystic duct and artery clearly. Getting my critical view.", "source": "srt"}, {"id": "t0017", "start_s": 2200.0, "end_s": 2208.0, "speaker": "SURGEON", "role": "surgeon", "text": "Clipping the cystic artery. And the cystic duct, two clips proximal, one distal. Dividing.", "source": "srt"}, {"id": "t0018", "start_s": 2340.0, "end_s": 2347.0, "speaker": "SURGEON", "role": "surgeon", "text": "Taking the gallbladder off the liver bed with the cautery.", "source": "srt"}, {"id": "t0019", "start_s": 2480.0, "end_s": 2488.0, "speaker": "SURGEON", "role": "surgeon", "text": "Gallbladder is out. It's going to pathology. Send it as gallbladder, acute cholecystitis.", "source": "srt"}, {"id": "t0020", "start_s": 2550.0, "end_s": 2560.0, "speaker": "SURGEON", "role": "surgeon", "text": "More oozing from the liver bed. Let's put some hemostatic agent on it and pack it for a few minutes.", "source": "srt"}, {"id": "t0021", "start_s": 2760.0, "end_s": 2769.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Blood pressure dipped to 92 over 55. Giving a fluid bolus. Heart rate's up to 104.", "source": "srt"}, {"id": "t0022", "start_s": 2910.0, "end_s": 2920.0, "speaker": "SURGEON", "role": "surgeon", "text": "Bleeding's controlled now. Total blood loss I'd estimate around 400 mils.", "source": "srt"}, {"id": "t0023", "start_s": 2950.0, "end_s": 2958.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Pressure came back up to 118 over 68 after the liter of crystalloid. No transfusion needed.", "source": "srt"}, {"id": "t0024", "start_s": 3120.0, "end_s": 3128.0, "speaker": "SURGEON", "role": "surgeon", "text": "Placing a Jackson-Pratt drain in the gallbladder fossa, bringing it out the lateral port site.", "source": "srt"}, {"id": "t0025", "start_s": 3345.0, "end_s": 3353.0, "speaker": "CIRCULATOR", "role": "circulating_nurse", "text": "Instrument, sponge, and needle counts are correct times two.", "source": "srt"}, {"id": "t0026", "start_s": 3390.0, "end_s": 3397.0, "speaker": "SURGEON", "role": "surgeon", "text": "Closing the fascia with looped PDS. Skin with staples.", "source": "srt"}, {"id": "t0027", "start_s": 3720.0, "end_s": 3730.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "Reversing paralysis. Patient breathing spontaneously, extubated, moving all four extremities.", "source": "srt"}, {"id": "t0028", "start_s": 3870.0, "end_s": 3882.0, "speaker": "SURGEON", "role": "surgeon", "text": "For handoff: converted lap chole to open, difficult anatomy, EBL 400, one JP drain in the fossa. No transfusion.", "source": "srt"}, {"id": "t0029", "start_s": 3900.0, "end_s": 3912.0, "speaker": "ANESTHESIA", "role": "anesthesia", "text": "He'll go to the PACU first, then I want him admitted overnight for pain control and to watch the drain output.", "source": "srt"}, {"id": "t0030", "start_s": 3930.0, "end_s": 3938.0, "speaker": "SURGEON", "role": "surgeon", "text": "Agree, floor admission after PACU. I'll update the family now.", "source": "srt"}], "events": [{"id": "e000", "t_start_s": 12.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "arrival"}, "evidence_turn_ids": ["t0001"], "by_role": "circulating_nurse", "confidence": 0.95, "extractor": "llm"}, {"id": "e001", "t_start_s": 65.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "induction"}, "evidence_turn_ids": ["t0002", "t0003"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}, {"id": "e002", "t_start_s": 220.0, "t_end_s": null, "type": "line_placed", "payload": {"type": "IV", "site": "left forearm"}, "evidence_turn_ids": ["t0003"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}, {"id": "e003", "t_start_s": 330.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "timeout"}, "evidence_turn_ids": ["t0004"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e004", "t_start_s": 352.0, "t_end_s": null, "type": "medication_given", "payload": {"name": "Cefazolin", "dose": "2g", "route": "IV"}, "evidence_turn_ids": ["t0005"], "by_role": "anesthesia", "confidence": 0.98, "extractor": "llm"}, {"id": "e005", "t_start_s": 352.0, "t_end_s": null, "type": "medication_given", "payload": {"name": "cefazolin", "dose": "2 g", "route": "IV"}, "evidence_turn_ids": ["t0005"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}, {"id": "e006", "t_start_s": 500.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "incision"}, "evidence_turn_ids": ["t0007"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e007", "t_start_s": 500.0, "t_end_s": null, "type": "incision", "payload": {"site": "infraumbilical"}, "evidence_turn_ids": ["t0007"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e008", "t_start_s": 720.0, "t_end_s": null, "type": "complication", "payload": {"description": "Dense adhesions and inflammation obscuring anatomy, making critical view of safety difficult", "resolved": true}, "evidence_turn_ids": ["t0009", "t0010", "t0011"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e009", "t_start_s": 720.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "dissection"}, "evidence_turn_ids": ["t0009"], "by_role": "surgeon", "confidence": 0.9, "extractor": "llm"}, {"id": "e010", "t_start_s": 1330.0, "t_end_s": null, "type": "blood_loss", "payload": {"ebl_ml": 150}, "evidence_turn_ids": ["t0012"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e011", "t_start_s": 1440.0, "t_end_s": null, "type": "conversion", "payload": {"from": "laparoscopic", "to": "open"}, "evidence_turn_ids": ["t0013"], "by_role": "surgeon", "confidence": 0.98, "extractor": "llm"}, {"id": "e012", "t_start_s": 1620.0, "t_end_s": null, "type": "incision", "payload": {"site": "right subcostal"}, "evidence_turn_ids": ["t0015"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e013", "t_start_s": 1935.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "key_procedure"}, "evidence_turn_ids": ["t0016"], "by_role": "surgeon", "confidence": 0.9, "extractor": "llm"}, {"id": "e014", "t_start_s": 2480.0, "t_end_s": null, "type": "specimen", "payload": {"description": "Gallbladder, acute cholecystitis"}, "evidence_turn_ids": ["t0019"], "by_role": "surgeon", "confidence": 0.98, "extractor": "llm"}, {"id": "e015", "t_start_s": 2550.0, "t_end_s": null, "type": "complication", "payload": {"description": "Oozing from liver bed", "resolved": true}, "evidence_turn_ids": ["t0020"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e016", "t_start_s": 2760.0, "t_end_s": null, "type": "hemodynamic_event", "payload": {"description": "Hypotension (BP 92/55) and tachycardia (HR 104)"}, "evidence_turn_ids": ["t0021"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}, {"id": "e017", "t_start_s": 2760.0, "t_end_s": null, "type": "medication_given", "payload": {"name": "Crystalloid", "dose": "1L", "route": "IV"}, "evidence_turn_ids": ["t0021", "t0023"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}, {"id": "e018", "t_start_s": 2910.0, "t_end_s": null, "type": "blood_loss", "payload": {"ebl_ml": 400}, "evidence_turn_ids": ["t0022"], "by_role": "surgeon", "confidence": 0.98, "extractor": "llm"}, {"id": "e019", "t_start_s": 3120.0, "t_end_s": null, "type": "drain_placed", "payload": {"type": "Jackson-Pratt", "site": "gallbladder fossa"}, "evidence_turn_ids": ["t0024"], "by_role": "surgeon", "confidence": 0.98, "extractor": "llm"}, {"id": "e020", "t_start_s": 3345.0, "t_end_s": null, "type": "count_status", "payload": {"status": "correct", "detail": "Instrument, sponge, and needle counts correct times two"}, "evidence_turn_ids": ["t0025"], "by_role": "circulating_nurse", "confidence": 0.98, "extractor": "llm"}, {"id": "e021", "t_start_s": 3390.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "closure"}, "evidence_turn_ids": ["t0026"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e022", "t_start_s": 3720.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "emergence"}, "evidence_turn_ids": ["t0027"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}, {"id": "e023", "t_start_s": 3870.0, "t_end_s": null, "type": "phase_transition", "payload": {"phase": "handoff"}, "evidence_turn_ids": ["t0028"], "by_role": "surgeon", "confidence": 0.95, "extractor": "llm"}, {"id": "e024", "t_start_s": 3900.0, "t_end_s": null, "type": "disposition", "payload": {"destination": "PACU", "detail": "Then admitted to floor overnight for pain control and drain monitoring"}, "evidence_turn_ids": ["t0029", "t0030"], "by_role": "anesthesia", "confidence": 0.95, "extractor": "llm"}], "states": [], "drafts": {}, "links": {}, "run_log": [{"t_wall": 1788068148.2763479, "agent": "transcript", "message": "parsed 30 turns from case01_lapchole.srt"}, {"t_wall": 1788068148.27909, "agent": "roles", "message": "roles: {'circulating_nurse': 2, 'anesthesia': 8, 'surgeon': 20}"}, {"t_wall": 1788068153.326676, "agent": "context", "message": "groq:qwen/qwen3.8-27b: {'patient_descriptor': '54-year-old', 'planned_procedure': 'laparoscopic cholecystectomy', 'indication': 'acute cholecystitis', 'anesthesia_type': 'general endotracheal', 'evidence_turn_ids': ['t0001', 't0002']}"}, {"t_wall": 1788068231.251209, "agent": "events", "message": "groq:qwen/qwen3.8-27b: 1 windows + 1 sweep -> 40 raw -> 25 events (profile=default_or)"}]}, "case03_trauma_exlap": {"case_id": "case03_trauma_exlap", "source": "case03_trauma_exlap.srt", "profile": {"id": "default_or", "label": "Generic operating room (US)", "care_setting": "operating_room", "phases": ["arrival", "setup", "timeout", "induction", "positioning_prep", "incision", "dissection", "key_procedure", "closure", "emergence", "handoff"], "handoff_name": "I-PASS"}, "context": {"patient_descriptor": "27-year-old", "planned_procedure": "exploratory laparotomy", "indication": "high-speed MVC, hypotensive", "anesthesia_type": "rapid sequence induction", "evidence_turn_ids": ["t0001", "t0002"]}, "turns": [{"id": "t0001", "start_s": 15.0, "end_s": 24.0, "speaker": "CIRCULATOR", "role": null, "text": "Trauma activation. 27-year-old, high-speed MVC, hypotensive in the bay, going straight to ex-lap.", "source": "srt"}, {"id": "t0002", "start_s": 70.0, "end_s": 79.0, "speaker": "ANESTHESIA", "role": null, "text": "Rapid sequence induction, etomidate and succinylcholine. Tube confirmed. Two large-bore IVs, starting the rapid transfuser.", "source": "srt"}, {"id": "t0003", "start_s": 150.0, "end_s": 158.0, "speaker": "ANESTHESIA", "role": null, "text": "Pressure is 74 over 40, heart rate 130. Activating massive transfusion protocol. Hanging PRBC and FFP now.", "source": "srt"}, {"id": "t0004", "start_s": 180.0, "end_s": 185.0, "speaker": "SURGEON", "role": null, "text": "No time for a formal time out. Prepping and draping. Betadine, wide.", "source": "srt"}, {"id": "t0005", "start_s": 220.0, "end_s": 228.0, "speaker": "SURGEON", "role": null, "text": "Midline laparotomy from xiphoid to pubis. Lots of blood in the abdomen. Suction, and get me packs.", "source": "srt"}, {"id": "t0006", "start_s": 270.0, "end_s": 278.0, "speaker": "SURGEON", "role": null, "text": "Packing all four quadrants. The bleeding is coming from the left upper quadrant, I think the spleen.", "source": "srt"}, {"id": "t0007", "start_s": 360.0, "end_s": 369.0, "speaker": "ANESTHESIA", "role": null, "text": "Still hypotensive, 68 systolic. Giving another 2 units red cells and 2 FFP. Started norepinephrine.", "source": "srt"}, {"id": "t0008", "start_s": 500.0, "end_s": 510.0, "speaker": "SURGEON", "role": null, "text": "The spleen is shattered. Doing a splenectomy. Clamping the hilum now. Dividing the short gastrics.", "source": "srt"}, {"id": "t0009", "start_s": 660.0, "end_s": 668.0, "speaker": "SURGEON", "role": null, "text": "Spleen is out. That was the main source. Pressure should start coming up.", "source": "srt"}, {"id": "t0010", "start_s": 750.0, "end_s": 759.0, "speaker": "ANESTHESIA", "role": null, "text": "Coming up now, 95 over 55 on a little norepi. We've given 6 units red cells, 4 FFP, 1 platelets so far.", "source": "srt"}, {"id": "t0011", "start_s": 900.0, "end_s": 910.0, "speaker": "SURGEON", "role": null, "text": "Now running the bowel. There's a segment of small bowel with a mesenteric tear and it looks non-viable, about 20 centimeters.", "source": "srt"}, {"id": "t0012", "start_s": 1125.0, "end_s": 1135.0, "speaker": "SURGEON", "role": null, "text": "Resecting that segment. Stapling across proximal and distal. Leaving it in discontinuity for now.", "source": "srt"}, {"id": "t0013", "start_s": 1320.0, "end_s": 1330.0, "speaker": "SURGEON", "role": null, "text": "Rest of the bowel looks okay. Liver is intact. No other major injuries that I can see.", "source": "srt"}, {"id": "t0014", "start_s": 1470.0, "end_s": 1480.0, "speaker": "SURGEON", "role": null, "text": "Patient's still cold and coagulopathic. We're going to do damage control. Temporary abdominal closure with a wound vac.", "source": "srt"}, {"id": "t0015", "start_s": 1560.0, "end_s": 1568.0, "speaker": "SURGEON", "role": null, "text": "Leaving packs in the pelvis and the left upper quadrant. Abdomen stays open.", "source": "srt"}, {"id": "t0016", "start_s": 1650.0, "end_s": 1658.0, "speaker": "CIRCULATOR", "role": null, "text": "Counts are intentionally incorrect. Documenting: 4 laparotomy pads retained on purpose for damage control, plus the packs.", "source": "srt"}, {"id": "t0017", "start_s": 1740.0, "end_s": 1750.0, "speaker": "ANESTHESIA", "role": null, "text": "EBL is hard to estimate, at least 3 liters. Total given: 8 red cells, 6 FFP, 2 platelets, 1 cryo.", "source": "srt"}, {"id": "t0018", "start_s": 1815.0, "end_s": 1824.0, "speaker": "SURGEON", "role": null, "text": "For handoff: damage control laparotomy, splenectomy, small bowel resection in discontinui  {"id": "t0006", "start_s": 550.0, "end_s": 558.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Right coronary is clean. LAD is the culprit. We'll proceed to intervention on the mid LAD.", "source": "srt"}, {"id": "t0007", "start_s": 660.0, "end_s": 668.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Wire is across the lesion. Pre-dilating with a 2.5 balloon.", "source": "srt"}, {"id": "t0008", "start_s": 825.0, "end_s": 835.0, "speaker": "CARDIOLOGIST", "role": null, "text": "The patient is having some chest pain and the pressure dropped to 95 systolic during the balloon inflation. Deflating now.", "source": "srt"}, {"id": "t0009", "start_s": 870.0, "end_s": 878.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Pressure recovered to 120. Pain settling. That was transient balloon-occlusion ischemia, expected.", "source": "srt"}, {"id": "t0010", "start_s": 980.0, "end_s": 990.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Deploying a 3.0 by 18 millimeter drug-eluting stent in the mid LAD. Good angiographic result, TIMI 3 flow.", "source": "srt"}, {"id": "t0011", "start_s": 1140.0, "end_s": 1148.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Post-dilating with a 3.5 non-compliant balloon. No dissection, no residual stenosis.", "source": "srt"}, {"id": "t0012", "start_s": 1290.0, "end_s": 1300.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Total contrast used is about 140 mils. Fluoroscopy time 12 minutes. Blood loss minimal.", "source": "srt"}, {"id": "t0013", "start_s": 1380.0, "end_s": 1388.0, "speaker": "CARDIOLOGIST", "role": null, "text": "Sheath is out. Radial band on for hemostasis. Distal pulse is good, hand is pink and warm.", "source": "srt"}, {"id": "t0014", "start_s": 1510.0, "end_s": 1520.0, "speaker": "CARDIOLOGIST", "role": null, "text": "For handoff: successful PCI to mid LAD with one drug-eluting stent. Transient hypotension during ballooning, resolved. Radial access, band in place.", "source": "srt"}, {"id": "t0015", "s <script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const clock = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), ss = s%60; const h = Math.floor(m/60);
  return h ? `${h}:${String(m%60).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; };
const ROLE_LABEL = { surgeon:'surgeon', anesthesia:'anesthesia', circulating_nurse:'circ. nurse', scrub_nurse:'scrub nurse', assistant:'assistant', perfusionist:'perfusion', other:'other' };
const EV_LABEL = { phase_transition:'phase', medication_given:'medication', incision:'incision', conversion:'conversion', implant_placed:'implant', line_placed:'line', drain_placed:'drain', device_step:'device', blood_loss:'blood loss', hemodynamic_event:'hemodynamic', transfusion:'transfusion', count_status:'count', specimen:'specimen', complication:'complication', equipment_issue:'equipment', personnel_change:'personnel', disposition:'disposition' };

const PI = { cases:{}, id:null, D:null, playT:1e9, dur:1, hotEv:new Set(), hotTurn:new Set(), tab:'handoff', roleOff:new Set(), q:'', playing:false, raf:0 };

/* ---------- data loading ---------- */
async function boot(){
  let bundle = {};
  try { bundle = JSON.parse($('#bundle').textContent) || {}; } catch(e){}
  let live = [];
  try {
    const r = await fetch('/api/cases');
    if (r.ok) live = await r.json();
  } catch(e){}
  PI.live = live.length > 0;
  if (PI.live){
    for (const c of live) PI.cases[c.case_id] = null; // lazy
  } else {
    PI.cases = bundle;
  }
  const ids = Object.keys(PI.cases);
  if (!ids.length){ $('#loading').textContent = 'no cases'; return; }
  buildProfileSelect();
  const sel = $('#caseSel');
  ids.forEach(id => sel.append(new Option(id, id)));
  sel.onchange = () => loadCase(sel.value);
  await loadCase(ids[0]);
  $('#loading').hidden = true; $('#app').hidden = false;
  wire();
  replay();
}

async function loadCase(id){
  PI.id = id;
  let D = PI.cases[id];
  if (!D){
    const r = await fetch('/api/cases/' + id);
    D = await r.json();
    PI.cases[id] = D;
  }
  PI.D = D;
  PI.dur = Math.max(1, ...D.events.map(e => e.t_start_s), ...D.turns.map(t => t.end_s)) + 20;
  PI.playT = 1e9; PI.tab = D.drafts.handoff ? 'handoff' : Object.keys(D.drafts)[0];
  PI.roleOff.clear();
  $('#caseSel').value = id;
  $('#profSel').value = D.profile.id;
  $('#srcInfo').textContent = D.source ? ('src: ' + D.source) : '';
  renderAll();
}

function buildProfileSelect(){
  const ps = $('#profSel');
  ['default_or','uk_or','cath_lab','mmor_robotic'].forEach(p => ps.append(new Option(p, p)));
  ps.onchange = () => {
    if (!PI.live){ ps.value = PI.D.profile.id; flash('profile switching needs the local server — run `pi serve`'); return; }
    rerunWithProfile(ps.value);
  };
}
async function rerunWithProfile(p){
  flash('re-running ' + PI.id + ' with ' + p + '…');
  const src = PI.D.source;
  // requires the server to have the original upload; fall back to a message
  flash('use: pi run <file> --profile ' + p);
}
function flash(msg){ const h = $('#hint'); h.textContent = msg; setTimeout(() => h.textContent = h.dataset.def, 3200); }

/* ---------- render ---------- */
function renderAll(){ renderLegend(); renderTurns(); renderTimeline(); renderBoard(); renderTabs(); renderDoc(); positionPlayhead(); }

function stateAt(t){
  const ss = PI.D.states;
  if (!ss.length) return {};
  let cur = ss[0];
  for (const s of ss) if (s.as_of_s <= t) cur = s; else break;
  return cur;
}
function evActive(e){ return e.t_start_s <= PI.playT; }

function renderLegend(){
  const box = $('#legend'); box.innerHTML = '';
  const roles = [...new Set(PI.D.turns.map(t => t.role).filter(Boolean))];
  if (!roles.length){ box.append(el('span','lbl','no speaker roles (transcription without diarization)')); return; }
  roles.forEach(r => {
    const c = el('button', 'rchip' + (PI.roleOff.has(r) ? ' off' : ''));
    c.setAttribute('aria-pressed', String(!PI.roleOff.has(r)));
    const d = el('span','dot'); d.style.background = `var(--r-${r})`;
    c.append(d, document.createTextNode(ROLE_LABEL[r] || r));
    c.onclick = () => { PI.roleOff.has(r) ? PI.roleOff.delete(r) : PI.roleOff.add(r); renderLegend(); renderTurns(); };
    box.append(c);
  });
}

function renderTurns(){
  const box = $('#turns'); box.innerHTML = '';
  $('#turnCount').textContent = PI.D.turns.length + ' turns';
  PI.D.turns.forEach(t => {
    const hidden = (t.role && PI.roleOff.has(t.role)) || (PI.q && !t.text.toLowerCase().includes(PI.q));
    if (hidden) return;
    const row = el('div', 'turn');
    row.dataset.id = t.id;
    if (PI.hotTurn.has(t.id)) row.classList.add('hot');
    if (PI.hotTurn.size && !PI.hotTurn.has(t.id)) row.classList.add('dim');
    const spine = el('div','spine');
    if (t.role) spine.style.background = `var(--r-${t.role})`;
    const body = el('div','body');
    if (t.role || t.speaker) body.append(el('span','who', ROLE_LABEL[t.role] || t.speaker));
    body.append(el('span','tx', t.text));
    row.append(el('div','t tnum', clock(t.start_s)), spine, body);
    box.append(row);
  });
}

function renderTimeline(){
  const tl = $('#tl'); tl.innerHTML = '';
  $('#evCount').textContent = PI.D.events.length + ' events';
  if (!PI.D.events.length){
    tl.append(el('div','tl-empty','0 events extracted from this recording.\nToo short, too noisy, or not clinical speech.'));
    $('#tlWrap').style.setProperty('--h', '0');
    return;
  }
  const PX_PER_S = Math.min(2.4, Math.max(0.5, 900 / PI.dur));
  const Y = t => 16 + t * PX_PER_S;
  const H = Y(PI.dur) + 40;
  tl.style.height = H + 'px';
  tl.append(Object.assign(el('div','tl-axis'), {}));

  // phase bands from state snapshots
  const segs = [];
  let last = null;
  PI.D.states.forEach(s => {
    if (s.phase !== last){ segs.push({ t: s.as_of_s, phase: s.phase }); last = s.phase; }
  });
  const phaseColor = (i, n) => {
    const stops = ['--ph-cool','--ph-cool','--ph-mid','--ph-warm','--ph-warm','--ph-close','--ph-close'];
    return `var(${stops[Math.min(stops.length-1, Math.round(i/(Math.max(1,n-1))*(stops.length-1)))]})`;
  };
  segs.forEach((sg, i) => {
    const top = Y(sg.t), bot = i+1 < segs.length ? Y(segs[i+1].t) : Y(PI.dur);
    const p = el('div','phase'); p.style.top = top + 'px'; p.style.height = (bot - top) + 'px';
    const bar = el('div','bar'); bar.style.background = phaseColor(i, segs.length);
    p.append(bar, el('div','nm', String(sg.phase).replace(/_/g,' ')));
    tl.append(p);
  });

  // events
  PI.D.events.forEach(e => {
    const row = el('div','ev'); row.dataset.id = e.id;
    row.style.top = Y(e.t_start_s) + 'px';
    if (!evActive(e)) row.classList.add('future');
    if (PI.hotEv.has(e.id)) row.classList.add('hot');
    const node = el('div','node' + (e.confidence < 0.55 ? ' lowconf' : ''));
    const meta = el('div','meta');
    meta.append(el('div','ty', EV_LABEL[e.type] || e.type));
    meta.append(el('div','pl', payloadText(e)));
    if (e.by_role) meta.append(el('div','role', 'by ' + (ROLE_LABEL[e.by_role] || e.by_role)));
    row.append(node, meta);
    row.onmouseenter = () => traceEvent(e.id);
    row.onmouseleave = clearTrace;
    row.onclick = () => { PI.playT = e.t_start_s + 0.1; syncPlay(); };
    tl.append(row);
  });
  positionPlayhead();
}
function payloadText(e){
  const p = e.payload || {};
  if (e.type === 'phase_transition') return String(p.phase || '').replace(/_/g,' ');
  if (e.type === 'medication_given') return [p.name, p.dose, p.route].filter(Boolean).join(' ');
  if (e.type === 'blood_loss') return 'EBL ' + p.ebl_ml + ' mL';
  if (e.type === 'transfusion') return [p.units, p.product].filter(Boolean).join(' ');
  if (e.type === 'conversion') return `${p.from||''} → ${p.to||''}`;
  if (e.type === 'count_status') return 'counts ' + (p.status || '') + (p.intentional ? ' (intentional)' : '');
  if (e.type === 'disposition') return [p.destination, p.detail].filter(Boolean).join(' · ');
  return Object.values(p).filter(v => typeof v !== 'object').join(' · ') || e.type;
}

function positionPlayhead(){
  let ph = $('#tlPh');
  const tl = $('#tl');
  if (!PI.D.events.length){ if (ph) ph.remove(); return; }
  if (!ph){ ph = el('div','tl-playhead'); ph.id = 'tlPh'; tl.append(ph); }
  const PX_PER_S = Math.min(2.4, Math.max(0.5, 900 / PI.dur));
  const y = 16 + Math.min(PI.playT, PI.dur) * PX_PER_S;
  ph.style.top = y + 'px';
  ph.style.display = PI.playT >= PI.dur ? 'none' : 'block';
}

function renderBoard(){
  const S = stateAt(PI.playT), b = $('#board'); b.innerHTML = '';
  $('#asOf').textContent = PI.playT < PI.dur ? '@ ' + clock(PI.playT) : '@ final';
  const sev = severity(S);
  const rows = [
    ['phase', (S.phase||'').replace(/_/g,' '), 'phase'],
    ['severity', sevHTML(sev), null, true],
    ['EBL', S.ebl_ml != null ? S.ebl_ml + ' mL' : null, 'ebl_ml'],
    ['transfusions', txfText(S), 'transfusion_totals'],
    ['implants', (S.implants||[]).join(', ') || null, 'implants'],
    ['drains', (S.drains||[]).join(', ') || null, 'drains'],
    ['lines', (S.lines||[]).join(', ') || null, 'lines'],
    ['counts', S.counts || null, 'counts'],
    ['converted', S.converted || null, 'converted'],
    ['disposition', S.disposition || null, 'disposition'],
  ];
  rows.forEach(([k, v, field, isHTML]) => {
    const c = el('div','stat' + (v == null ? ' ghost' : ''));
    if (field && PI.hotField === field) c.classList.add('hot');
    c.append(el('div','k', k));
    const val = el('div','v'); if (isHTML) val.innerHTML = v; else val.textContent = v == null ? 'not documented' : v;
    c.append(val);
    if (field){ c.onmouseenter = () => traceField(field); c.onmouseleave = clearTrace; }
    b.append(c);
  });
}
function txfText(S){ const t = S.transfusion_totals || {}; const ks = Object.keys(t); return ks.length ? ks.map(k => `${t[k]} ${k}`).join(', ') : null; }
function severity(S){
  const comps = (S.complications||[]).length, conc = (S.open_concerns||[]).length;
  if (S.disposition && /icu/i.test(S.disposition) && (comps||conc)) return 'unstable';
  if (comps || conc || S.converted) return 'watcher';
  return 'stable';
}
function sevHTML(s){ return `<span class="sev ${s}"><span class="d"></span>${s}</span>`; }

function renderTabs(){
  const box = $('#tabs'); box.innerHTML = '';
  Object.keys(PI.D.drafts).forEach(k => {
    const dr = PI.D.drafts[k];
    const t = el('button','tab'); t.setAttribute('role','tab');
    t.setAttribute('aria-selected', String(k === PI.tab));
    t.append(el('span',null, k));
    if (k === 'handoff') t.append(el('span','fmt', PI.D.profile.handoff_name));
    const flags = (dr.unsupported_claims || []).filter(x => !/not generated|not fact-checked/.test(x));
    if (dr.accepted && dr.text && !dr.text.startsWith('[')) t.append(el('span','badge ok','fact-checked'));
    else if (flags.length) t.append(el('span','badge flag', flags.length + ' flag' + (flags.length>1?'s':'')));
    t.onclick = () => { PI.tab = k; renderTabs(); renderDoc(); };
    box.append(t);
  });
}

function renderDoc(){
  const host = $('#doc'); host.innerHTML = '';
  const dr = PI.D.drafts[PI.tab];
  if (!dr || !dr.text){ host.className = 'doc empty'; host.textContent = 'no draft'; return; }
  if (dr.text.startsWith('[')){ host.className = 'doc empty'; host.textContent = dr.text.replace(/^\[|\]$/g,''); return; }
  host.className = 'doc';
  const flags = (dr.unsupported_claims || []).filter(x => !/not generated|not fact-checked/.test(x));
  if (flags.length){
    const f = el('div','flags'); f.append(el('div',null,'Critic flagged as unverified:'));
    const ul = el('ul'); flags.forEach(x => ul.append(el('li', null, x))); f.append(ul); host.append(f);
  }
  const links = (PI.D.links[PI.tab] || []).slice().sort((a,b) => a.start - b.start);
  const text = dr.text;
  let i = 0;
  const frag = document.createDocumentFragment();
  const pushText = (str) => {
    str.split(/\n{2,}/).forEach((para, idx, arr) => {
      if (/^[A-Z][A-Za-z /&-]{2,40}:?\s*$/.test(para.trim()) && para.trim().length < 42){
        frag.append(el('h4', null, para.trim().replace(/:$/,'')));
      } else if (para.trim()){
        frag.append(el('p', null, para));
      }
    });
  };
  links.forEach(lk => {
    if (lk.start > i) pushText(text.slice(i, lk.start));
    const span = el('span','lk', text.slice(lk.start, lk.end));
    span.dataset.link = JSON.stringify({ ev: lk.event_ids, tn: lk.turn_ids, field: lk.field });
    span.title = lk.label;
    span.onmouseenter = () => { PI.hotEv = new Set(lk.event_ids); PI.hotTurn = new Set(lk.turn_ids); PI.hotField = lk.field; paintTrace(); };
    span.onmouseleave = clearTrace;
    // wrap the span in a <p> so block flow is preserved
    const p = el('p'); p.append(span); frag.append(p);
    i = lk.end;
  });
  if (i < text.length) pushText(text.slice(i));
  host.append(frag);
}

/* ---------- cross-highlight ---------- */
function traceEvent(id){
  const e = PI.D.events.find(x => x.id === id);
  PI.hotEv = new Set([id]);
  PI.hotTurn = new Set(e ? e.evidence_turn_ids : []);
  PI.hotField = null;
  // also light doc sentences that link to this event
  for (const k in PI.D.links) for (const lk of PI.D.links[k]) if (lk.event_ids.includes(id)) PI.hotField = lk.field;
  paintTrace();
}
function traceField(field){
  PI.hotField = field;
  const S = stateAt(1e9);
  const prov = (S.provenance || {})[field] || [];
  PI.hotEv = new Set(prov);
  PI.hotTurn = new Set(prov.flatMap(eid => (PI.D.events.find(e => e.id === eid) || {}).evidence_turn_ids || []));
  paintTrace();
}
function clearTrace(){ PI.hotEv.clear(); PI.hotTurn.clear(); PI.hotField = null; paintTrace(); }
function paintTrace(){
  document.querySelectorAll('.turn').forEach(r => {
    r.classList.toggle('hot', PI.hotTurn.has(r.dataset.id));
    r.classList.toggle('dim', PI.hotTurn.size > 0 && !PI.hotTurn.has(r.dataset.id));
  });
  document.querySelectorAll('.ev').forEach(r => r.classList.toggle('hot', PI.hotEv.has(r.dataset.id)));
  document.querySelectorAll('.stat').forEach((c, i) => {});
  renderBoard();
  if (PI.hotTurn.size){
    const first = [...document.querySelectorAll('.turn.hot')][0];
    if (first) first.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}

/* ---------- transport ---------- */
function syncPlay(){
  $('#scrubFill').style.width = Math.min(100, PI.playT / PI.dur * 100) + '%';
  $('#scrubKnob').style.left = Math.min(100, PI.playT / PI.dur * 100) + '%';
  $('#transClock').textContent = PI.playT < PI.dur ? clock(PI.playT) : clock(PI.dur);
  document.querySelectorAll('.ev').forEach(r => {
    const e = PI.D.events.find(x => x.id === r.dataset.id);
    r.classList.toggle('future', e && e.t_start_s > PI.playT);
  });
  positionPlayhead(); renderBoard();
}
function setPlayFromX(clientX){
  const r = $('#scrub').getBoundingClientRect();
  PI.playT = Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * PI.dur;
  syncPlay();
}
function play(){
  PI.playing = !PI.playing;
  $('#playBtn').innerHTML = PI.playing ? '&#10073;&#10073;' : '&#9654;';
  if (!PI.playing) { cancelAnimationFrame(PI.raf); return; }
  if (PI.playT >= PI.dur) PI.playT = 0;
  let last = performance.now();
  const step = now => {
    if (!PI.playing) return;
    PI.playT += (now - last) / 1000 * 45; last = now;   // 45x speed
    if (PI.playT >= PI.dur){ PI.playT = PI.dur; PI.playing = false; $('#playBtn').innerHTML = '&#9654;'; syncPlay(); return; }
    syncPlay(); PI.raf = requestAnimationFrame(step);
  };
  PI.raf = requestAnimationFrame(step);
}
function replay(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){ PI.playT = 1e9; syncPlay(); return; }
  PI.playT = 0; PI.playing = false; syncPlay();
  let last = performance.now();
  const dur = 2600, t0 = last;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    PI.playT = k * PI.dur;
    syncPlay();
    if (k < 1) requestAnimationFrame(step);
    else { PI.playT = 1e9; syncPlay(); }
  };
  requestAnimationFrame(step);
}

/* ---------- wire ---------- */
function wire(){
  $('#hint').dataset.def = $('#hint').textContent;
  $('#playBtn').onclick = play;
  $('#replayBtn').onclick = replay;
  const sc = $('#scrub');
  let drag = false;
  sc.onpointerdown = e => { drag = true; sc.setPointerCapture(e.pointerId); setPlayFromX(e.clientX); };
  sc.onpointermove = e => { if (drag) setPlayFromX(e.clientX); };
  sc.onpointerup = e => { drag = false; };
  $('#search').oninput = e => { PI.q = e.target.value.toLowerCase().trim(); renderTurns(); };
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme:dark)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
  };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' '){ e.preventDefault(); play(); }
    if (e.key === 'r') replay();
  });
}
boot();
</script>
